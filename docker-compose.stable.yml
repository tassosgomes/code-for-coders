services:
  media-edge:
    environment:
      MEDIA_EDGE_SPA_ORIGIN: https://code4coders.tasso.dev.br

  identity:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      StudentAccount__ConfirmationBaseUrl: https://code4coders.tasso.dev.br/students/confirm-account
      StudentAccount__PasswordResetBaseUrl: https://code4coders.tasso.dev.br/students/redefinir-senha
      StaffAccount__PasswordResetBaseUrl: https://code4coders.tasso.dev.br/admin/redefinir-senha
      StaffInvitation__AcceptanceBaseUrl: https://code4coders.tasso.dev.br/admin/convite

  learning:
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  media:
    environment:
      Transcription__Enabled: ${TRANSCRIPTION_ENABLED:-false}
      ASPNETCORE_ENVIRONMENT: Production

  media-worker:
    environment:
      Transcription__Enabled: ${TRANSCRIPTION_ENABLED:-false}
      Transcription__Service__BaseAddress: ${WHISPER_BASE_ADDRESS:-https://whisper.lab.tasso.dev.br/v1}
      Transcription__Service__ApiKey: ${WHISPER_API_KEY:-}
      AwsMedia__EndpointTranscription: ${AWS_S3_TRANSCRIPTION_ENDPOINT:-http://192.168.0.11:9000}
      Transcription__SourceUrlLifetimeMinutes: ${TRANSCRIPTION_SOURCE_URL_LIFETIME_MINUTES:-90}
      Transcription__MaxWaitHours: ${TRANSCRIPTION_MAX_WAIT_HOURS:-30}
      Transcription__MaxConcurrency: ${TRANSCRIPTION_MAX_CONCURRENCY:-1}
      Transcription__MaxSubmissions: ${TRANSCRIPTION_MAX_SUBMISSIONS:-3}
      Transcription__InitialPollSeconds: ${TRANSCRIPTION_INITIAL_POLL_SECONDS:-60}
      Transcription__IntermediatePollSeconds: ${TRANSCRIPTION_INTERMEDIATE_POLL_SECONDS:-300}
      Transcription__LongPollSeconds: ${TRANSCRIPTION_LONG_POLL_SECONDS:-900}
      Transcription__MinimumFreeDiskBytes: ${TRANSCRIPTION_MINIMUM_FREE_DISK_BYTES:-2147483648}
      ASPNETCORE_ENVIRONMENT: Production

  commerce:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      StudentApp__PublicBaseUrl: https://code4coders.tasso.dev.br/students

  billing:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PaymentReturn__AllowedHosts__0: code4coders.tasso.dev.br

  notification:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Email__Transport: http

  audit:
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  bff-admin:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BffSecurity__AllowedOrigins__0: https://code4coders.tasso.dev.br

  bff-student:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: https://code4coders.tasso.dev.br

  admin-spa:
    environment:
      API_URL: https://code4coders.tasso.dev.br/admin
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:18081:8080"

  student-spa:
    environment:
      API_URL: https://code4coders.tasso.dev.br/students
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:18082:8080"
