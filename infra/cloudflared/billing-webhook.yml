# Ingress do tunnel c4c-billing-webhook (Cloudflare Tunnel) usado pelo serviço
# cloudflared-billing-webhook do docker-compose.komodo.apis.yml.
# Expõe o webhook do Stripe do billing em hostname próprio e o frontend de dev
# (admin-spa e student-spa, que já fazem proxy mesma-origem para os BFFs) mais o
# media-edge no hostname dev-code4coders.tasso.dev.br; qualquer outro caminho responde 404.
# As regras são avaliadas na ordem: Stripe primeiro, depois o app, depois o catch-all.
# As credenciais do tunnel são fornecidas pelo ambiente de execução em TUNNEL_CRED_CONTENTS.
tunnel: 9e0b7c67-7c3b-4fc9-844b-f6e00242f69a
ingress:
  - hostname: billing-webhook.tasso.dev.br
    path: ^/webhooks/v1/stripe/events$
    service: http://billing:8080
  - hostname: dev-code4coders.tasso.dev.br
    path: ^/admin.*
    service: http://admin-spa:8080
  - hostname: dev-code4coders.tasso.dev.br
    path: ^/students.*
    service: http://student-spa:8080
  - hostname: dev-code4coders.tasso.dev.br
    path: ^/media.*
    service: http://media-edge:8080
  - service: http_status:404
