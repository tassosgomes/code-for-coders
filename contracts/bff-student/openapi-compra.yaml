openapi: 3.1.0
info:
  title: BFF do aluno — compra e pedidos
  version: 1.0.0
  description: 'Recorte de `CAP-011`, `tasks/prd-compra-avulsa/prd.md` v1.0, aprovado em 2026-10-05. **Contrato
    novo** da fronteira `student-spa` → `bff-student` para a compra: resumo, pedido, ida ao pagamento, desistência
    e *Meus pedidos* (RF-01 a RF-06, RF-10).


    O BFF não decide nada: valida a sessão do aluno em Identity (ADR-0003), obtém o JWT de aluno com audiência `commerce`
    (C-03) e repassa a `commerce`, que é o dono do pedido. Toda operação exige a sessão do aluno: um visitante recebe
    401 e o cliente o leva a entrar ou criar conta, voltando depois à mesma opção de compra (RF-01). Escritas exigem
    `X-CSRF-Token` (G18). As operações de vitrine, conta, aula e progresso não mudam; o clique anônimo de intenção
    de compra é depreciado em `api-contract-vitrine.yaml`.


    O pagamento acontece fora da plataforma, na página do gateway (DP-01): o BFF devolve o endereço, o cliente navega
    para ele, e o aluno volta para a página de retorno do pedido. Nenhum dado de cartão, CPF ou nome do pagador
    passa por aqui (RN-CB01).

    '
  contact:
    name: Time de Commerce
servers:
- url: /api/v1
  description: URL pública versionada do BFF do aluno
tags:
- name: Compra
  description: Resumo, pedido, pagamento e desistência
- name: Meus pedidos
  description: Pedidos do próprio aluno
paths:
  /offers/{offerId}/purchase-summary:
    parameters:
    - $ref: '#/components/parameters/OfferId'
    get:
      tags:
      - Compra
      summary: Resumir a compra de uma opção
      description: 'Curso, opção, preço e vigência que o pedido congelaria agora (RF-01), o aviso de acesso já existente
        (RF-02) e o pedido pendente nesta opção, se houver (RN-V06). Sem efeito. Repasse de `getPurchaseSummaryInternal`.

        '
      operationId: getPurchaseSummary
      security:
      - StudentSessionCookie: []
      responses:
        '200':
          description: Resumo da compra.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSummary'
              examples:
                comCortesia:
                  value:
                    course:
                      courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                      title: .NET do zero à API
                    offer:
                      offerId: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
                      name: Acesso vitalício
                      priceCents: 89700
                      currency: BRL
                      accessPeriod:
                        type: lifetime
                    pendingOrderId: null
                    existingAccessChecked: true
                    existingAccess:
                      origin: courtesy
                      validity:
                        type: until
                        endsOn: '2026-11-30'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/OfferNotAvailable'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      x-frontend-notes: 'Com `pendingOrderId`, o botão leva a `/pedidos/{pendingOrderId}` em vez de criar pedido.
        Com `existingAccess`, mostra "Você já tem acesso a este curso até DD/MM/AAAA (cortesia)" ou "acesso vitalício",
        sem bloquear. 401 → entrar ou criar conta, voltando para esta opção.

        '
  /orders:
    post:
      tags:
      - Compra
      summary: Criar o pedido de uma opção
      description: 'Cria o pedido com preço e vigência congelados agora (RF-03). Se já existe pedido do aluno aguardando
        pagamento nesta opção, devolve **esse** com 200, sem criar outro (RN-V06). `Idempotency-Key` gerada pelo
        cliente por confirmação: o mesmo clique repetido pela rede devolve o mesmo pedido (RF-03, último critério).
        Repasse de `createOrderInternal`.

        '
      operationId: createOrder
      security:
      - StudentSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
            examples:
              dozeMeses:
                value:
                  offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
      responses:
        '201':
          description: Pedido criado.
          headers:
            Location:
              description: Endereço do pedido criado.
              schema:
                type: string
                examples:
                - /api/v1/orders/1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                criado:
                  $ref: '#/components/examples/OrderAwaitingNoMethod'
        '200':
          description: Pedido pendente já existente nesta opção (RN-V06).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                pendente:
                  $ref: '#/components/examples/OrderAwaitingBoleto'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/OfferNotAvailable'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
    get:
      tags:
      - Meus pedidos
      summary: Listar meus pedidos
      description: Pedidos do aluno da sessão, do mais recente para o mais antigo, com o que cada um congelou (RF-10).
        Repasse de `listStudentOrdersInternal`.
      operationId: listMyOrders
      security:
      - StudentSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de pedidos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                um:
                  value:
                    data:
                    - orderId: 2c3d4e5f-6071-4829-8b3c-4d5e6f7a8b92
                      number: '000124'
                      status: awaiting-payment
                      course:
                        courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                        title: React na prática
                      offer:
                        offerId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                        name: Acesso por 6 meses
                      priceCents: 29700
                      currency: BRL
                      accessPeriod:
                        type: months
                        months: 6
                      paymentMethod: boleto
                      pendingPayment:
                        method: boleto
                        expiresAt: '2026-10-09T02:59:59Z'
                      paymentPageExpiresAt: null
                      accessGrantedAt: null
                      createdAt: '2026-10-06T10:00:00Z'
                      paidAt: null
                      expiredAt: null
                      cancelledAt: null
                    pagination:
                      page: 1
                      size: 10
                      total: 1
                      totalPages: 1
                vazio:
                  value:
                    data: []
                    pagination:
                      page: 1
                      size: 10
                      total: 0
                      totalPages: 0
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      tags:
      - Meus pedidos
      summary: Obter um pedido meu
      description: 'A situação real do pedido, para a página de retorno e para a retomada (RF-05, RF-06). A página
        de retorno consulta de novo a cada poucos segundos enquanto o pedido estiver `awaiting-payment` sem `pendingPayment`
        depois de o aluno ter concluído na página do gateway ("Confirmando"), e para quando a situação muda; passados
        2 minutos, mostra o aviso de demora (RF-05). Pedido de outro aluno → 404, como inexistente. Repasse de `getStudentOrderInternal`.

        '
      operationId: getMyOrder
      security:
      - StudentSessionCookie: []
      responses:
        '200':
          description: O pedido.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                pago:
                  $ref: '#/components/examples/OrderPaid'
                boleto:
                  $ref: '#/components/examples/OrderAwaitingBoleto'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
      x-frontend-notes: 'A volta do gateway chega como `/pedidos/{orderId}?resultado=concluido` ou `?resultado=saiu`.
        `paid` com `accessGrantedAt` → *Ir para o curso*; `paid` sem ele → "Liberando seu acesso", consultando de
        novo. A mudança para "Compra confirmada" é anunciada a leitor de tela.

        '
  /orders/{orderId}/payment-session:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Compra
      summary: Ir para o pagamento
      description: 'Devolve o endereço do gateway para onde o cliente navega: a página de pagamento ou, com PIX
        ou boleto já gerados, as instruções deles (RF-04, RF-06). Repetir é seguro. Pedido pago, expirado ou cancelado
        → 422 `ORDER_NOT_PAYABLE`. Gateway indisponível → 503 `PAYMENT_PROVIDER_UNAVAILABLE`, e o cliente oferece
        *Tentar de novo*, que usa o mesmo pedido. O BFF não guarda nem registra `paymentUrl`. Repasse de `startOrderPaymentInternal`.

        '
      operationId: startOrderPayment
      security:
      - StudentSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Para onde levar o aluno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRedirect'
              examples:
                pagina:
                  value:
                    orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
                    kind: checkout
                    paymentUrl: https://checkout.stripe.com/c/pay/cs_test_a1B2c3D4e5F6g7H8
                    expiresAt: '2026-10-06T14:20:00Z'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/OrderNotPayable'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/PaymentProviderUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /orders/{orderId}/cancellation:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Compra
      summary: Desistir do pedido
      description: Desiste de um pedido aguardando pagamento (RF-06, RN-V07); repetir em pedido já cancelado devolve
        ele. Pedido pago ou expirado → 422 `ORDER_NOT_CANCELLABLE`. Depois, `createOrder` na mesma opção cria pedido
        novo pelas condições vigentes. Repasse de `cancelOrderInternal`.
      operationId: cancelMyOrder
      security:
      - StudentSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                cancelado:
                  $ref: '#/components/examples/OrderCancelled'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/OrderNotCancellable'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
components:
  securitySchemes:
    StudentSessionCookie:
      type: apiKey
      in: cookie
      name: student_session
      description: Cookie opaco de sessão do aluno, HttpOnly, Secure e SameSite (CAP-001). O BFF valida a sessão
        em Identity a cada ação protegida (ADR-0003). Nenhum bearer token chega ao navegador.
  headers:
    NoStore:
      description: '`private, no-store`: a situação do pedido muda com o tempo.'
      schema:
        type: string
        examples:
        - private, no-store
  parameters:
    Page:
      name: _page
      in: query
      required: false
      description: Página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Prova CSRF vinculada à sessão do aluno (`csrfToken` de `getCurrentStudentSession`).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca por confirmação de compra (G09). Mesma chave e mesmo corpo → mesmo resultado em 24
        horas; corpo diferente → 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OfferId:
      name: offerId
      in: path
      required: true
      description: Opção de compra (oferta) escolhida na página do curso.
      schema:
        type: string
        format: uuid
      examples:
        dozeMeses:
          value: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identificador do pedido.
      schema:
        type: string
        format: uuid
      examples:
        pedido:
          value: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
  schemas:
    OrderPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          type: object
          additionalProperties: false
          required:
          - page
          - size
          - total
          - totalPages
          properties:
            page:
              type: integer
            size:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        instance:
          type: string
    PriceCents:
      type: integer
      minimum: 1
      maximum: 9999999
      description: Valor em centavos de real (BRL), à vista.
    Currency:
      type: string
      const: BRL
    AccessPeriod:
      description: Vigência prometida, contada a partir da liberação do acesso (RN-D04) — por meses inteiros ou
        vitalícia.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - months
        properties:
          type:
            const: months
          months:
            type: integer
            minimum: 1
            maximum: 60
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: lifetime
    OrderStatus:
      type: string
      enum:
      - awaiting-payment
      - paid
      - expired
      - cancelled
      description: Aguardando pagamento, pago, expirado ou cancelado (RN-V05). Clientes devem tolerar valor novo.
    PaymentMethod:
      type: string
      enum:
      - card
      - pix
      - boleto
      description: Cartão de crédito, PIX ou boleto. Clientes devem tolerar valor novo.
    PendingPayment:
      type: object
      additionalProperties: false
      required:
      - method
      - expiresAt
      properties:
        method:
          type: string
          enum:
          - pix
          - boleto
        expiresAt:
          type: string
          format: date-time
          description: Prazo do PIX ou vencimento do boleto.
    CourseRef:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
    OfferRef:
      type: object
      additionalProperties: false
      required:
      - offerId
      - name
      properties:
        offerId:
          type: string
          format: uuid
        name:
          type: string
    SummaryOffer:
      type: object
      additionalProperties: false
      required:
      - offerId
      - name
      - priceCents
      - currency
      - accessPeriod
      properties:
        offerId:
          type: string
          format: uuid
        name:
          type: string
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        currency:
          $ref: '#/components/schemas/Currency'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
    ExistingAccess:
      type: object
      additionalProperties: false
      required:
      - origin
      - validity
      properties:
        origin:
          type: string
          enum:
          - courtesy
          - purchase
          - subscription
          - cohort
          description: Origem, para o texto do aviso ("cortesia", "compra"). Clientes devem tolerar valor novo.
        validity:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - type
            - endsOn
            properties:
              type:
                const: until
              endsOn:
                type: string
                format: date
                description: Último dia de acesso, no fuso da escola.
          - type: object
            additionalProperties: false
            required:
            - type
            properties:
              type:
                const: lifetime
    PurchaseSummary:
      type: object
      additionalProperties: false
      required:
      - course
      - offer
      - pendingOrderId
      - existingAccessChecked
      - existingAccess
      properties:
        course:
          $ref: '#/components/schemas/CourseRef'
        offer:
          $ref: '#/components/schemas/SummaryOffer'
        pendingOrderId:
          type:
          - string
          - 'null'
          format: uuid
        existingAccessChecked:
          type: boolean
          description: Falso quando não foi possível verificar; o aviso some e a compra segue.
        existingAccess:
          oneOf:
          - $ref: '#/components/schemas/ExistingAccess'
          - type: 'null'
    CreateOrderInput:
      type: object
      additionalProperties: false
      required:
      - offerId
      properties:
        offerId:
          type: string
          format: uuid
    Order:
      type: object
      additionalProperties: false
      required:
      - orderId
      - number
      - status
      - course
      - offer
      - priceCents
      - currency
      - accessPeriod
      - paymentMethod
      - pendingPayment
      - paymentPageExpiresAt
      - accessGrantedAt
      - createdAt
      - paidAt
      - expiredAt
      - cancelledAt
      properties:
        orderId:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^[0-9]{6,}$
          description: Número do pedido ("Pedido nº 000123").
        status:
          $ref: '#/components/schemas/OrderStatus'
        course:
          $ref: '#/components/schemas/CourseRef'
        offer:
          $ref: '#/components/schemas/OfferRef'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        currency:
          $ref: '#/components/schemas/Currency'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - type: 'null'
        pendingPayment:
          oneOf:
          - $ref: '#/components/schemas/PendingPayment'
          - type: 'null'
        paymentPageExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
        accessGrantedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Quando o acesso foi liberado. Exibição; o acesso em si é decidido por Matrícula.
        createdAt:
          type: string
          format: date-time
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
        expiredAt:
          type:
          - string
          - 'null'
          format: date-time
        cancelledAt:
          type:
          - string
          - 'null'
          format: date-time
    PaymentRedirect:
      type: object
      additionalProperties: false
      required:
      - orderId
      - kind
      - paymentUrl
      - expiresAt
      properties:
        orderId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - checkout
          - pix-instructions
          - boleto-instructions
        paymentUrl:
          type: string
          format: uri
          description: Endereço do gateway. O cliente navega para ele e não o guarda.
        expiresAt:
          type: string
          format: date-time
  examples:
    OrderAwaitingNoMethod:
      summary: Pedido criado
      value:
        orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
        number: '000123'
        status: awaiting-payment
        course:
          courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
          title: .NET do zero à API
        offer:
          offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
          name: Acesso por 12 meses
        priceCents: 49700
        currency: BRL
        accessPeriod:
          type: months
          months: 12
        paymentMethod: null
        pendingPayment: null
        paymentPageExpiresAt: null
        accessGrantedAt: null
        createdAt: '2026-10-05T14:19:30Z'
        paidAt: null
        expiredAt: null
        cancelledAt: null
    OrderAwaitingBoleto:
      summary: Boleto gerado, ainda não pago
      value:
        orderId: 2c3d4e5f-6071-4829-8b3c-4d5e6f7a8b92
        number: '000124'
        status: awaiting-payment
        course:
          courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
          title: React na prática
        offer:
          offerId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          name: Acesso por 6 meses
        priceCents: 29700
        currency: BRL
        accessPeriod:
          type: months
          months: 6
        paymentMethod: boleto
        pendingPayment:
          method: boleto
          expiresAt: '2026-10-09T02:59:59Z'
        paymentPageExpiresAt: null
        accessGrantedAt: null
        createdAt: '2026-10-06T10:00:00Z'
        paidAt: null
        expiredAt: null
        cancelledAt: null
    OrderPaid:
