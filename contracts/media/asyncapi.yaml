asyncapi: 3.0.0
info:
  title: Media — fatos da preparação de vídeo e registro das Referências de Uso
  version: 1.1.0
  description: |
    Contrato **vigente** consolidado. Fronteira: Aplicação `media`.

    Fonte da verdade do contrato desta fronteira. Mudanças entram por PR neste arquivo, promovidas a partir do recorte do PRD (ver `contracts/README.md`). Os documentos de origem, arquivados, são só histórico:

    - `tasks/archive/prd-ingestao-midia/asyncapi-contract.yaml` 1.0.0
    - `tasks/archive/prd-autoria-curso/asyncapi-contract-media.yaml` 1.1.0

    **Notas de prd-ingestao-midia (1.0.0):** Recorte de CAP-006, PRD `tasks/archive/prd-ingestao-midia/prd.md` v1.0 de 2026-09-25 (RF-09). Aplicação produtora Media. Nenhuma mensagem recebida neste escopo; a Referência de Uso (OD30) chega com CAP-005/CAP-007. Consumidor previsto: Conteúdo e Currículo (`learning`), em CAP-005, para manter a própria visão de quais vídeos estão prontos para vínculo (C-12). Os fatos não carregam título, nome de arquivo, nome do autor, endereço de armazenamento nem chave.

    **Notas de prd-autoria-curso (1.1.0):** Recorte do primeiro PRD de CAP-005, `tasks/archive/prd-autoria-curso/prd.md` v1.0 de 2026-09-28 (RF-12, DP-04). Acrescenta à aplicação Media a recepção de `conteudo.versao-publicada`. Os fatos que Media produz (`tasks/archive/prd-ingestao-midia/asyncapi-contract.yaml` 1.0.0) não mudam e não são repetidos aqui. Nenhuma interface HTTP de Media muda; o uso das referências na abertura de sessão é de CAP-007 (RN-M10).
id: urn:code-4-coders:media
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: RabbitMQ do baseline; topologia física e credenciais são configuração de implantação.
    variables:
      host:
        default: localhost
channels:
  ativoPronto:
    address: midia.ativo-pronto.v1
    description: Publicar que um vídeo ficou pronto para vínculo e reprodução.
    messages:
      ativoPronto:
        $ref: '#/components/messages/AtivoPronto'
  preparacaoFalhou:
    address: midia.preparacao-falhou.v1
    description: Publicar que a preparação de um vídeo esgotou as tentativas.
    messages:
      preparacaoFalhou:
        $ref: '#/components/messages/PreparacaoFalhou'
  versaoPublicada:
    address: conteudo.versao-publicada.v1
    description: Fato de `learning` (`asyncapi-contract.yaml` 1.0.0 desta pasta), sem mudança.
    messages:
      versaoPublicada:
        $ref: ../learning/asyncapi.yaml#/components/messages/VersaoPublicada
operations:
  publicarAtivoPronto:
    action: send
    summary: Publicar fato de vídeo pronto.
    channel:
      $ref: '#/channels/ativoPronto'
    messages:
    - $ref: '#/channels/ativoPronto/messages/ativoPronto'
    description: 'Publicação pelo outbox na mesma transação da mudança para `ready` (G06). Um fato por vídeo: `eventId`
      é fixo para aquela transição, e toda republicação repete o mesmo `eventId`. Entrega ao menos uma vez; consumidores
      deduplicam por `eventId`. Não há ordenação garantida entre canais; um vídeo nunca publica os dois fatos, porque
      `ready` e `failed` são finais (RN-M05).'
  publicarPreparacaoFalhou:
    action: send
    summary: Publicar fato de preparação que falhou.
    channel:
      $ref: '#/channels/preparacaoFalhou'
    messages:
    - $ref: '#/channels/preparacaoFalhou/messages/preparacaoFalhou'
    description: Publicação pelo outbox na mesma transação da mudança para `failed`, só depois de esgotadas as tentativas
      automáticas. Mesmas garantias de `publicarAtivoPronto`.
  receberVersaoPublicada:
    action: receive
    summary: Substituir as Referências de Uso do curso pelas da versão vigente.
    channel:
      $ref: '#/channels/versaoPublicada'
    messages:
    - $ref: '#/channels/versaoPublicada/messages/versaoPublicada'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Compromissos observáveis (o mecanismo fica na TechSpec). (1) Para cada aula da versão, registra
      a Referência de Uso (`courseId`, `lessonId`) → `videoId`, na escola do fato. Guarda só identificadores: `title`
      de curso, módulo e aula é descartado (RN-M02). (2) As referências de um curso são as da maior `versionNumber`
      aplicada. A nova versão substitui o conjunto anterior por inteiro; referência a aula ausente deixa de valer
      (DP-04). (3) Fato com `versionNumber` menor ou igual ao já aplicado para o curso é confirmado sem efeito.
      Reentrega com o mesmo `eventId` não muda nada. (4) Vídeo desconhecido ou de outra escola não é criado nem
      associado; a referência é registrada mesmo assim, como RN-M09 prevê para ativo ainda não pronto, e nenhuma
      sessão abre para ela (RN-M05). (5) Falha transitória não confirma a mensagem, que volta; esgotadas as entregas,
      segue para a fila de erro e pode ser reprocessada sem efeito duplicado, por (2) e (3).'
components:
  messages:
    AtivoPronto:
      name: AtivoPronto
      title: Vídeo pronto
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Headers'
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - tenantId
        - videoId
        - occurredAt
        - durationSeconds
        description: 'A Versão de Reprodução do vídeo existe e ele pode ser vinculado e reproduzido. Não diz quais
          qualidades foram geradas: isso é detalhe de entrega de Media.'
        properties:
          eventId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
            description: Escola dona do vídeo.
          videoId:
            type: string
            format: uuid
            description: O mesmo identificador de `videoId` na interface HTTP.
          occurredAt:
            type: string
            format: date-time
          durationSeconds:
            type: integer
            minimum: 1
      examples:
      - name: pronto
        headers:
          correlationId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        payload:
          eventId: 8d7c6b5a-4e3f-4a2b-9c1d-0e9f8a7b6c5d
          tenantId: 2b3c4d5e-6f70-4a81-9b2c-3d4e5f607182
          videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
          occurredAt: '2026-09-26T10:05:12Z'
          durationSeconds: 2415
    PreparacaoFalhou:
      name: PreparacaoFalhou
      title: Preparação falhou
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Headers'
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - tenantId
        - videoId
        - occurredAt
        - reason
        description: O vídeo não ficará pronto; o caminho é reenviar como vídeo novo.
        properties:
          eventId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          videoId:
            type: string
            format: uuid
          occurredAt:
            type: string
            format: date-time
          reason:
            type: string
            enum:
            - unreadable-file
            - unsupported-format
            - duration-exceeded
            - preparation-failed
            description: Mesma categoria de `failureReason` na interface HTTP. Consumidor deve tolerar valor novo.
      examples:
      - name: ilegivel
        headers:
          correlationId: 00-1a2b3c4d5e6f708192a3b4c5d6e7f809-1a2b3c4d5e6f7081-01
        payload:
          eventId: 4c5d6e7f-8091-4a2b-8c3d-4e5f60718293
          tenantId: 2b3c4d5e-6f70-4a81-9b2c-3d4e5f607182
          videoId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
          occurredAt: '2026-09-26T08:21:40Z'
          reason: unreadable-file
  schemas:
    Headers:
      type: object
      additionalProperties: false
      required:
      - correlationId
      properties:
        correlationId:
          type: string
          description: traceparent da conclusão do envio que originou a preparação.
