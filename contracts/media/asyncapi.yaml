asyncapi: 3.0.0
info:
  title: Media — fatos da preparação de vídeo, Referências de Uso e avanço da reprodução
  version: 1.3.0
  description: |
    Contrato **vigente** consolidado. Fronteira: Aplicação `media`.

    Fonte da verdade do contrato desta fronteira. Mudanças entram por PR neste arquivo, promovidas a partir do recorte do PRD (ver `contracts/README.md`). Os documentos de origem, arquivados, são só histórico:

    - `tasks/archive/prd-ingestao-midia/asyncapi-contract.yaml` 1.0.0
    - `tasks/archive/prd-autoria-curso/asyncapi-contract-media.yaml` 1.1.0
    - `tasks/archive/prd-reproducao-protegida/asyncapi-contract.yaml` 1.2.0
    - `tasks/archive/prd-progresso-aluno/asyncapi-contract-media.yaml` 1.3.0

    **Notas de prd-ingestao-midia (1.0.0):** Recorte de CAP-006, PRD `tasks/archive/prd-ingestao-midia/prd.md` v1.0 de 2026-09-25 (RF-09). Aplicação produtora Media. Nenhuma mensagem recebida neste escopo; a Referência de Uso (OD30) chega com CAP-005/CAP-007. Consumidor previsto: Conteúdo e Currículo (`learning`), em CAP-005, para manter a própria visão de quais vídeos estão prontos para vínculo (C-12). Os fatos não carregam título, nome de arquivo, nome do autor, endereço de armazenamento nem chave.

    **Notas de prd-autoria-curso (1.1.0):** Recorte do primeiro PRD de CAP-005, `tasks/archive/prd-autoria-curso/prd.md` v1.0 de 2026-09-28 (RF-12, DP-04). Acrescenta à aplicação Media a recepção de `conteudo.versao-publicada`. Os fatos que Media produz (`tasks/archive/prd-ingestao-midia/asyncapi-contract.yaml` 1.0.0) não mudam e não são repetidos aqui. Nenhuma interface HTTP de Media muda; o uso das referências na abertura de sessão é de CAP-007 (RN-M10).

    **Notas de prd-reproducao-protegida (1.2.0):** Recorte de `CAP-007`, `tasks/archive/prd-reproducao-protegida/prd.md` v1.0 de 2026-10-03 (RF-07). Acrescenta à aplicação produtora Media o fato `midia.reproducao-avancou.v1` (canal `reproducaoAvancou`, mensagem `reproducaoAvancou`, operação `publicarReproducaoAvancou`). Os fatos da preparação e a recepção da Referência de Uso não mudam. Consumidor previsto: Aprendizagem e Progresso (`learning`), em `CAP-017`; nenhum consumidor nesta entrega.

    **Notas de prd-progresso-aluno (1.3.0):** Recorte de `CAP-017`, `tasks/archive/prd-progresso-aluno/prd.md` v1.0 de 2026-10-04 (RF-01). Aplicação `media`. Evolui `contracts/media/asyncapi.yaml` 1.2.0 de forma aditiva com uma operação de envio única: o reenvio dos fatos `midia.reproducao-avancou.v1` retidos desde `CAP-007`, que o compromisso (5) de `publicarReproducaoAvancou` previu "quando `CAP-017` existir". A mensagem, o canal e as demais operações não mudam.
id: urn:code-4-coders:media
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: RabbitMQ do baseline; topologia física e credenciais são configuração de implantação.
    variables:
      host:
        default: localhost
channels:
  ativoPronto:
    address: midia.ativo-pronto.v1
    description: Publicar que um vídeo ficou pronto para vínculo e reprodução.
    messages:
      ativoPronto:
        $ref: '#/components/messages/AtivoPronto'
  preparacaoFalhou:
    address: midia.preparacao-falhou.v1
    description: Publicar que a preparação de um vídeo esgotou as tentativas.
    messages:
      preparacaoFalhou:
        $ref: '#/components/messages/PreparacaoFalhou'
  versaoPublicada:
    address: conteudo.versao-publicada.v1
    description: Fato de `learning` (`asyncapi-contract.yaml` 1.0.0 desta pasta), sem mudança.
    messages:
      versaoPublicada:
        $ref: ../learning/asyncapi.yaml#/components/messages/VersaoPublicada
  reproducaoAvancou:
    address: midia.reproducao-avancou.v1
    description: Avanço bruto de uma sessão de reprodução. O endereço não carrega dado pessoal (G23).
    messages:
      reproducaoAvancou:
        $ref: '#/components/messages/ReproducaoAvancou'
operations:
  publicarAtivoPronto:
    action: send
    summary: Publicar fato de vídeo pronto.
    channel:
      $ref: '#/channels/ativoPronto'
    messages:
    - $ref: '#/channels/ativoPronto/messages/ativoPronto'
    description: 'Publicação pelo outbox na mesma transação da mudança para `ready` (G06). Um fato por vídeo: `eventId`
      é fixo para aquela transição, e toda republicação repete o mesmo `eventId`. Entrega ao menos uma vez; consumidores
      deduplicam por `eventId`. Não há ordenação garantida entre canais; um vídeo nunca publica os dois fatos, porque
      `ready` e `failed` são finais (RN-M05).'
  publicarPreparacaoFalhou:
    action: send
    summary: Publicar fato de preparação que falhou.
    channel:
      $ref: '#/channels/preparacaoFalhou'
    messages:
    - $ref: '#/channels/preparacaoFalhou/messages/preparacaoFalhou'
    description: Publicação pelo outbox na mesma transação da mudança para `failed`, só depois de esgotadas as tentativas
      automáticas. Mesmas garantias de `publicarAtivoPronto`.
  receberVersaoPublicada:
    action: receive
    summary: Substituir as Referências de Uso do curso pelas da versão vigente.
    channel:
      $ref: '#/channels/versaoPublicada'
    messages:
    - $ref: '#/channels/versaoPublicada/messages/versaoPublicada'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Compromissos observáveis (o mecanismo fica na TechSpec). (1) Para cada aula da versão, registra
      a Referência de Uso (`courseId`, `lessonId`) → `videoId`, na escola do fato. Guarda só identificadores: `title`
      de curso, módulo e aula é descartado (RN-M02). (2) As referências de um curso são as da maior `versionNumber`
      aplicada. A nova versão substitui o conjunto anterior por inteiro; referência a aula ausente deixa de valer
      (DP-04). (3) Fato com `versionNumber` menor ou igual ao já aplicado para o curso é confirmado sem efeito.
      Reentrega com o mesmo `eventId` não muda nada. (4) Vídeo desconhecido ou de outra escola não é criado nem
      associado; a referência é registrada mesmo assim, como RN-M09 prevê para ativo ainda não pronto, e nenhuma
      sessão abre para ela (RN-M05). (5) Falha transitória não confirma a mensagem, que volta; esgotadas as entregas,
      segue para a fila de erro e pode ser reprocessada sem efeito duplicado, por (2) e (3).'
  publicarReproducaoAvancou:
    action: send
    summary: Publicar o avanço de uma sessão de reprodução.
    channel:
      $ref: '#/channels/reproducaoAvancou'
    messages:
    - $ref: '#/channels/reproducaoAvancou/messages/reproducaoAvancou'
    description: 'Compromissos observáveis (o mecanismo fica na TechSpec). (1) Pelo outbox (G06), a partir de `recordPlaybackProgress`.
      (2) Um fato por (`sessionId`, `sequence`): `eventId` é fixo e toda republicação o repete; entrega ao menos
      uma vez, consumidores deduplicam por `eventId` (G09). (3) Ordenação não garantida entre fatos; para a mesma
      sessão vale `sequence`. (4) Cadência: no máximo um fato a cada 30 s de reprodução contínua mais um a cada
      pausa, saída e fim, com intervalo mínimo de 10 s entre dois fatos da mesma sessão (RN-R05); nunca um fato
      por segundo (RN-M14). (5) **Retenção e reenvio:** até `CAP-017` os fatos ficaram retidos no registro do outbox;
      desde 1.3.0 são publicados ao vivo para o consumidor (`learning`, fila `learning.playback-progress`), e os
      retidos são reenviados uma vez por `reenviarReproducaoAvancouRetido`, sem efeito duplicado por (2). (6) Uma
      sessão que terminou por decisão negada não invalida fatos anteriores.'
  reenviarReproducaoAvancouRetido:
    action: send
    summary: Reenviar, uma vez, os avanços retidos antes de existir consumidor.
    channel:
      $ref: '#/channels/reproducaoAvancou'
    messages:
    - $ref: '#/channels/reproducaoAvancou/messages/reproducaoAvancou'
    description: 'Executado na implantação desta entrega, **depois** que a fila de `learning` está ligada ao canal
      (C-08). Reenvia todo fato retido no registro do outbox, com o **mesmo `eventId`**, o mesmo payload e o mesmo
      `correlationId` da publicação original: um consumidor que já o viu não muda nada (G09). Sem ordem garantida,
      como em `publicarReproducaoAvancou`. Pode ser repetido sem efeito. Fatos publicados depois de a fila existir
      seguem o caminho normal de `publicarReproducaoAvancou` e não dependem desta operação. O que acontece com o
      registro retido depois do reenvio (expurgo, prazo) é da TechSpec e de QA-01 do PRD.'
components:
  messages:
    AtivoPronto:
      name: AtivoPronto
      title: Vídeo pronto
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Headers'
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - tenantId
        - videoId
        - occurredAt
        - durationSeconds
        description: 'A Versão de Reprodução do vídeo existe e ele pode ser vinculado e reproduzido. Não diz quais
          qualidades foram geradas: isso é detalhe de entrega de Media.'
        properties:
          eventId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
            description: Escola dona do vídeo.
          videoId:
            type: string
            format: uuid
            description: O mesmo identificador de `videoId` na interface HTTP.
          occurredAt:
            type: string
            format: date-time
          durationSeconds:
            type: integer
            minimum: 1
      examples:
      - name: pronto
        headers:
          correlationId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        payload:
          eventId: 8d7c6b5a-4e3f-4a2b-9c1d-0e9f8a7b6c5d
          tenantId: 2b3c4d5e-6f70-4a81-9b2c-3d4e5f607182
          videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
          occurredAt: '2026-09-26T10:05:12Z'
          durationSeconds: 2415
    PreparacaoFalhou:
      name: PreparacaoFalhou
      title: Preparação falhou
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Headers'
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - tenantId
        - videoId
        - occurredAt
        - reason
        description: O vídeo não ficará pronto; o caminho é reenviar como vídeo novo.
        properties:
          eventId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          videoId:
            type: string
            format: uuid
          occurredAt:
            type: string
            format: date-time
          reason:
            type: string
            enum:
            - unreadable-file
            - unsupported-format
            - duration-exceeded
            - preparation-failed
            description: Mesma categoria de `failureReason` na interface HTTP. Consumidor deve tolerar valor novo.
      examples:
      - name: ilegivel
        headers:
          correlationId: 00-1a2b3c4d5e6f708192a3b4c5d6e7f809-1a2b3c4d5e6f7081-01
        payload:
          eventId: 4c5d6e7f-8091-4a2b-8c3d-4e5f60718293
          tenantId: 2b3c4d5e-6f70-4a81-9b2c-3d4e5f607182
          videoId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
          occurredAt: '2026-09-26T08:21:40Z'
          reason: unreadable-file
    ReproducaoAvancou:
      name: ReproducaoAvancou
      title: Reprodução avançou
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Headers'
      payload:
        $ref: '#/components/schemas/ReproducaoAvancouPayload'
      examples:
      - name: pausa
        headers:
          correlationId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        payload:
          eventId: b7c8d9e0-f1a2-4b3c-8d4e-5f6a7b8c9d0e
          tenantId: 2b3c4d5e-6f70-4a81-9b2c-3d4e5f607182
          sessionId: e4b8c6a2-1d3f-4957-b0a8-6c2d4e8f1a73
          studentId: 6f1e2d3c-4b5a-4968-8777-a1b2c3d4e5f6
          courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
          lessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
          sequence: 5
          positionSeconds: 252
          reason: paused
          occurredAt: '2026-10-05T14:02:12Z'
  schemas:
    Headers:
      type: object
      additionalProperties: false
      required:
      - correlationId
      properties:
        correlationId:
          type: string
          description: traceparent da conclusão do envio que originou a preparação.
    ReproducaoAvancouPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - sessionId
      - studentId
      - courseId
      - lessonId
      - sequence
      - positionSeconds
      - reason
      - occurredAt
      description: 'Fato bruto de que uma Sessão de Reprodução chegou a certa posição da aula (RN-M14). Não é progresso
        nem conclusão: concluir aula e calcular percentual são de Aprendizagem e Progresso. **Não leva e-mail, nome,
        título nem percentual**; aluno, curso e aula são identificadores opacos (G23).'
      properties:
        eventId:
          type: string
          format: uuid
          description: 'Determinístico por (`sessionId`, `sequence`): a mesma sequência republicada repete o mesmo
            `eventId`.'
        tenantId:
          type: string
          format: uuid
          description: Escola da sessão (G07).
        sessionId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
          description: Identificador opaco da conta de aluno em Identity (mesmo `studentId` de CAP-008).
        courseId:
          type: string
          format: uuid
          description: Da Referência de Uso da sessão; unidade sobre a qual Matrícula decide.
        lessonId:
          type: string
          format: uuid
          description: Da Referência de Uso; unidade de progresso em Aprendizagem (RN-C12).
        sequence:
          type: integer
          minimum: 1
          description: Sequência do player na sessão.
        positionSeconds:
          type: integer
          minimum: 0
          maximum: 43200
        reason:
          type: string
          enum:
          - heartbeat
          - paused
          - left
          - ended
          description: Consumidor deve tolerar valor novo.
        occurredAt:
          type: string
          format: date-time
          description: Quando Media recebeu o avanço.
