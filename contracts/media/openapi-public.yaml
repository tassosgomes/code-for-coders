  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
    Title:
      type: string
      minLength: 1
      maxLength: 200
      description: >
        Nome do vídeo para reconhecê-lo no vínculo à aula. Não é título de aula. Só espaços é
        recusado com `TITLE_REQUIRED`.
      examples:
        - Aula 3 — Injeção de dependência
    VideoStatus:
      type: string
      enum: [received, preparing, ready, failed]
      description: >
        `received` recebido e aguardando preparação; `preparing` em preparação; `ready` pronto para
        vínculo e reprodução; `failed` a preparação esgotou as tentativas. Só anda para frente;
        `ready` e `failed` são finais (RN-M05).
    FailureReason:
      type: string
      enum: [unreadable-file, unsupported-format, duration-exceeded, preparation-failed]
      description: >
        Categoria do motivo da falha. O SPA mostra o texto do PRD (RF-05): "arquivo de vídeo
        ilegível", "formato de vídeo não suportado", "duração acima de 3 horas", "não foi possível
        preparar este vídeo — envie novamente".
    CreateVideoUploadRequest:
      type: object
      additionalProperties: false
      required: [title, fileName, fileSize, contentType, fingerprint]
      properties:
        title:
          $ref: '#/components/schemas/Title'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Nome do arquivo no computador do professor. Só para exibição; não vira nome de objeto.
        fileSize:
          type: integer
          minimum: 1
          description: Tamanho em bytes. Acima de 5368709120 (5 GiB) → 422 `FILE_TOO_LARGE`.
        contentType:
          type: string
          minLength: 1
          description: >
            Tipo declarado pelo navegador. Aceitos: `video/mp4`, `video/quicktime`,
            `video/x-matroska`, conferidos junto com a extensão de `fileName` (`.mp4`, `.mov`,
            `.mkv`). Outro → 422 `FORMAT_NOT_SUPPORTED`. A leitura real do conteúdo acontece na
            preparação (RF-04).
          examples:
            - video/mp4
        fingerprint:
          type: string
          minLength: 16
          maxLength: 128
          description: >
            Impressão opaca do arquivo calculada pelo cliente (nome, tamanho e data de modificação).
            Só serve para reconhecer o mesmo arquivo na retomada (RF-03).
    VideoUpload:
      type: object
      additionalProperties: false
      required: [uploadId, title, fileName, fileSize, partSize, partCount, receivedParts, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/Title'
        fileName:
          type: string
        fileSize:
          type: integer
        partSize:
          type: integer
          description: Tamanho de cada parte em bytes; a última pode ser menor. Definido pelo serviço.
        partCount:
          type: integer
          minimum: 1
        receivedParts:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Partes que o armazenamento confirmou, em ordem crescente; `[]` quando nenhuma.
        expiresAt:
          type: string
          format: date-time
          description: >
            Até quando o envio pode ser retomado. Pelo menos 24 horas depois da validade da última URL
            de parte emitida (RF-03); depois disso o envio e as partes são descartados.
    VideoUploadPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoUpload'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PartUrlsRequest:
      type: object
      additionalProperties: false
      required: [partNumbers]
      properties:
        partNumbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            minimum: 1
    PartUrls:
      type: object
      additionalProperties: false
      required: [parts, uploadExpiresAt]
      properties:
        parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [partNumber, url, expiresAt]
            properties:
              partNumber:
                type: integer
                minimum: 1
              url:
                type: string
                format: uri
                description: >
                  URL opaca de escrita de uma única parte. O cliente não interpreta host nem
                  parâmetros; só envia `PUT` com os bytes da parte até `expiresAt`.
              expiresAt:
                type: string
                format: date-time
        uploadExpiresAt:
          type: string
          format: date-time
    UploadedBy:
      type: object
      additionalProperties: false
      required: [accountId, name]
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
          description: Nome do autor no momento do envio. Continua exibido mesmo se o papel dele for revogado.
    Video:
      type: object
      additionalProperties: false
      required: [videoId, title, status, uploadedBy, uploadedAt, durationSeconds, failureReason]
      properties:
        videoId:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/Title'
        status:
          $ref: '#/components/schemas/VideoStatus'
        uploadedBy:
          $ref: '#/components/schemas/UploadedBy'
        uploadedAt:
          type: string
          format: date-time
        durationSeconds:
          type: [integer, 'null']
          minimum: 1
          description: Duração em segundos; preenchida só em `ready`.
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/FailureReason'
            - type: 'null'
          description: Preenchido só em `failed`.
    VideoPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UpdateVideoTitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          $ref: '#/components/schemas/Title'
    Pagination:
      type: object
      additionalProperties: false
      required: [page, size, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
