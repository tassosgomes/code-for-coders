  /videos/{videoId}:
    get:
      tags:
      - Vídeos
      summary: Consultar um vídeo
      description: |
        Existência, estado, título e duração de um vídeo da escola do ator (RF-08). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente. Nunca devolve endereço, chave nem nome de arquivo guardado.
      operationId: getVideoInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Vídeo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                pronto:
                  $ref: '#/components/examples/VideoReady'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
    patch:
      tags:
      - Vídeos
      summary: Corrigir o título de um vídeo
      description: |
        Qualquer ator com `midia.enviar` corrige o título de qualquer vídeo da escola, em qualquer estado (RF-07). Não muda nada além do título.
      operationId: updateVideoTitleInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVideoTitleRequest'
            examples:
              titulo:
                value:
                  title: Aula 3 — Injeção de dependência
      responses:
        '200':
          description: Título atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                pronto:
                  $ref: '#/components/examples/VideoReady'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '422':
          description: Título em branco, ou chave de idempotência reutilizada com outro corpo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                semTitulo:
                  $ref: '#/components/examples/TitleRequired'
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
  /lessons/{lessonId}/playback-sessions:
    post:
      tags:
      - Reprodução
      summary: Abrir uma Sessão de Reprodução
      description: 'Abre a Sessão de Reprodução do aluno corrente para a aula (RF-01, RF-02). Ordem obrigatória
        (RN-M10): (1) a aula alegada está entre as Referências de Uso de um vídeo (404 `LESSON_NOT_AVAILABLE`, **antes**
        de consultar Matrícula); (2) o vídeo está pronto (409 `MEDIA_NOT_READY`); (3) Matrícula responde que o aluno
        pode acessar o curso agora (403 `ACCESS_DENIED`; sem resposta, 503 `ACCESS_DECISION_UNAVAILABLE`, falha
        fechada); (4) o e-mail do aluno está disponível para a marca d''água (422 `WATERMARK_UNAVAILABLE`). Cada
        chamada abre uma sessão nova; não é idempotente e não há limite de sessões simultâneas do mesmo aluno (RN-M13,
        BA16, G24). A sessão vale 5 minutos (DP-01).'
      operationId: openPlaybackSessionInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/LessonId'
      responses:
        '201':
          description: Sessão aberta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
              examples:
                sessao:
                  value:
                    sessionId: e4b8c6a2-1d3f-4957-b0a8-6c2d4e8f1a73
                    lessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
                    expiresAt: '2026-10-05T14:05:00Z'
                    renewAfter: '2026-10-05T14:03:30Z'
                    watermark: &id001
                      text: marina.alves@example.com
                      repositionSeconds: 30
                    progress: &id002
                      intervalSeconds: 30
                      minGapSeconds: 10
                    segmentAccess:
                      query: sa=MjAyNi0xMC0wNVQxNDowNTowMFo.k3Jq9xT2vL0pQw
                      expiresAt: '2026-10-05T14:05:00Z'
          headers:
            Cache-Control: &id003
              description: '`no-store`: nada desta resposta fica em cache do navegador, do BFF ou da distribuição.'
              schema:
                type: string
                examples:
                - no-store
            Location:
              description: Caminho da sessão, `/playback-sessions/{sessionId}`; base dos recursos `playlist`, `variants`,
                `key`, `renewals` e `progress`.
              schema:
                type: string
                examples:
                - /playback-sessions/e4b8c6a2-1d3f-4957-b0a8-6c2d4e8f1a73
        '404':
          $ref: '#/components/responses/LessonNotAvailable'
        '409':
          description: 'O vídeo da aula ainda não está pronto ou falhou (RN-M05, RN-M09). Mensagem ao aluno: "Esta
            aula está indisponível no momento"; nenhum detalhe técnico.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronto:
                  value:
                    type: about:blank
                    title: Esta aula está indisponível no momento.
                    status: 409
                    code: MEDIA_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '422':
          description: 'A sessão não pode trazer o e-mail do aluno para a marca d''água: **sem marca, sem reprodução**
            (RN-R03).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                semMarca: &id004
                  value:
                    type: about:blank
                    title: Não foi possível iniciar a aula.
                    status: 422
                    code: WATERMARK_UNAVAILABLE
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '503':
          $ref: '#/components/responses/AccessDecisionUnavailable'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /playback-sessions/{sessionId}/renewals:
    post:
      tags:
      - Reprodução
      summary: Renovar a Sessão de Reprodução
      description: 'Estende a reprodução em andamento **repetindo a decisão de acesso** (RN-M11, RF-02): a validade
        volta a 5 minutos e a `segmentAccess` é substituída. O player chama a partir de `renewAfter` e repete a
        tentativa enquanto a resposta for 503, até `expiresAt`. Decisão negada (403) encerra a reprodução; decisão
        indisponível até o fim da validade também (RN-R02): nenhuma sessão se estende por padrão. Sessão já vencida
        não renova (410): o player abre outra. Idempotente por natureza: repetir a chamada só repete a decisão e
        devolve a validade vigente.'
      operationId: renewPlaybackSessionInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 'Sessão renovada: mesmo `sessionId`, nova validade e nova `segmentAccess`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
              examples:
                renovada:
                  value:
                    sessionId: e4b8c6a2-1d3f-4957-b0a8-6c2d4e8f1a73
                    lessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
                    expiresAt: '2026-10-05T14:10:00Z'
                    renewAfter: '2026-10-05T14:08:30Z'
                    watermark: *id001
                    progress: *id002
                    segmentAccess:
                      query: sa=MjAyNi0xMC0wNVQxNDoxMDowMFo.p8Wd2mQ7sN4xZa
                      expiresAt: '2026-10-05T14:10:00Z'
          headers: &id005
            Cache-Control: *id003
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '410':
          $ref: '#/components/responses/SessionExpired'
        '422':
          description: 'A sessão não pode trazer o e-mail do aluno (RN-R03): a reprodução não se estende.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                semMarca: *id004
        '503':
          $ref: '#/components/responses/AccessDecisionUnavailable'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /playback-sessions/{sessionId}/playlist:
    get:
      tags:
      - Entrega
      summary: Obter a playlist principal (HLS)
      description: 'Playlist HLS principal da sessão, listando as qualidades que o vídeo tem (RF-03, RF-05). Os
        endereços das variantes são **relativos** (`variants/{quality}`), de modo que o BFF repassa o corpo sem
        reescrevê-lo. Exceção ao gate HTTP: o corpo é `application/vnd.apple.mpegurl`, não JSON (C-08). Recusada
        sem sessão válida, depois do fim da validade, ou para sessão de outro aluno (RN-M01).'
      operationId: getPlaybackPlaylistInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Playlist principal.
          headers: *id005
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
              examples:
                playlist:
                  value: '#EXTM3U

                    #EXT-X-STREAM-INF:BANDWIDTH=5000000,RESOLUTION=1920x1080

                    variants/1080p

                    #EXT-X-STREAM-INF:BANDWIDTH=2800000,RESOLUTION=1280x720

                    variants/720p

                    #EXT-X-STREAM-INF:BANDWIDTH=1000000,RESOLUTION=854x480

                    variants/480p

                    '
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '410':
          $ref: '#/components/responses/SessionExpired'
        '401':
          $ref: '#/components/responses/TokenInvalid'
  /playback-sessions/{sessionId}/variants/{quality}:
    get:
      tags:
      - Entrega
      summary: Obter a playlist de uma qualidade (HLS)
      description: 'Playlist HLS de uma qualidade. Os segmentos aparecem como endereços **absolutos da distribuição,
        sem credencial**; o player acrescenta `segmentAccess.query` a cada pedido de segmento (C-06). A URI da chave
        é **relativa** (`../key`) e aponta para o recurso `key` desta sessão, nunca para um endereço estável do
        armazenamento (ADR-0006, item 4). Nenhum endereço carrega o e-mail do aluno (G23). Exceção ao gate HTTP
        (C-08): `application/vnd.apple.mpegurl`.'
      operationId: getPlaybackVariantPlaylistInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/Quality'
      responses:
        '200':
          description: Playlist da qualidade.
          headers: *id005
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
              examples:
                playlist:
                  value: '#EXTM3U

                    #EXT-X-VERSION:3

                    #EXT-X-TARGETDURATION:6

                    #EXT-X-PLAYLIST-TYPE:VOD

                    #EXT-X-KEY:METHOD=AES-128,URI="../key"

                    #EXTINF:6.000,

                    https://media.example.com/v/0b1c2d3e/720p/seg-00001.ts

                    #EXTINF:6.000,

                    https://media.example.com/v/0b1c2d3e/720p/seg-00002.ts

                    #EXT-X-ENDLIST

                    '
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '410':
          $ref: '#/components/responses/SessionExpired'
        '401':
          $ref: '#/components/responses/TokenInvalid'
  /playback-sessions/{sessionId}/key:
    get:
      tags:
      - Entrega
      summary: Obter a chave de cifra do vídeo
      description: 'Entrega a chave AES-128 **somente** para uma Sessão de Reprodução válida **daquele** vídeo,
        pelo próprio serviço de Mídia e nunca pela distribuição nem por endereço estável (RN-M08, RF-03). Resposta
        com `Cache-Control: no-store`. A chave nunca aparece em log, span, mensagem ou outra resposta (ADR-0006).
        Exceção ao gate HTTP (C-08): `application/octet-stream`.'
      operationId: getPlaybackKeyInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 'Chave de cifra AES-128 do vídeo: 16 bytes.'
          headers: *id005
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '410':
          $ref: '#/components/responses/SessionExpired'
        '401':
          $ref: '#/components/responses/TokenInvalid'
  /playback-sessions/{sessionId}/progress:
    post:
      tags:
      - Reprodução
      summary: Informar o avanço da reprodução
      description: 'O player informa onde a reprodução está (RF-07): a cada `progress.intervalSeconds` de reprodução
        contínua e ao pausar, sair e chegar ao fim. Media aceita enquanto a sessão for do aluno, **mesmo depois
        do fim da validade** (a decisão negada não apaga o que foi assistido: RF-07), e publica o fato `midia.reproducao-avancou.v1`
        (`asyncapi-contract.yaml`). Idempotente por (`sessionId`, `sequence`); menos de `progress.minGapSeconds`
        desde o avanço anterior aceito da mesma sessão não gera fato (RN-R05). A saída da aula é enviada com `fetch`
        em modo `keepalive`, porque a escrita exige o cabeçalho `X-CSRF-Token`, que `sendBeacon` não permite.'
      operationId: recordPlaybackProgressInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressInput'
            examples:
              heartbeat:
                value:
                  sequence: 4
                  positionSeconds: 132
                  reason: heartbeat
              pausa:
                value:
                  sequence: 5
                  positionSeconds: 252
                  reason: paused
      responses:
        '200':
          description: Avanço tratado; `recorded` diz se virou fato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressAck'
              examples:
                aceito:
                  value:
                    recorded: true
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '410':
          description: O avanço chegou depois da janela de aceitação da sessão (valor da TechSpec). O que foi informado
            antes continua valendo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                expirada: &id006
                  value:
                    type: about:blank
                    title: A sessão de reprodução terminou.
                    status: 410
                    code: PLAYBACK_SESSION_EXPIRED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '401':
          $ref: '#/components/responses/TokenInvalid'
  /videos/{videoId}/tags:
    put:
      tags:
      - Vídeos
      summary: Substituir as tags de um vídeo
      description: 'Qualquer ator com `midia.enviar` troca o conjunto **inteiro** de
        tags de qualquer vídeo da escola, em qualquer estado (RF-02, RN-T04). `[]` remove
        todas. Não muda título, estado nem vínculos, e não publica fato `midia.*` (RN-T01).


        Concorrência: a última gravação prevalece por inteiro (C-03). A resposta traz
        o estado real do vídeo depois desta gravação. A tag que deixa de estar em todos
        os vídeos da escola some de `listVideoTags` e não casa mais com o filtro (RN-T05).
        Vídeo de outra escola responde o mesmo 404 de vídeo inexistente (RN-T06).

        '
      operationId: replaceVideoTagsInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceVideoTagsRequest'
            examples:
              trocar:
                value:
                  tags:
                  - kubernetes
              removerTodas:
                value:
                  tags: []
      responses:
        '200':
          description: Tags substituídas; o vídeo no estado gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                trocadas:
                  $ref: '#/components/examples/VideoTagsReplaced'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '422':
          description: Tag vazia ou com mais de 30 caracteres, mais de 10 tags distintas,
            ou chave de idempotência reutilizada com outro corpo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tagInvalida:
                  $ref: '#/components/examples/TagInvalid'
                tagsDemais:
                  $ref: '#/components/examples/TagsLimitExceeded'
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
  /video-tags:
    get:
      tags:
        - Vídeos
      summary: Sugerir tags da escola
      description: |
        Tags usadas em pelo menos um vídeo da escola do ator, em qualquer estado, que contêm o trecho `q` (RF-03, RN-T05, RN-T06). Serve à sugestão no envio e na edição e às opções do filtro na tela Vídeos e no seletor da aula. Sem paginação: teto fixo de 20 (C-04).
      operationId: listVideoTagsInternal
      security:
        - StaffUserToken: []
      parameters:
        - $ref: '#/components/parameters/TagQuery'
      responses:
        '200':
          description: Tags sugeridas; `data` vazio quando nenhuma contém `q`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTagList'
              examples:
                dock:
                  value:
                    data:
                      - Docker
                      - Docker Compose
                nenhuma:
                  value:
                    data: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /videos/{videoId}/transcription-requests:
    post:
      tags:
      - Transcrição
      summary: Pedir a transcrição de um vídeo (Transcrever ou Refazer)
      description: |
        Ação **Transcrever** (vídeo pronto sem transcrição) e **Refazer** (com transcrição pronta, ou cuja última tentativa falhou) da tela Vídeos (RF-02, RN-M20). Uma só operação: o serviço decide pelo estado. Qualquer ator com `midia.enviar` pede para qualquer vídeo da escola, de qualquer autor (RN-M03, RN-M04). Sem corpo.

        O pedido apenas **registra a intenção** e responde 202 com o vídeo em `transcription.status: in-progress`; o disparo ao serviço de transcrição acontece depois, de forma assíncrona. Indisponibilidade desse serviço **não** falha o pedido nem muda o estado do vídeo (RN-M19). Pedir enquanto já há uma tentativa em andamento não cria outra: devolve 202 com o estado real (RN-M20, sem erro). Refazer mantém a transcrição vigente visível ao aluno até a nova ficar pronta (RN-M18, RN-TL07).

        Recusas de regra: vídeo que não está `ready` → 409 `VIDEO_NOT_READY` (também para vídeo que falhou na preparação); última tentativa falhou por `duration-limit` ou `size-limit` → 409 `TRANSCRIPTION_NOT_RETRYABLE` (RN-M24). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente (G07). Não publica fato `midia.*` (domínio de Mídia, §7).
      operationId: requestVideoTranscriptionInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Pedido aceito (ou já havia uma tentativa em andamento); o vídeo no estado real depois do
            pedido.
          headers:
            Location:
              description: Caminho do vídeo, `/videos/{videoId}`.
              schema:
                type: string
                examples:
                - /videos/0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                transcrevendo:
                  $ref: '#/components/examples/VideoTranscribing'
                refazendo:
                  value:
                    videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                    title: Aula 3 — Injeção de dependência
                    status: ready
                    uploadedBy:
                      accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
                      name: Marina Alves
                    uploadedAt: '2026-09-26T09:40:00Z'
                    durationSeconds: 2415
                    failureReason: null
                    tags:
                    - Docker
                    transcription:
                      status: in-progress
                      readable: true
                      readyAt: '2026-10-14T10:12:00Z'
                      failureReason: null
                      canStart: false
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: O vídeo não está pronto, ou a última tentativa falhou por um motivo que refazer não resolve.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronto:
                  value:
                    type: about:blank
                    title: Só vídeo pronto pode ser transcrito.
                    status: 409
                    code: VIDEO_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                naoRefazivel:
                  value:
                    type: about:blank
                    title: Este vídeo ultrapassa o limite da transcrição.
                    status: 409
                    code: TRANSCRIPTION_NOT_RETRYABLE
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '422':
          description: Chave de idempotência reutilizada em outro vídeo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                chaveReutilizada:
                  value:
                    type: about:blank
                    title: Chave de idempotência já usada em outro pedido.
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /videos/{videoId}/transcription:
    get:
      tags:
      - Transcrição
      summary: Ler a transcrição vigente de um vídeo (professor)
      description: |
        Texto completo da transcrição **vigente**, em ordem, com o tempo de cada trecho, para o professor avaliar a qualidade (RF-08, RN-M27). Somente leitura. **Não é reprodução**: não abre Sessão de Reprodução, não consulta Matrícula e não traz marca d'água (RN-TL08). Exige `midia.enviar`; vídeo de outra escola responde o mesmo 404 de vídeo inexistente (G07).

        Só existe quando `transcription.readable` é `true`; senão 409 `TRANSCRIPTION_NOT_READY` e o professor vê o estado (RF-02). Com refeita em andamento, devolve a vigente. Resposta `Cache-Control: private, no-store`. O texto não aparece em log nem em URL (RN-M26).
      operationId: getVideoTranscriptionInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Transcrição vigente.
          headers:
            Cache-Control:
              description: '`private, no-store`: o texto da aula nunca fica em cache compartilhado nem do navegador
                (RN-M21, G21).'
              schema:
                type: string
                examples:
                - private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTranscriptionContent'
              examples:
                vigente:
                  value:
                    videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                    revision: tr_7d2a91c4
                    language: pt-BR
                    durationMs: 2415000
                    readyAt: '2026-10-14T10:12:00Z'
                    segments:
                    - startMs: 1240
                      endMs: 4100
                      text: Hoje vamos ver o docker compose.
                    - startMs: 4100
                      endMs: 7900
                      text: Ele descreve vários containers em um só arquivo.
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: O vídeo não tem transcrição pronta (sem transcrição, transcrevendo pela primeira vez ou falhou
            sem vigente).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronta:
                  value:
                    type: about:blank
                    title: Este vídeo ainda não tem transcrição pronta.
                    status: 409
                    code: TRANSCRIPTION_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
components:
  securitySchemes:
    StaffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT RS256 de ator interno emitido por Identity na validação de sessão (`validateStaffSessionInternal`
        com `audience: media`), vida curta, claims iss, aud, sub, tenantId, sessionId, scope, roles, permissions,
        exp, jti. Chave pública por `kid` no JWKS de Identity.'
    StudentUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 de aluno emitido por Identity em `validateStudentSessionInternal` com a audiência do
        serviço dono (ADR-0003), vida curta, claims `iss`, `aud`, `sub` (= `studentId`), `tenantId`, `sessionId`,
        `exp` e `jti`. Validado localmente pelo JWKS de Identity, sem consulta a Identity. A escola é sempre a do
        token (G07).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave propagada sem alteração pelo BFF. Isolada por tenant, operationId e ator; mesma janela
        e regra do contrato público.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Identificador opaco do envio.
      schema:
        type: string
        format: uuid
      examples:
        envio:
          value: 3f6d2c1a-8b7e-4f90-a1b2-c3d4e5f60718
    VideoId:
      name: videoId
      in: path
      required: true
      description: Identificador opaco do vídeo, o mesmo usado nos fatos `midia.*`.
      schema:
        type: string
        format: uuid
      examples:
        video:
          value: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
    Page:
      name: _page
      in: query
      required: false
      description: Página, iniciando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    LessonId:
      name: lessonId
      in: path
      required: true
      description: Identidade estável da aula (RN-C07). Opaca para quem a recebe.
      schema:
        type: string
        format: uuid
      examples:
        aula:
          value: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identificador da Sessão de Reprodução.
      schema:
        type: string
        format: uuid
      examples:
        sessao:
          value: e4b8c6a2-1d3f-4957-b0a8-6c2d4e8f1a73
    Quality:
      name: quality
      in: path
      required: true
      description: Qualidade da variante.
      schema:
        $ref: '#/components/schemas/Quality'
      examples:
        hd:
          value: 720p
    Tag:
      name: tag
      in: query
      required: false
      description: |
        Tags da escola a filtrar; repetível, até 10. Cada valor é comparado sem diferenciar maiúsculas, acentos nem espaços nas pontas e repetidos (RN-T02). Valor que não é tag da escola não casa com nenhum vídeo: com `tagMatch=all` o resultado fica vazio, com `any` ele é ignorado. Combina-se com `status` e `q` como "todos ao mesmo tempo" (RF-04, RF-05).
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          minLength: 1
          maxLength: 100
      examples:
        duasTags:
          value:
            - docker
            - módulo 2
    TagMatch:
      name: tagMatch
      in: query
      required: false
      description: |
        Combinação entre as tags de `tag` (RF-06): `all` traz o vídeo que tem todas; `any`, o que tem pelo menos uma. Ausente → `all`. Sem efeito com menos de duas tags.
      schema:
        $ref: '#/components/schemas/TagMatch'
      examples:
        qualquer:
          value: any
    TagQuery:
      name: q
      in: query
      required: false
      description: Trecho da tag, sem diferenciar maiúsculas nem acentos. Ausente → as primeiras tags da escola em ordem alfabética.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      examples:
        dock:
          value: dock
  responses:
