  schemas:
    TagMatch:
      type: string
      enum:
        - all
        - any
      default: all
      description: '`all` = E (o vídeo tem todas as tags); `any` = OU (tem pelo menos uma).'
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        reason:
          type: string
          enum:
          - no-grant
          - grant-ended
          description: 'Só em `ACCESS_DENIED`: `no-grant` (nunca teve acesso ao curso) ou `grant-ended` (já teve,
            nenhuma concessão está ativa). Clientes devem tolerar valor novo (`suspended` e `revoked` virão com
            `CAP-009`).'
        accessEndedAt:
          type: string
          format: date-time
          description: 'Só em `ACCESS_DENIED` com `reason: grant-ended`: término (exclusivo, UTC) da última concessão.
            O último dia de acesso é o dia anterior a este instante, no fuso da escola (DP-03 de `CAP-008`); é a
            data da mensagem "Seu acesso a este curso terminou em ...".'
    Title:
      type: string
      minLength: 1
      maxLength: 200
      description: |
        Nome do vídeo para reconhecê-lo no vínculo à aula. Não é título de aula. Só espaços é recusado com `TITLE_REQUIRED`.
      examples:
      - Aula 3 — Injeção de dependência
    VideoStatus:
      type: string
      enum:
      - received
      - preparing
      - ready
      - failed
      description: |
        `received` recebido e aguardando preparação; `preparing` em preparação; `ready` pronto para vínculo e reprodução; `failed` a preparação esgotou as tentativas. Só anda para frente; `ready` e `failed` são finais (RN-M05).
    FailureReason:
      type: string
      enum:
      - unreadable-file
      - unsupported-format
      - duration-exceeded
      - preparation-failed
      description: |
        Categoria do motivo da falha. O SPA mostra o texto do PRD (RF-05): "arquivo de vídeo ilegível", "formato de vídeo não suportado", "duração acima de 3 horas", "não foi possível preparar este vídeo — envie novamente".
    CreateVideoUploadRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - fileName
      - fileSize
      - contentType
      - fingerprint
      - uploaderName
      properties:
        title:
          $ref: '#/components/schemas/Title'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Nome do arquivo no computador do professor. Só para exibição; não vira nome de objeto.
        fileSize:
          type: integer
          minimum: 1
          description: Tamanho em bytes. Acima de 5368709120 (5 GiB) → 422 `FILE_TOO_LARGE`.
        contentType:
          type: string
          minLength: 1
          description: |
            Tipo declarado pelo navegador. Aceitos: `video/mp4`, `video/quicktime`, `video/x-matroska`, conferidos junto com a extensão de `fileName` (`.mp4`, `.mov`, `.mkv`). Outro → 422 `FORMAT_NOT_SUPPORTED`. A leitura real do conteúdo acontece na preparação (RF-04).
          examples:
          - video/mp4
        fingerprint:
          type: string
          minLength: 16
          maxLength: 128
          description: |
            Impressão opaca do arquivo calculada pelo cliente (nome, tamanho e data de modificação). Só serve para reconhecer o mesmo arquivo na retomada (RF-03).
        uploaderName:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome do ator no momento do envio, obtido pelo BFF da validação de sessão (`SessionValidated.name`).
            Só para exibição em `uploadedBy.name`; a identidade do autor vem de `sub` do token, nunca deste campo
            (C-13). Não vai para log, métrica nem fato publicado.
        tags:
          $ref: '#/components/schemas/TagInputList'
    VideoUpload:
      type: object
      additionalProperties: false
      required:
      - uploadId
      - title
      - fileName
      - fileSize
      - partSize
      - partCount
      - receivedParts
      - expiresAt
      - tags
      properties:
        uploadId:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/Title'
        fileName:
          type: string
        fileSize:
          type: integer
        partSize:
          type: integer
          description: Tamanho de cada parte em bytes; a última pode ser menor. Definido
            pelo serviço.
        partCount:
          type: integer
          minimum: 1
        receivedParts:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Partes que o armazenamento confirmou, em ordem crescente; `[]` quando
            nenhuma.
        expiresAt:
          type: string
          format: date-time
          description: 'Até quando o envio pode ser retomado. Pelo menos 24 horas depois
            da validade da última URL de parte emitida (RF-03); depois disso o envio e as
            partes são descartados.

            '
        tags:
          $ref: '#/components/schemas/TagList'
    VideoUploadPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoUpload'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PartUrlsRequest:
      type: object
      additionalProperties: false
      required:
      - partNumbers
      properties:
        partNumbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            minimum: 1
    PartUrls:
      type: object
      additionalProperties: false
      required:
      - parts
      - uploadExpiresAt
      properties:
        parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - partNumber
            - url
            - expiresAt
            properties:
              partNumber:
                type: integer
                minimum: 1
              url:
                type: string
                format: uri
                description: |
                  URL opaca de escrita de uma única parte. O cliente não interpreta host nem parâmetros; só envia `PUT` com os bytes da parte até `expiresAt`.
              expiresAt:
                type: string
                format: date-time
        uploadExpiresAt:
          type: string
          format: date-time
    UploadedBy:
      type: object
      additionalProperties: false
      required:
      - accountId
      - name
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
          description: Nome do autor no momento do envio. Continua exibido mesmo se o papel dele for revogado.
    Video:
      type: object
      additionalProperties: false
      required:
      - videoId
      - title
      - status
      - uploadedBy
      - uploadedAt
      - durationSeconds
      - failureReason
      - tags
      - transcription
      properties:
        videoId:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/Title'
        status:
          $ref: '#/components/schemas/VideoStatus'
        uploadedBy:
          $ref: '#/components/schemas/UploadedBy'
        uploadedAt:
          type: string
          format: date-time
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Duração em segundos; preenchida só em `ready`.
        failureReason:
          oneOf:
          - $ref: '#/components/schemas/FailureReason'
          - type: 'null'
          description: Preenchido só em `failed`.
        tags:
          $ref: '#/components/schemas/TagList'
        transcription:
          $ref: "#/components/schemas/VideoTranscription"
    VideoPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UpdateVideoTitleRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          $ref: '#/components/schemas/Title'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Quality:
      type: string
      enum:
      - 1080p
      - 720p
      - 480p
      description: Uma das três qualidades da Versão de Reprodução (DP-01 de `CAP-006`). Um vídeo cujo original
        é menor não tem as maiores; a master só lista as que existem.
    Watermark:
      type: object
      additionalProperties: false
      required:
      - text
      - repositionSeconds
      properties:
        text:
          type: string
          format: email
          description: 'O e-mail do aluno, a compor sobre o vídeo. Única exposição declarada do e-mail nesta entrega
            (Identidade RN-21, RN-M12): nunca vai para URL, log, métrica, nome de objeto, chave de cache nem mensagem.'
        repositionSeconds:
          type: integer
          minimum: 1
          description: Intervalo máximo entre trocas de posição (DP-03; hoje 30).
    ProgressPolicy:
      type: object
      additionalProperties: false
      required:
      - intervalSeconds
      - minGapSeconds
      properties:
        intervalSeconds:
          type: integer
          minimum: 1
          description: A cada quantos segundos de reprodução contínua enviar um avanço (DP-02; hoje 30).
        minGapSeconds:
          type: integer
          minimum: 1
          description: Intervalo mínimo entre dois avanços da mesma sessão (DP-02; hoje 10).
    SegmentAccess:
      type: object
      additionalProperties: false
      required:
      - query
      - expiresAt
      description: 'Credencial de vida curta dos segmentos. A playlist traz os endereços dos segmentos **sem credencial**;
        o player acrescenta `query` a cada pedido de segmento. Renovar a sessão devolve uma `query` nova, e o player
        passa a usá-la. O formato é opaco e pertence à camada anticorrupção de Media (BA14): nada do provedor aparece
        no contrato.'
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2048
          description: Cadeia de consulta, já codificada, para anexar ao endereço do segmento.
        expiresAt:
          type: string
          format: date-time
          description: Até quando a `query` vale; nunca depois de `expiresAt` da sessão.
    PlaybackSession:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - lessonId
      - expiresAt
      - renewAfter
      - watermark
      - progress
      - segmentAccess
      description: 'Sessão de Reprodução: um aluno, um vídeo, uma aula, vida curta (RN-M11, DP-01). Os recursos
        da sessão ficam sob `/playback-sessions/{sessionId}`: `playlist`, `variants/{quality}`, `key`, `renewals`
        e `progress`. Os endereços na playlist são **relativos** a esse caminho.'
      properties:
        sessionId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Fim da validade (5 minutos depois da abertura ou da renovação; DP-01). Depois dele, playlist,
            chave e segmentos são recusados e a sessão não renova.
        renewAfter:
          type: string
          format: date-time
          description: A partir de quando o player deve tentar renovar, e repetir a tentativa até `expiresAt` se
            a decisão estiver indisponível (RF-02). Hoje, 90 s antes do fim.
        watermark:
          $ref: '#/components/schemas/Watermark'
        progress:
          $ref: '#/components/schemas/ProgressPolicy'
        segmentAccess:
          $ref: '#/components/schemas/SegmentAccess'
    ProgressInput:
      type: object
      additionalProperties: false
      required:
      - sequence
      - positionSeconds
      - reason
      description: 'Avanço informado pelo player. Aluno, curso e aula **não** vêm no corpo: Media os deriva da sessão.'
      properties:
        sequence:
          type: integer
          minimum: 1
          description: 'Contador do player, crescente por sessão a partir de 1. Chave de idempotência (sessão, sequência):
            reenvio não duplica o fato (G09).'
        positionSeconds:
          type: integer
          minimum: 0
          maximum: 43200
          description: Posição na aula, em segundos inteiros.
        reason:
          type: string
          enum:
          - heartbeat
          - paused
          - left
          - ended
          description: '`heartbeat` a cada `progress.intervalSeconds` de reprodução contínua; `paused`, `left` (saída
            da aula ou da aba; enviado com `keepalive`) e `ended` (fim da aula).'
    ProgressAck:
      type: object
      additionalProperties: false
      required:
      - recorded
      properties:
        recorded:
          type: boolean
          description: '`false` quando o avanço foi recebido mas **não** vira fato: repetição de `sequence`, ou
            menos de `progress.minGapSeconds` desde o avanço anterior aceito da mesma sessão (RN-R05). Não é erro.'
    Tag:
      type: string
      minLength: 1
      maxLength: 30
      description: 'Rótulo livre de um vídeo, na grafia canônica da escola: a da primeira
        vez que a tag foi usada nela (RN-T02). Sem significado para a plataforma (RN-T01).

        '
      examples:
      - Docker
    TagList:
      type: array
      maxItems: 10
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Tag'
      description: Tags do vídeo, em ordem alfabética sem diferenciar maiúsculas nem acentos;
        `[]` quando não há nenhuma (RN-T03).
      examples:
      - - Docker
        - Módulo 2
    TagInputList:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 100
      description: 'Tags informadas pelo professor. O serviço tira os espaços das pontas,
        reduz espaços repetidos a um e junta as equivalentes (RN-T02) sem erro. Cada tag
        equivalente a uma tag da escola recebe a grafia canônica; as demais passam a existir
        na escola com a grafia informada. Depois disso: tag vazia ou com mais de 30 caracteres
        → 422 `TAG_INVALID`; mais de 10 tags distintas → 422 `TAGS_LIMIT_EXCEEDED` (RN-T03).
        Os limites deste schema são só de proteção (400).

        '
      examples:
      - - docker
        - Módulo 2
    ReplaceVideoTagsRequest:
      type: object
      additionalProperties: false
      required:
      - tags
      properties:
        tags:
          $ref: '#/components/schemas/TagInputList'
    VideoTagList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Tag'
          description: |
            Até 20 tags da escola que contêm `q`: primeiro as que começam por ele, depois as demais, cada grupo em ordem alfabética. `[]` quando nenhuma. Coleção de teto fixo, sem paginação (C-04).
    TranscriptionStatus:
      type: string
      enum:
      - not-requested
      - in-progress
      - ready
      - failed
      description: 'Estado da **última tentativa** de transcrição do vídeo, na linguagem do professor (RN-TL06): `not-requested`
        sem transcrição; `in-progress` transcrevendo; `ready` pronta; `failed` falhou. Vídeo que não está `ready` (RN-M05)
        é sempre `not-requested`. Refazer mantém a transcrição vigente legível enquanto a nova roda (`status: in-progress`,
        `readable: true`) e depois que a nova falha (`status: failed`, `readable: true`): ver `readable` (RN-M18, RN-TL07).'
    TranscriptionFailureReason:
      type: string
      enum:
      - duration-limit
      - size-limit
      - service-unavailable
      - processing-failed
      - timed-out
      description: 'Categoria do motivo da falha, em termos do produto; nenhum código, estado ou limite do serviço de
        transcrição aparece aqui (camada anticorrupção). O SPA mostra o texto do PRD: `duration-limit` "vídeo mais longo
        que o limite de 2 horas"; `size-limit` "vídeo maior que o tamanho aceito para transcrição"; `service-unavailable`
        "serviço de transcrição indisponível no momento"; `processing-failed` "não foi possível transcrever este vídeo";
        `timed-out` "a transcrição demorou mais que o limite". `duration-limit` e `size-limit` não se resolvem refazendo
        (RN-M24): `canStart` é `false`. Clientes devem tolerar valor novo.'
    VideoTranscription:
      type: object
      additionalProperties: false
      required:
      - status
      - readable
      - readyAt
      - failureReason
      - canStart
      description: 'Estado da transcrição do vídeo para a tela Vídeos (RF-02, RF-08). Sempre presente; para vídeo que
        não está pronto vale `not-requested`, `readable: false`, `canStart: false`.'
      properties:
        status:
          $ref: '#/components/schemas/TranscriptionStatus'
        readable:
          type: boolean
          description: Existe uma transcrição vigente pronta que o professor pode abrir em `getVideoTranscription` e
            que o aluno recebe (RN-M18, RN-M27). Pode ser `true` com `status` `in-progress` ou `failed` (refazer em
            andamento ou que falhou).
        readyAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Quando a transcrição **vigente** ficou pronta; `null` se não há vigente.
        failureReason:
          oneOf:
          - $ref: '#/components/schemas/TranscriptionFailureReason'
          - type: 'null'
          description: 'Preenchido só com `status: failed` (motivo da última tentativa).'
        canStart:
          type: boolean
          description: 'Se `requestVideoTranscription` seria aceita agora: vídeo `ready`, nenhuma tentativa em andamento
            e, se a última falhou, o motivo não é `duration-limit` nem `size-limit`. Dirige a ação **Transcrever** (`status:
            not-requested`) ou **Refazer** (`ready` ou `failed`) (RF-02).'
    TranscriptSegment:
      type: object
      additionalProperties: false
      required:
      - startMs
      - endMs
      - text
      description: 'Trecho: unidade da legenda, da busca e do clique que leva o vídeo ao tempo (domínio de Mídia).
        Tempos desde o início do vídeo.'
      properties:
        startMs:
          type: integer
          minimum: 0
          description: Início do trecho, em milissegundos.
          examples:
          - 1240
        endMs:
          type: integer
          minimum: 0
          description: Fim do trecho, em milissegundos; nunca antes de `startMs`.
          examples:
          - 4100
        text:
          type: string
          description: Texto da fala, em português do Brasil, como o serviço de transcrição o produziu (DP-07).
            Sem dado do aluno (RN-M22).
          examples:
          - Hoje vamos ver o docker compose.
    VideoTranscriptionContent:
      type: object
      additionalProperties: false
      required:
      - videoId
      - revision
      - language
      - durationMs
      - readyAt
      - segments
      description: 'Transcrição vigente de um vídeo, para leitura do professor no backoffice (RF-08, RN-M27). Somente
        leitura: não há operação de edição (DP-07).'
      properties:
        videoId:
          type: string
          format: uuid
        revision:
          type: string
          minLength: 1
          maxLength: 64
          description: Identificador opaco da transcrição vigente; muda quando uma refeita a substitui (DP-09).
            Igual para todos os alunos e sem dado pessoal (RN-M22). Serve para o cliente saber se o texto que tem
            ainda é o vigente.
          examples:
          - tr_7d2a91c4
        language:
          type: string
          const: pt-BR
          description: Idioma fixo neste corte (RN-M25).
        durationMs:
          type: integer
          minimum: 0
          description: Duração coberta pela transcrição, em milissegundos.
          examples:
          - 2415000
        readyAt:
          type: string
          format: date-time
          description: Quando esta transcrição ficou pronta.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptSegment'
          description: 'Trechos em ordem crescente de `startMs`. Resposta única, sem paginação: uma aula de 2 horas
            tem alguns milhares de trechos (a busca roda no cliente, RF-05). Limites exatos de tamanho: TechSpec.'
