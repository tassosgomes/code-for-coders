        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}:
    get:
      tags:
      - Vídeos
      summary: Consultar um vídeo
      description: |
        Existência, estado, título e duração de um vídeo da escola do ator (RF-08). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente. Nunca devolve endereço, chave nem nome de arquivo guardado.
      operationId: getVideo
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Vídeo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                pronto:
                  $ref: '#/components/examples/VideoReady'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
    patch:
      tags:
      - Vídeos
      summary: Corrigir o título de um vídeo
      description: |
        Qualquer ator com `midia.enviar` corrige o título de qualquer vídeo da escola, em qualquer estado (RF-07). Não muda nada além do título.
      operationId: updateVideoTitle
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVideoTitleRequest'
            examples:
              titulo:
                value:
                  title: Aula 3 — Injeção de dependência
      responses:
        '200':
          description: Título atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                pronto:
                  $ref: '#/components/examples/VideoReady'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '422':
          description: Título em branco, ou chave de idempotência reutilizada com outro corpo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                semTitulo:
                  $ref: '#/components/examples/TitleRequired'
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}/tags:
    put:
      tags:
      - Vídeos
      summary: Substituir as tags de um vídeo
      description: 'Qualquer ator com `midia.enviar` troca o conjunto **inteiro** de
        tags de qualquer vídeo da escola, em qualquer estado (RF-02, RN-T04). `[]` remove
        todas. Não muda título, estado nem vínculos, e não publica fato `midia.*` (RN-T01).


        Concorrência: a última gravação prevalece por inteiro (C-03). A resposta traz
        o estado real do vídeo depois desta gravação. A tag que deixa de estar em todos
        os vídeos da escola some de `listVideoTags` e não casa mais com o filtro (RN-T05).
        Vídeo de outra escola responde o mesmo 404 de vídeo inexistente (RN-T06).

        '
      operationId: replaceVideoTags
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceVideoTagsRequest'
            examples:
              trocar:
                value:
                  tags:
                  - kubernetes
              removerTodas:
                value:
                  tags: []
      responses:
        '200':
          description: Tags substituídas; o vídeo no estado gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                trocadas:
                  $ref: '#/components/examples/VideoTagsReplaced'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '422':
          description: Tag vazia ou com mais de 30 caracteres, mais de 10 tags distintas,
            ou chave de idempotência reutilizada com outro corpo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tagInvalida:
                  $ref: '#/components/examples/TagInvalid'
                tagsDemais:
                  $ref: '#/components/examples/TagsLimitExceeded'
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /video-tags:
    get:
      tags:
        - Vídeos
      summary: Sugerir tags da escola
      description: |
        Tags usadas em pelo menos um vídeo da escola do ator, em qualquer estado, que contêm o trecho `q` (RF-03, RN-T05, RN-T06). Serve à sugestão no envio e na edição e às opções do filtro na tela Vídeos e no seletor da aula. Sem paginação: teto fixo de 20 (C-04).
      operationId: listVideoTags
      security:
        - StaffSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TagQuery'
      responses:
        '200':
          description: Tags sugeridas; `data` vazio quando nenhuma contém `q`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTagList'
              examples:
                dock:
                  value:
                    data:
                      - Docker
                      - Docker Compose
                nenhuma:
                  value:
                    data: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}/transcription-requests:
    post:
      tags:
      - Transcrição
      summary: Pedir a transcrição de um vídeo (Transcrever ou Refazer)
      description: |
        Ação **Transcrever** (vídeo pronto sem transcrição) e **Refazer** (com transcrição pronta, ou cuja última tentativa falhou) da tela Vídeos (RF-02, RN-M20). Uma só operação: o serviço decide pelo estado. Qualquer ator com `midia.enviar` pede para qualquer vídeo da escola, de qualquer autor (RN-M03, RN-M04). Sem corpo.

        O pedido apenas **registra a intenção** e responde 202 com o vídeo em `transcription.status: in-progress`; o disparo ao serviço de transcrição acontece depois, de forma assíncrona. Indisponibilidade desse serviço **não** falha o pedido nem muda o estado do vídeo (RN-M19). Pedir enquanto já há uma tentativa em andamento não cria outra: devolve 202 com o estado real (RN-M20, sem erro). Refazer mantém a transcrição vigente visível ao aluno até a nova ficar pronta (RN-M18, RN-TL07).

        Recusas de regra: vídeo que não está `ready` → 409 `VIDEO_NOT_READY` (também para vídeo que falhou na preparação); última tentativa falhou por `duration-limit` ou `size-limit` → 409 `TRANSCRIPTION_NOT_RETRYABLE` (RN-M24). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente (G07). Não publica fato `midia.*` (domínio de Mídia, §7).
      operationId: requestVideoTranscription
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Pedido aceito (ou já havia uma tentativa em andamento); o vídeo no estado real depois do
            pedido.
          headers:
            Location:
              description: Caminho do vídeo, `/videos/{videoId}`.
              schema:
                type: string
                examples:
                - /videos/0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                transcrevendo:
                  $ref: '#/components/examples/VideoTranscribing'
                refazendo:
                  value:
                    videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                    title: Aula 3 — Injeção de dependência
                    status: ready
                    uploadedBy:
                      accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
                      name: Marina Alves
                    uploadedAt: '2026-09-26T09:40:00Z'
                    durationSeconds: 2415
                    failureReason: null
                    tags:
                    - Docker
                    transcription:
                      status: in-progress
                      readable: true
                      readyAt: '2026-10-14T10:12:00Z'
                      failureReason: null
                      canStart: false
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: O vídeo não está pronto, ou a última tentativa falhou por um motivo que refazer não resolve.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronto:
                  value:
                    type: about:blank
                    title: Só vídeo pronto pode ser transcrito.
                    status: 409
                    code: VIDEO_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                naoRefazivel:
                  value:
                    type: about:blank
                    title: Este vídeo ultrapassa o limite da transcrição.
                    status: 409
                    code: TRANSCRIPTION_NOT_RETRYABLE
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '422':
          description: Chave de idempotência reutilizada em outro vídeo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                chaveReutilizada:
                  value:
                    type: about:blank
                    title: Chave de idempotência já usada em outro pedido.
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}/transcription:
    get:
      tags:
      - Transcrição
      summary: Ler a transcrição vigente de um vídeo (professor)
      description: |
        Texto completo da transcrição **vigente**, em ordem, com o tempo de cada trecho, para o professor avaliar a qualidade (RF-08, RN-M27). Somente leitura. **Não é reprodução**: não abre Sessão de Reprodução, não consulta Matrícula e não traz marca d'água (RN-TL08). Exige `midia.enviar`; vídeo de outra escola responde o mesmo 404 de vídeo inexistente (G07).

        Só existe quando `transcription.readable` é `true`; senão 409 `TRANSCRIPTION_NOT_READY` e o professor vê o estado (RF-02). Com refeita em andamento, devolve a vigente. Resposta `Cache-Control: private, no-store`. O texto não aparece em log nem em URL (RN-M26).
      operationId: getVideoTranscription
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Transcrição vigente.
          headers:
            Cache-Control:
              description: '`private, no-store`: o texto da aula nunca fica em cache compartilhado nem do navegador
                (RN-M21, G21).'
              schema:
                type: string
                examples:
                - private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTranscriptionContent'
              examples:
                vigente:
                  value:
                    videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                    revision: tr_7d2a91c4
                    language: pt-BR
                    durationMs: 2415000
                    readyAt: '2026-10-14T10:12:00Z'
                    segments:
                    - startMs: 1240
                      endMs: 4100
                      text: Hoje vamos ver o docker compose.
                    - startMs: 4100
                      endMs: 7900
                      text: Ele descreve vários containers em um só arquivo.
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: O vídeo não tem transcrição pronta (sem transcrição, transcrevendo pela primeira vez ou falhou
            sem vigente).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronta:
                  value:
                    type: about:blank
                    title: Este vídeo ainda não tem transcrição pronta.
                    status: 409
                    code: TRANSCRIPTION_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
components:
  securitySchemes:
    StaffSessionCookie:
      type: apiKey
      in: cookie
      name: staff_session
      description: |
        Cookie opaco de sessão do backoffice (CAP-002, BA06). O BFF valida a sessão em Identity a cada ação (ADR-0005) e exige `midia.enviar` na permissão vigente.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave opaca única por intenção de escrita. Repetição com o mesmo corpo devolve o mesmo resultado na janela de 24 horas; corpo diferente com a mesma chave retorna 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Prova CSRF vinculada à sessão, obtida de GET /staff-sessions/current (CAP-002).
      schema:
        type: string
        minLength: 1
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Identificador opaco do envio.
      schema:
        type: string
        format: uuid
      examples:
        envio:
          value: 3f6d2c1a-8b7e-4f90-a1b2-c3d4e5f60718
    VideoId:
      name: videoId
      in: path
      required: true
      description: Identificador opaco do vídeo, o mesmo usado nos fatos `midia.*`.
      schema:
        type: string
        format: uuid
      examples:
        video:
          value: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
    Page:
      name: _page
      in: query
      required: false
      description: Página, iniciando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Tag:
      name: tag
      in: query
      required: false
      description: |
        Tags da escola a filtrar; repetível, até 10. Cada valor é comparado sem diferenciar maiúsculas, acentos nem espaços nas pontas e repetidos (RN-T02). Valor que não é tag da escola não casa com nenhum vídeo: com `tagMatch=all` o resultado fica vazio, com `any` ele é ignorado. Combina-se com `status` e `q` como "todos ao mesmo tempo" (RF-04, RF-05).
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          minLength: 1
          maxLength: 100
      examples:
        duasTags:
          value:
            - docker
            - módulo 2
    TagMatch:
      name: tagMatch
      in: query
      required: false
      description: |
        Combinação entre as tags de `tag` (RF-06): `all` traz o vídeo que tem todas; `any`, o que tem pelo menos uma. Ausente → `all`. Sem efeito com menos de duas tags.
      schema:
        $ref: '#/components/schemas/TagMatch'
      examples:
        qualquer:
          value: any
    TagQuery:
      name: q
      in: query
      required: false
      description: Trecho da tag, sem diferenciar maiúsculas nem acentos. Ausente → as primeiras tags da escola em ordem alfabética.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      examples:
        dock:
          value: dock
  responses:
    InvalidRequest:
      description: JSON malformado, campo obrigatório ausente ou valor fora do schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              value:
                type: about:blank
                title: JSON ou campos obrigatórios inválidos.
                status: 400
                code: INVALID_REQUEST
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    SessionRequired:
      description: Sessão ausente, expirada ou encerrada — inclusive por revogação de papel (RN-17).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semSessao:
              value:
                type: about:blank
                title: Sessão ausente, expirada ou encerrada.
                status: 401
                code: SESSION_REQUIRED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PermissionDenied:
      description: Sessão válida sem `midia.enviar`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              $ref: '#/components/examples/PermissionDenied'
    PermissionOrCsrfDenied:
      description: Sessão válida sem `midia.enviar`, ou prova CSRF ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              $ref: '#/components/examples/PermissionDenied'
            csrf:
              value:
                type: about:blank
                title: Prova CSRF ausente ou inválida.
                status: 403
                code: CSRF_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    UploadNotFound:
      description: Envio inexistente, de outro ator, expirado ou já concluído — resposta idêntica.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Envio não encontrado ou expirado.
                status: 404
                code: UPLOAD_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    VideoNotFound:
      description: Vídeo inexistente ou de outra escola — resposta idêntica.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Vídeo não encontrado.
                status: 404
                code: VIDEO_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    MediaUnavailable:
      description: Media indisponível ou falha de infraestrutura atrás do BFF, inclusive armazenamento indisponível
        (C-16). Nenhum detalhe interno é exposto; o cliente pode repetir com a mesma `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Serviço de vídeos indisponível no momento.
                status: 502
                code: MEDIA_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    MediaTimeout:
      description: Media não respondeu dentro do tempo limite do BFF (C-16). Mesmo tratamento de `MediaUnavailable`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tempoEsgotado:
              value:
                type: about:blank
                title: Serviço de vídeos indisponível no momento.
                status: 504
                code: MEDIA_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
  examples:
