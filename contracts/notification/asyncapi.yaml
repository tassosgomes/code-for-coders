asyncapi: 3.0.0
info:
  title: Notificação — pedidos de envio e desfecho de entrega
  version: 1.2.0
  description: |
    Contrato **vigente** consolidado. Fronteira: Aplicação `notification`.

    Fonte da verdade do contrato desta fronteira. Mudanças entram por PR neste arquivo, promovidas a partir do recorte do PRD (ver `contracts/README.md`). Os documentos de origem, arquivados, são só histórico:

    - `tasks/archive/prd-notificacao-transacional/asyncapi-contract.yaml` 1.0.0
    - `tasks/archive/prd-acesso-interno/asyncapi-contract-notification.yaml` 1.1.0
    - `tasks/archive/prd-compra-avulsa/asyncapi-contract-notification.yaml` 1.2.0

    **Notas de prd-notificacao-transacional (1.0.0):** Contrato da fatia de fundação de `CAP-026` (PRD `tasks/archive/prd-notificacao-transacional/prd.md`, v1.1, aprovado em 2026-09-21). Cobre o recorte desta entrega: dois modelos de mensagem (`confirmacao-de-conta`, `recuperacao-de-senha`), consentimento sempre verificado e desfecho sempre publicado. Notificação é carteira, não redatora: não julga o motivo do envio, só a validade do pedido (RN-N01, RN-N02, RN-N03; RN-27/RN-28 de Identidade e Acesso).

    **Notas de prd-acesso-interno (1.1.0):** Versão 1.1.0 (CAP-002, 2026-09-25): acrescenta o modelo `convite-interno`, com `dados` próprios (`papel`, `link`), para o e-mail de Convite de Acesso Interno. Nada mais muda: canais, garantias, desfechos e os dois modelos da 1.0.0 permanecem idênticos. Contrato da fatia de fundação de `CAP-026` (PRD `tasks/archive/prd-notificacao-transacional/prd.md`, v1.1, aprovado em 2026-09-21). Cobre o recorte desta entrega: dois modelos de mensagem (`confirmacao-de-conta`, `recuperacao-de-senha`), consentimento sempre verificado e desfecho sempre publicado. Notificação é carteira, não redatora: não julga o motivo do envio, só a validade do pedido (RN-N01, RN-N02, RN-N03; RN-27/RN-28 de Identidade e Acesso).

    **Notas de prd-compra-avulsa (1.2.0):** Recorte de `CAP-011`, `tasks/archive/prd-compra-avulsa/prd.md` v1.0, aprovado em 2026-10-05. Evolui `contracts/notification/asyncapi.yaml` 1.1.0 de forma **aditiva** no pedido de envio (C-06):

    1. **Destinatário pela conta.** Além de `destinatario` (e-mail, como hoje), o pedido pode trazer `destinatarioConta` (`{tipo: conta-aluno, id}`) — **exatamente um dos dois**. Com a conta, Notificação obtém e-mail e nome em Identity (`getStudentContactInternal`) na hora de entregar. É o que permite a um remetente que não conhece o e-mail do aluno (`commerce`) pedir o envio sem que o e-mail passe por ele, pelo outbox ou pelo broker (QA-01 do PRD, RN-21, RN-26).
    2. **Modelo `comprovante-de-compra`**, finalidade transacional do mesmo nome, com os dados do pedido pago (RF-09). Transacional: não depende de consentimento de marketing (RN-N05).

    Pedidos de envio com `destinatario`, e os modelos da 1.1.0, continuam exatamente como estavam: os produtores atuais (`identity`) não mudam. Os fatos `notificacao.mensagem-entregue.v1` e `notificacao.entrega-falhou.v1` não mudam de forma; passam a poder carregar a finalidade nova, e a falha ganha o motivo `destinatario-indisponivel`. Estão em `contracts/notification/asyncapi.yaml` e não neste recorte.
id: urn:code-4-coders:notification
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: |
      Broker RabbitMQ do grupo inicial (BA02/baseline). Host, vhost, credenciais e topologia física (nome de exchange/fila) são parâmetro de implantação da plataforma e não são fixados por este contrato — apenas as garantias abaixo. Exchange `topic`, filas quorum, DLX/DLQ por fila e `x-delivery-limit` já são convenção do baseline (G06), não decisão desta entrega.
    variables:
      host:
        default: localhost
        description: Resolvido pela configuração de implantação, não por este contrato.
channels:
  pedidoDeEnvio:
    address: notificacao.envio-solicitado.v1
    description: |
      Canal endereçado a Notificação. Qualquer domínio de origem publica aqui; publicam Identidade e Acesso (RF-02, RF-03 de `CAP-026`) e, a partir da 1.2.0, Vendas (`commerce`). Routing key versionada por convenção do baseline (`{servico}.{evento}.v{n}`).
    messages:
      pedidoDeEnvioSolicitado:
        $ref: '#/components/messages/PedidoDeEnvioSolicitado'
  mensagemEntregue:
    address: notificacao.mensagem-entregue.v1
    description: Fato publicado por Notificação quando uma entrega se confirma (RF-07).
    messages:
      mensagemEntregue:
        $ref: '#/components/messages/MensagemEntregue'
  entregaFalhou:
    address: notificacao.entrega-falhou.v1
    description: |
      Fato publicado por Notificação quando uma entrega falha definitivamente — falha permanente imediata ou esgotamento das tentativas (RF-06, RF-07).
    messages:
      entregaFalhou:
        $ref: '#/components/messages/EntregaFalhou'
operations:
  receberPedidoDeEnvio:
    action: receive
    summary: Aceitar ou recusar um pedido de envio por validade, nunca por mérito (RF-01).
    channel:
      $ref: '#/channels/pedidoDeEnvio'
    messages:
      - $ref: '#/channels/pedidoDeEnvio/messages/pedidoDeEnvioSolicitado'
    bindings:
      amqp:
        ack: false
        bindingVersion: 0.3.0
    description: |
      Garantias da 1.1.0 mantidas (RF-01 de `CAP-026`): idempotente por `pedidoId` (RN-N09); pedido sem finalidade, com modelo desconhecido, com dado faltante ou com **os dois ou nenhum** destinatário é recusado e registrado, nunca enviado parcialmente; provedor de e-mail indisponível não recusa — retém (RN-N11).

      Novas na 1.2.0, para `destinatarioConta`:

      - Notificação consulta Identity no momento da entrega e usa o e-mail e o nome **atuais** da conta. Identity indisponível → o pedido é aceito e retido, como na indisponibilidade do provedor (RN-N11); nunca é descartado por isso.
      - Conta inexistente, de outra escola ou desativada → não entrega; publica `notificacao.entrega-falhou.v1` com `motivo: destinatario-indisponivel` e `esgotouTentativas: false`.
      - O e-mail resolvido fica só onde a 1.1.0 já o guardava (Registro de Entrega e fato de entrega, RN-26); nunca em log, span, métrica ou chave de cache.
  publicarMensagemEntregue:
    action: send
    summary: Publicar o desfecho de uma entrega confirmada.
    channel:
      $ref: '#/channels/mensagemEntregue'
    messages:
    - $ref: '#/channels/mensagemEntregue/messages/mensagemEntregue'
    description: Publicado pelo outbox, nunca direto do caso de uso (G06).
  publicarEntregaFalhou:
    action: send
    summary: Publicar o desfecho de uma entrega definitivamente falha.
    channel:
      $ref: '#/channels/entregaFalhou'
    messages:
    - $ref: '#/channels/entregaFalhou/messages/entregaFalhou'
    description: |
      Publicado quando a falha é permanente (endereço inexistente, recusa do provedor) ou quando as tentativas se esgotam e o pedido segue para tratamento manual (RF-06). Publicado pelo outbox, nunca direto do caso de uso (G06).
components:
  messages:
    PedidoDeEnvioSolicitado:
      name: PedidoDeEnvioSolicitado
      title: Pedido de envio solicitado
      summary: Solicitação endereçada a Notificação para entregar uma mensagem — nunca texto pronto.
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        type: object
        required:
        - correlationId
        properties:
          correlationId:
            type: string
            description: 'Identificador de correlação do fluxo de origem (ex.: o cadastro que originou o pedido, ou o pedido de compra que originou o comprovante).'
      payload:
        $ref: '#/components/schemas/PedidoDeEnvioSolicitadoPayload'
      examples:
      - name: confirmacaoDeConta
        headers:
          correlationId: identidade-cadastro-2026-09-21-0001
        payload:
          pedidoId: 9f8afbd4-ec18-42a8-abfa-e988e47812f6
          tenantId: code-4-coders
          destinatario: aluno@example.com
          finalidade: confirmacao-de-conta
          modelo: confirmacao-de-conta
          dados:
            nome: Ana Souza
            link: https://contas.code4coders.com.br/confirmar?token=abc123
          solicitadoEm: '2026-09-21T10:30:00Z'
      - name: conviteInterno
        headers:
          correlationId: backoffice-2026-10-02-0041
        payload:
          pedidoId: 6d7e8f90-a1b2-4c3d-9e4f-5a6b7c8d9e0f
          tenantId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
          destinatario: marina.alves@code4coders.com.br
          finalidade: convite-interno
          modelo: convite-interno
          dados:
            papel: professor
            link: https://backoffice.code4coders.com.br/convite?token=inv_Qm4Zt8Lw2Rp6Xa0c
          solicitadoEm: '2026-10-02T14:05:11Z'
      - name: comprovanteDeCompra
        headers:
          correlationId: 00-d4e5f60718293a4b5c6d7e8f90011223-d4e5f60718293a4b-01
        payload:
          pedidoId: 5e6f7081-9203-5a4b-8c5d-6e7f8091a2b3
          tenantId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
          destinatarioConta:
            tipo: conta-aluno
            id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
          finalidade: comprovante-de-compra
          modelo: comprovante-de-compra
          dados:
            numeroPedido: '000123'
            curso: .NET do zero à API
            opcao: Acesso por 12 meses
            valorCentavos: 49700
            meio: card
            pagoEm: '2026-10-05T14:21:02Z'
            vigencia:
              type: months
              months: 12
            link: https://app.code4coders.com.br/student/pedidos/1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
          solicitadoEm: '2026-10-05T14:21:03Z'
    MensagemEntregue:
      name: MensagemEntregue
      title: Mensagem entregue
      summary: Uma mensagem transacional foi confirmada como entregue pelo provedor.
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        type: object
        required:
        - correlationId
        properties:
          correlationId:
            type: string
            description: Repete o correlationId do pedido que originou esta entrega.
      payload:
        $ref: '#/components/schemas/MensagemEntreguePayload'
      examples:
      - name: confirmacaoDeContaEntregue
        headers:
          correlationId: identidade-cadastro-2026-09-21-0001
        payload:
          pedidoId: 9f8afbd4-ec18-42a8-abfa-e988e47812f6
          tenantId: code-4-coders
          finalidade: confirmacao-de-conta
          destinatario: aluno@example.com
          canal: email
          entregueEm: '2026-09-21T10:30:07Z'
    EntregaFalhou:
      name: EntregaFalhou
      title: Entrega falhou
      summary: Uma entrega transacional falhou definitivamente, com motivo.
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        type: object
        required:
        - correlationId
        properties:
          correlationId:
            type: string
            description: Repete o correlationId do pedido que originou esta falha.
      payload:
        $ref: '#/components/schemas/EntregaFalhouPayload'
      examples:
      - name: recuperacaoDeSenhaFalhou
        headers:
          correlationId: identidade-recuperacao-2026-09-21-0007
        payload:
          pedidoId: 2c9c9a3a-3b8a-4e1a-9a4e-6a2f2a9b8c11
          tenantId: code-4-coders
          finalidade: recuperacao-de-senha
          motivo: endereco-inexistente
          esgotouTentativas: false
          falhouEm: '2026-09-21T10:31:02Z'
  schemas:
    PedidoDeEnvioSolicitadoPayload:
      type: object
      required:
        - pedidoId
        - tenantId
        - finalidade
        - modelo
        - dados
        - solicitadoEm
      properties:
        pedidoId:
          type: string
          format: uuid
          description: |
            Identidade estável do pedido de envio, atribuída pela origem. Chave de idempotência (RN-N09). No comprovante, `commerce` a deriva do pedido de compra, de modo que a republicação do mesmo comprovante tem o mesmo `pedidoId` (RN-V09).
        tenantId:
          type: string
          description: Convenção de baseline (BA10 · G07).
        destinatario:
          type: string
          format: email
          description: |
            E-mail do destinatário, como na 1.1.0. Exceção declarada ao mascaramento (RN-26). Ausente quando o pedido traz `destinatarioConta`.
        destinatarioConta:
          $ref: '#/components/schemas/DestinatarioConta'
        finalidade:
          $ref: '#/components/schemas/Finalidade'
        modelo:
          $ref: '#/components/schemas/Finalidade'
        dados:
          $ref: '#/components/schemas/DadosDoModelo'
        solicitadoEm:
          type: string
          format: date-time
      oneOf:
        - required:
            - destinatario
          not:
            required:
              - destinatarioConta
        - required:
            - destinatarioConta
          not:
            required:
              - destinatario
      allOf:
        - if:
            properties:
              modelo:
                const: convite-interno
            required:
              - modelo
          then:
            properties:
              dados:
                required:
                  - papel
                  - link
        - if:
            properties:
              modelo:
                const: comprovante-de-compra
            required:
              - modelo
          then:
            required:
              - destinatarioConta
            properties:
              dados:
                required:
                  - numeroPedido
                  - curso
                  - opcao
                  - valorCentavos
                  - meio
                  - pagoEm
                  - vigencia
                  - link
        - if:
            properties:
              modelo:
                enum:
                  - confirmacao-de-conta
                  - recuperacao-de-senha
            required:
              - modelo
          then:
            properties:
              dados:
                required:
                  - nome
                  - link
    MensagemEntreguePayload:
      type: object
      required:
      - pedidoId
      - tenantId
      - finalidade
      - destinatario
      - canal
      - entregueEm
      properties:
        pedidoId:
          type: string
          format: uuid
          description: Correlaciona ao pedido de envio original.
        tenantId:
          type: string
        finalidade:
          $ref: '#/components/schemas/Finalidade'
        destinatario:
          type: string
          format: email
          description: |
            Exigido explicitamente pelo critério de aceite de RF-07. Não é o corpo da mensagem (RN-N08) e não substitui o mascaramento em log/span/métrica (RN-N07), que se aplica aos caminhos de observabilidade, não a este fato de integração.
        canal:
          type: string
          enum:
          - email
          description: Único canal desta fatia (Canal do Domain Map). Fixo como enum de um valor para não implicar
            suporte a outro canal.
        entregueEm:
          type: string
          format: date-time
    EntregaFalhouPayload:
      type: object
      required:
      - pedidoId
      - tenantId
      - finalidade
      - motivo
      - esgotouTentativas
      - falhouEm
      properties:
        pedidoId:
          type: string
          format: uuid
        tenantId:
          type: string
        finalidade:
          $ref: '#/components/schemas/Finalidade'
        motivo:
          type: string
          description: |
            Motivo da falha definitiva, em texto estável para diagnóstico (ex.: "endereco-inexistente", "recusa-permanente-do-provedor", "tentativas-esgotadas"). O PRD não fixa um vocabulário fechado; a TechSpec pode declará-lo sem quebrar este contrato (campo permanece string).
        esgotouTentativas:
          type: boolean
          description: |
            Verdadeiro quando a falha só se confirmou após esgotar o limite de tentativas (RF-06, terceiro critério — o pedido também segue para tratamento manual/DLQ e a operação é alertada). Falso para falha permanente reconhecida de imediato (endereço inexistente, recusa do provedor).
        falhouEm:
          type: string
          format: date-time
    Finalidade:
      type: string
      enum:
        - confirmacao-de-conta
        - recuperacao-de-senha
        - convite-interno
        - comprovante-de-compra
      description: |
        `comprovante-de-compra` acrescentado na 1.2.0 (CAP-011): mensagem transacional ao aluno cujo pedido foi pago (RF-09). Há exatamente um Modelo de Mensagem por finalidade, como na 1.0.0.
    DadosDoModelo:
      type: object
      properties:
        nome:
          type: string
          description: Nome do destinatário, em `confirmacao-de-conta` e `recuperacao-de-senha`. No comprovante, vem da conta, resolvido por Notificação.
        link:
          type: string
          format: uri
          description: Link da mensagem. No comprovante, a página do pedido no app do aluno (`/student/pedidos/{orderId}`), de onde ele segue para o curso.
        papel:
          type: string
          enum:
            - professor
            - suporte
            - financeiro
            - administrador
          description: Só em `convite-interno`.
        numeroPedido:
          type: string
          pattern: ^[0-9]{6,}$
          description: Só no comprovante. Número do pedido mostrado ao aluno.
        curso:
          type: string
          minLength: 1
          description: Só no comprovante. Título do curso congelado no pedido.
        opcao:
          type: string
          minLength: 1
          description: Só no comprovante. Nome da opção de compra congelado no pedido.
        valorCentavos:
          type: integer
          minimum: 1
          description: Só no comprovante. Valor pago, em centavos de real.
        meio:
          type: string
          enum:
            - card
            - pix
            - boleto
          description: Só no comprovante. O modelo o escreve como "cartão de crédito", "PIX" ou "boleto"; nenhum dado do cartão.
        pagoEm:
          type: string
          format: date-time
          description: Só no comprovante. Momento do pagamento; o modelo o exibe no fuso da escola.
        vigencia:
          description: Só no comprovante. Vigência comprada; o modelo a escreve como "acesso por N meses a partir da liberação" ou "acesso vitalício" (RN-D04). O término exato não vai aqui — é calculado por Matrícula.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - months
              properties:
                type:
                  const: months
                months:
                  type: integer
                  minimum: 1
                  maximum: 60
            - type: object
              additionalProperties: false
              required:
                - type
              properties:
                type:
                  const: lifetime
      description: |
        A obrigatoriedade depende do modelo — ver `PedidoDeEnvioSolicitadoPayload.allOf`. O comprovante declara que não é documento fiscal no próprio Modelo de Mensagem, que é de Notificação (RN-28).
    DestinatarioConta:
      type: object
      additionalProperties: false
      required:
        - tipo
        - id
      description: Conta a quem entregar; e-mail e nome são resolvidos por Notificação em Identity (C-06).
      properties:
        tipo:
          type: string
          enum:
            - conta-aluno
          description: Só conta de aluno nesta versão. Consumidores devem tolerar valor novo.
        id:
          type: string
          format: uuid
          description: Conta em Identidade e Acesso.
