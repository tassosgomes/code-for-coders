  /courtesy-grants:
    post:
      tags:
      - Cortesias
      summary: Conceder cortesia
      description: 'Concede a cortesia: acesso ao curso **sem pedido**, a partir do momento da confirmação, por
        1 a 60 meses ou vitalício, com motivo obrigatório (RF-03, RN-D11). Várias concessões convivem (RN-D07):
        já haver uma ativa **não** impede. Concessão, fato `matricula.acesso-concedido` e ato `cortesia-concedida`
        nascem na mesma transação ou não nascem. Reenvio com a mesma `Idempotency-Key` e o mesmo corpo não duplica:
        devolve a concessão original (200). O beneficiário é reconfirmado como conta de aluno ativa no momento da
        concessão (RN-D09, C-03): conta desativada ou deixada de ser de aluno entre a localização e a confirmação
        → 422 `STUDENT_ACCOUNT_NOT_ELIGIBLE`. **Não há operação para desfazer** nesta entrega (DP-07, `CAP-009`).
        Exige `cortesia.conceder` no claim `permissions`; o autor dos atos é `sub`. A conta é reconfirmada em Identity
        (`confirmStudentAccountInternal`, C-03) antes de gravar; sem resposta, nada é concedido.'
      operationId: grantCourtesyInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourtesyGrantInput'
            examples:
              seisMeses:
                value:
                  studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                  courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                  accessPeriod:
                    type: months
                    months: 6
                  reason: Bolsa do programa de mentoria, turma de outubro
              vitalicia:
                value:
                  studentId: 2b3c4d5e-6f70-4a81-9b92-a3b4c5d6e7f8
                  courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                  accessPeriod:
                    type: lifetime
                  reason: Parceria com a comunidade de desenvolvedores
      responses:
        '200':
          description: Reenvio da mesma solicitação (mesma `Idempotency-Key` e mesmo corpo); devolve a concessão
            já criada. Nada novo foi gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              examples:
                reenvio:
                  $ref: '#/components/examples/AccessGrantSixMonths'
        '201':
          description: Cortesia concedida.
          headers:
            Location:
              description: Endereço da concessão criada.
              schema:
                type: string
                examples:
                - /api/v1/courtesy-grants/4c5d6e7f-8091-4a2b-9c3d-4e5f6a7b8c9d
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              examples:
                seisMeses:
                  $ref: '#/components/examples/AccessGrantSixMonths'
                vitalicia:
                  $ref: '#/components/examples/AccessGrantLifetime'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/GrantRejected'
        '503':
          $ref: '#/components/responses/StudentAccountCheckUnavailable'
  /courtesy-grants/{grantId}:
    parameters:
    - $ref: '#/components/parameters/GrantId'
    get:
      tags:
      - Cortesias
      summary: Ver uma cortesia concedida
      description: Devolve a concessão de origem cortesia, na escola do ator. Concessão de outra origem, inexistente
        ou de outra escola respondem o mesmo 404 (G07). Exige `cortesia.conceder` no claim `permissions`; o autor
        dos atos é `sub`.
      operationId: getCourtesyGrantInternal
      security:
      - StaffUserToken: []
      responses:
        '200':
          description: A concessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              examples:
                seisMeses:
                  $ref: '#/components/examples/AccessGrantSixMonths'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/GrantNotFound'
  /access-decision:
    get:
      tags:
      - Decisão de acesso
      summary: Decidir se o aluno pode acessar o curso agora
      description: 'Fonte única da resposta "este aluno pode acessar este curso agora?" (RN-D01, G11, RF-06). Consultada
        por Mídia antes de cada sessão de reprodução e por Aprendizagem; **nenhum consumidor guarda réplica do direito**.
        O aluno tem acesso se ao menos uma concessão dele sobre o curso está ativa e dentro da vigência (RN-D07):
        a decisão compara `expiresAt` com o momento da pergunta, sem depender de rotina nem do fato `acesso-expirado`
        (RN-D06). Responde **200 também quando nega**: negar é resposta, não erro. Aluno desconhecido, conta que
        não é de aluno, curso desconhecido e dado de outra escola resultam em `denied` com `no-grant`, indistintos
        (G07, RN-D17). A decisão é só sobre o curso: nunca diz se uma aula está liberada (RN-D15) e não muda por
        nova versão (RN-D08) nem por mudança de oferta (RN-D03). Quem não obtiver resposta **não libera** o acesso
        (falha fechada, BA07). Pode ser guardada pelo consumidor por **até 30 segundos**, nunca além de `expiresAt`.
        Nenhum dado pessoal na consulta nem na resposta (G10, G23).'
      operationId: decideAccessInternal
      security:
      - DomainServiceAssertion: []
      parameters:
      - name: studentId
        in: query
        required: true
        description: Conta de aluno em Identidade e Acesso.
        schema:
          type: string
          format: uuid
      - name: courseId
        in: query
        required: true
        description: Curso em Conteúdo e Currículo.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A decisão. Pode ser guardada por até 30 segundos.
          headers:
            Cache-Control:
              description: '`private, max-age=30` (BA07): teto absoluto de cache do consumidor.'
              schema:
                type: string
                examples:
                - private, max-age=30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
              examples:
                permitidoPorPeriodo:
                  value:
                    decision: allowed
                    validity:
                      type: until
                      expiresAt: '2027-04-13T03:00:00Z'
                    deniedReason: null
                    lastExpiredAt: null
                    decidedAt: '2026-10-12T14:15:00Z'
                permitidoVitalicio:
                  value:
                    decision: allowed
                    validity:
                      type: lifetime
                    deniedReason: null
                    lastExpiredAt: null
                    decidedAt: '2026-10-12T14:15:00Z'
                semDireito:
                  value:
                    decision: denied
                    validity: null
                    deniedReason: no-grant
                    lastExpiredAt: null
                    decidedAt: '2026-10-12T14:15:00Z'
                vigenciaEncerrada:
                  value:
                    decision: denied
                    validity: null
                    deniedReason: grant-ended
                    lastExpiredAt: '2026-10-01T03:00:00Z'
                    decidedAt: '2026-10-12T14:15:00Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/ScopeDenied'
components:
  securitySchemes:
    StaffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT RS256 de ator interno emitido por Identity (`validateStaffSessionInternal` com `audience:
        commerce`), vida curta, claims iss, aud, sub, tenantId, sessionId, scope, roles, permissions, exp, jti.
        Chave pública por `kid` no JWKS de Identity. As operações de Cortesias exigem `cortesia.conceder`.'
    StudentBffServiceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Asserção de serviço assimétrica e curta assinada pela chave exclusiva do `bff-student` (mecanismo
        da ADR-0004, estendido a `commerce` por C-04; ADR própria na TechSpec). `commerce` valida assinatura, `kid`,
        emissor `bff-student`, audiência `commerce`, escopo, `tenantId`, validade e `jti` contra replay. Escopos:
        `showcase:read` nas leituras e `purchase-intent:write` no clique. Não representa aluno nem visitante.'
    DomainServiceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Asserção de serviço assimétrica e curta assinada pela chave exclusiva do serviço chamador (`media`
        ou `learning`), no mecanismo da ADR-0004 estendido por ADR-0009; a extensão a serviços de domínio como emissores
        é registrada em ADR própria pela TechSpec (C-04). `commerce` valida assinatura, `kid`, emissor, audiência
        `commerce`, escopo `access-decision:read`, `tenantId` permitido ao emissor, validade e `jti` contra replay.
        Não representa aluno.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        instance:
          type: string
    FinanceArea:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - reserved
    CourseLevel:
      type: string
      enum:
      - beginner
      - intermediate
      - advanced
      description: Nível do curso, vindo da versão vigente (RN-C18). Clientes devem tolerar valor novo.
    PriceCents:
      type: integer
      minimum: 1
      maximum: 9999999
      description: Preço em centavos de real (BRL), de R$ 0,01 a R$ 99.999,99 (DP-03). Sem parcelamento.
      examples:
      - 49700
    AccessPeriod:
      description: |
        Vigência da concessão, na forma única de `AccessPeriod` de CAP-003 (C-05): por período, em meses inteiros de 1 a 60 (DP-04), contados a partir do momento da concessão (RN-D04), ou vitalícia.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - months
        properties:
          type:
            const: months
          months:
            type: integer
            minimum: 1
            maximum: 60
            examples:
            - 12
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: lifetime
    OfferName:
      type: string
      minLength: 1
      maxLength: 60
      description: Nome da opção exibido na vitrine (DP-03).
      examples:
      - Acesso por 12 meses
    OfferStatus:
      type: string
      enum:
      - draft
      - published
      - unpublished
      description: |
        `draft` — nunca publicada; pode ser excluída. `published` — à venda. `unpublished` — já foi publicada, não está à venda e não pode ser excluída (RN-O11).
    OfferInput:
      type: object
      additionalProperties: false
      required:
      - name
      - priceCents
      - accessPeriod
      properties:
        name:
          $ref: '#/components/schemas/OfferName'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
    UpdateOfferRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/OfferName'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
    UpdateCatalogCourseRequest:
      type: object
      additionalProperties: false
      required:
      - tagline
      properties:
        tagline:
          $ref: '#/components/schemas/Tagline'
    Tagline:
      description: Chamada comercial, até 160 caracteres (RF-02, DP-03); `null` quando não há.
      oneOf:
      - type: string
        minLength: 1
        maxLength: 160
      - type: 'null'
    Offer:
      type: object
      additionalProperties: false
      required:
      - offerId
      - courseId
      - name
      - priceCents
      - accessPeriod
      - status
      - purchaseIntentCount
      - createdAt
      - updatedAt
      - publishedAt
      properties:
        offerId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/OfferName'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        status:
          $ref: '#/components/schemas/OfferStatus'
        purchaseIntentCount:
          type: integer
          minimum: 0
          description: Cliques em *Comprar* desde a primeira publicação (RF-09). Anônimo.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Última publicação; `null` se nunca foi publicada.
    RecommendedCourse:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
    CatalogCourseSummary:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      - level
      - inShowcase
      - offerCounts
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          description: Título da versão vigente.
        level:
          oneOf:
          - $ref: '#/components/schemas/CourseLevel'
          - type: 'null'
        inShowcase:
          type: boolean
        offerCounts:
          type: object
          additionalProperties: false
          required:
          - draft
          - published
          - unpublished
          properties:
            draft:
              type: integer
              minimum: 0
            published:
              type: integer
              minimum: 0
            unpublished:
              type: integer
              minimum: 0
    CatalogCourseSummaryPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCourseSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CatalogCourseDetail:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      - level
      - prerequisite
      - tagline
      - inShowcase
      - offers
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        level:
          description: Nível da versão vigente; `null` bloqueia a publicação de oferta (RN-O03).
          oneOf:
          - $ref: '#/components/schemas/CourseLevel'
          - type: 'null'
        prerequisite:
          type: object
          additionalProperties: false
          required:
          - text
          - recommendedCourses
          properties:
            text:
              type:
              - string
              - 'null'
            recommendedCourses:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RecommendedCourse'
        tagline:
          $ref: '#/components/schemas/Tagline'
        inShowcase:
          type: boolean
        offers:
          type: array
          maxItems: 50
          description: Todas as ofertas do curso, rascunhos primeiro, depois publicadas e despublicadas (C-06).
          items:
            $ref: '#/components/schemas/Offer'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ShowcaseCourseCard:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      - level
      - summary
      - lowestPriceCents
      - offerCount
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        summary:
          type: string
          maxLength: 200
        lowestPriceCents:
          type: integer
          minimum: 1
          description: Menor preço entre as ofertas publicadas, em centavos de real.
        offerCount:
          type: integer
          minimum: 1
    ShowcaseCoursePage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShowcaseCourseCard'
        pagination:
          type: object
          additionalProperties: false
          required:
          - page
          - size
          - total
          - totalPages
          properties:
            page:
              type: integer
              minimum: 1
            size:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
    ShowcaseCourseDetail:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      - level
      - description
      - prerequisite
      - modules
      - offers
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        description:
          type: string
          maxLength: 5000
          description: Descrição pedagógica da versão vigente; pode ser vazia.
        prerequisite:
          type: object
          additionalProperties: false
          required:
          - text
          - recommendedCourses
          description: Recomendação, nunca condição (DE04). Ausência explícita.
          properties:
            text:
              type:
              - string
              - 'null'
            recommendedCourses:
              type: array
              maxItems: 5
              items:
                type: object
                additionalProperties: false
                required:
                - courseId
                - title
                - inShowcase
                properties:
                  courseId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  inShowcase:
                    type: boolean
                    description: Quando `false`, exibir só o título, sem link.
        modules:
          type: array
          minItems: 1
          maxItems: 100
          description: Estrutura da versão vigente, em ordem.
          items:
            type: object
            additionalProperties: false
            required:
            - title
            - lessons
            properties:
              title:
                type: string
              lessons:
                type: array
                minItems: 1
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - title
                  properties:
                    title:
                      type: string
        offers:
          type: array
          minItems: 1
          maxItems: 50
          description: Ofertas publicadas, do menor para o maior preço.
          items:
            type: object
            additionalProperties: false
            required:
            - offerId
            - name
            - priceCents
            - accessPeriod
            properties:
              offerId:
                type: string
                format: uuid
              name:
                type: string
              priceCents:
                type: integer
                minimum: 1
              accessPeriod:
                $ref: '#/components/schemas/AccessPeriod'
    PurchaseIntentAccepted:
      type: object
      additionalProperties: false
      required:
      - purchaseAvailability
      properties:
        purchaseAvailability:
          type: string
          enum:
          - coming-soon
          description: Estado da compra da oferta. `CAP-011` substitui este fluxo; clientes devem tolerar valor
            novo.
    ResolveOfferReferencesRequest:
      type: object
      additionalProperties: false
      required:
      - offerIds
      properties:
        offerIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
    OfferReferenceList:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - offerId
            - label
            properties:
              offerId:
                type: string
                format: uuid
              label:
                type: string
                maxLength: 263
    CourtesyCourse:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      properties:
        courseId:
          type: string
          format: uuid
          description: Identificador do curso em Conteúdo e Currículo.
        title:
          type: string
          description: Título da versão vigente.
    CourtesyGrantInput:
      type: object
      additionalProperties: false
      required:
      - studentId
      - courseId
      - accessPeriod
      - reason
      properties:
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: |
            Motivo obrigatório (RN-D11, DP-04): de 1 a 500 caracteres, com ao menos um caractere que não seja espaço. Não deve conter dado pessoal de terceiros (RN-A08). Vai ao ato de auditoria e à concessão; nunca a log, métrica ou rastreamento.
          examples:
          - Bolsa do programa de mentoria, turma de outubro
    AccessGrant:
      type: object
      additionalProperties: false
      required:
      - grantId
      - studentId
      - courseId
      - courseTitle
      - origin
      - status
      - accessPeriod
      - grantedAt
      - endsOn
      - expiresAt
      - reason
      description: Uma concessão de acesso de um aluno a um curso (Matrícula e Direito de Acesso).
      properties:
        grantId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
          description: Título atual do curso na visão de Matrícula. Só para exibição.
        origin:
          type: string
          enum:
          - courtesy
          - purchase
          - subscription
          - cohort
          description: |
            Origem da concessão (RN-D02). Nesta entrega só `courtesy` é concedível; os demais valores nascem em `CAP-011`, `CAP-013`/`CAP-014` e `CAP-010`. Clientes devem tolerar valor novo.
        status:
          type: string
          enum:
          - active
          - expired
          description: |
            Calculado na leitura (RN-D06): `expired` quando o momento atual é igual ou posterior a `expiresAt`. `suspended` e `revoked` virão com `CAP-009`; clientes devem tolerar valor novo.
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        grantedAt:
          type: string
          format: date-time
          description: Momento da concessão, em UTC. É de onde a vigência conta (RN-D04).
        endsOn:
          type:
          - string
          - 'null'
          format: date
          description: |
            Último dia de acesso, no fuso da escola (horário de Brasília na Fase 1, DP-03), para exibir "até DD/MM/AAAA". Nulo na vitalícia. Mês sem o dia → último dia do mês.
          examples:
          - '2027-10-12'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: |
            Instante, em UTC, em que o acesso **deixa** de valer (exclusivo): o início do dia seguinte a `endsOn` no fuso da escola. Há acesso se o momento da pergunta é anterior a ele. Nulo na vitalícia.
          examples:
          - '2027-10-13T03:00:00Z'
        reason:
          type:
          - string
          - 'null'
          description: Motivo informado ao conceder. Presente na cortesia; nulo em origens sem motivo.
    PaginationInfo:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    CourtesyCoursePage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourtesyCourse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    AccessGrantPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrant'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    AccessDecision:
      type: object
      additionalProperties: false
      required:
      - decision
      - validity
      - deniedReason
      - lastExpiredAt
      - decidedAt
      description: Resposta única de Matrícula à pergunta "pode acessar agora?" (DP-09).
      properties:
        decision:
          type: string
          enum:
          - allowed
          - denied
        validity:
          description: 'Quando `allowed`: o término efetivo — o da concessão ativa que dura mais; `lifetime` se
            alguma ativa é vitalícia. Nulo quando `denied`.'
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - type
            - expiresAt
            properties:
              type:
                const: until
              expiresAt:
                type: string
                format: date-time
                description: Instante em que o acesso deixa de valer (exclusivo), em UTC.
          - type: object
            additionalProperties: false
            required:
            - type
            properties:
              type:
                const: lifetime
        deniedReason:
          type:
          - string
          - 'null'
          enum:
          - no-grant
          - grant-ended
          - null
          description: 'Quando `denied`: `no-grant` (nunca teve concessão a esse curso) ou `grant-ended` (já teve,
            nenhuma está ativa). Nulo quando `allowed`. Clientes devem tolerar valor novo (`suspended` e `revoked`
            virão com `CAP-009`).'
        lastExpiredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Em `grant-ended`, o término da última concessão. Nulo nos demais casos.
        decidedAt:
          type: string
          format: date-time
          description: Momento em que Matrícula decidiu, em UTC.
    CourtesyTermPreview:
      type: object
      additionalProperties: false
      required:
      - months
      - computedAt
      - endsOn
      - expiresAt
      description: Prévia do término de uma vigência por período, calculada pela regra da concessão e sem efeito
        (RF-03, DP-03).
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 60
        computedAt:
          type: string
          format: date-time
          description: Momento, em UTC, a partir do qual o servidor calculou. A concessão calcula de novo no seu
            momento.
        endsOn:
          type: string
          format: date
          description: Último dia de acesso, no fuso da escola.
        expiresAt:
          type: string
          format: date-time
          description: Instante, em UTC, em que o acesso deixa de valer (exclusivo).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave opaca única por intenção de escrita (G09). Repetição com o mesmo corpo devolve o mesmo resultado na janela de 24 horas; corpo diferente com a mesma chave → 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identificador do curso em Conteúdo e Currículo.
      schema:
        type: string
        format: uuid
    OfferId:
      name: offerId
      in: path
      required: true
      description: Identificador da oferta.
      schema:
        type: string
        format: uuid
    Page:
      name: _page
      in: query
      required: false
      description: Página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    ShowcaseSize:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 48
        default: 12
    StudentId:
      name: studentId
      in: path
      required: true
      description: Identificador da conta de aluno em Identidade e Acesso.
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      description: Identificador da concessão.
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Requisição malformada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformada:
              value:
                type: about:blank
                title: Requisição inválida.
                status: 400
                code: INVALID_REQUEST
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    CatalogCourseNotFound:
      description: Curso inexistente, de outra escola ou sem versão vigente — indistintos (G07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Curso não encontrado no catálogo.
                status: 404
                code: CATALOG_COURSE_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OfferNotFound:
      description: Oferta inexistente ou de outra escola — indistintas (G07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrada:
              value:
                type: about:blank
                title: Oferta não encontrada.
                status: 404
                code: OFFER_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    InvalidOfferContent:
      description: |
        Conteúdo fora das regras: `FIELD_INVALID` (preço, vigência, nome ou chamada fora dos limites de DP-03, com o campo em `detail`) ou `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            preco:
              value:
                type: about:blank
                title: Campo inválido.
                status: 422
                detail: priceCents deve estar entre 1 e 9999999.
                code: FIELD_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OfferStateConflict:
      description: A ação não cabe no estado atual da oferta (RN-O11).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            estado:
              value:
                type: about:blank
                title: A oferta não está no estado exigido.
                status: 422
                code: OFFER_STATE_CONFLICT
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PublishRejected:
      description: '`COURSE_LEVEL_REQUIRED` (versão vigente sem nível, RN-O03), `OFFER_STATE_CONFLICT` ou `IDEMPOTENCY_KEY_REUSED`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semNivel:
              value:
                type: about:blank
                title: O curso não declara nível.
                status: 422
                detail: O professor precisa declarar o nível e publicar o curso.
                code: COURSE_LEVEL_REQUIRED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    ShowcaseCourseNotFound:
      description: Curso fora da vitrine, inexistente ou de outra escola — indistintos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Curso não disponível.
                status: 404
                code: SHOWCASE_COURSE_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OfferNotAvailable:
      description: Oferta não publicada, inexistente ou de outra escola — indistintas. O clique não é contado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Oferta não disponível.
                status: 404
                code: OFFER_NOT_AVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    TokenInvalid:
      description: JWT ausente, expirado, de audiência errada ou com assinatura inválida; code `TOKEN_INVALID`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            e:
              value:
                type: about:blank
                title: Token de acesso inválido.
                status: 401
                code: TOKEN_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
            token:
              value:
                type: about:blank
                title: Token inválido.
                status: 401
                code: TOKEN_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PermissionDenied:
      description: Token sem `cortesia.conceder`; code `PERMISSION_DENIED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            e:
              value:
                type: about:blank
                title: Sem permissão.
                status: 403
                code: PERMISSION_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
            semPermissao:
              value:
                type: about:blank
                title: Sem permissão para conceder acesso.
                status: 403
                code: PERMISSION_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    AssertionInvalid:
      description: Asserção de serviço ausente, inválida, repetida (`jti`) ou de outro emissor; JWT de usuário no
        lugar da asserção.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            e:
              value:
                type: about:blank
                title: Credencial de serviço inválida.
                status: 401
                code: SERVICE_ASSERTION_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    ScopeDenied:
      description: Asserção sem o escopo `access-decision:read` ou de emissor sem permissão para o `tenantId`; code
        `SCOPE_DENIED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            e:
              value:
                type: about:blank
                title: Escopo insuficiente.
                status: 403
                code: SCOPE_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
            escopo:
              value:
                type: about:blank
                title: Escopo insuficiente.
                status: 403
                code: SCOPE_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    GrantNotFound:
      description: Cortesia inexistente, de outra origem ou de outra escola — indistintas (G07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrada:
              value:
                type: about:blank
                title: Cortesia não encontrada.
                status: 404
                code: GRANT_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    GrantRejected:
      description: |
        Regra violada, nada concedido: `FIELD_INVALID` (motivo vazio ou acima de 500 caracteres, meses fora de 1 a 60, com o campo em `detail`), `STUDENT_ACCOUNT_NOT_ELIGIBLE` (conta inexistente, de outra escola, deixou de ser de aluno ou está desativada — RN-D09), `COURSE_NOT_ELIGIBLE` (curso nunca publicado ou de outra escola — DP-05, RN-D17) ou `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            motivoVazio:
              value:
                type: about:blank
                title: Campo inválido.
                status: 422
                detail: reason deve ter de 1 a 500 caracteres e não ser só espaços.
                code: FIELD_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
            contaDesativada:
              value:
                type: about:blank
                title: A conta não pode receber acesso.
                status: 422
                code: STUDENT_ACCOUNT_NOT_ELIGIBLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    ServiceUnauthorized:
      description: Asserção ausente, inválida, expirada, de audiência errada ou com `jti` repetido; code `SERVICE_UNAUTHORIZED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            asserção:
              value:
                type: about:blank
                title: Serviço não autenticado.
                status: 401
                code: SERVICE_UNAUTHORIZED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    StudentAccountCheckUnavailable:
      description: '`commerce` não conseguiu reconfirmar a conta em Identity. **Falha fechada**: nada foi concedido;
        `STUDENT_ACCOUNT_CHECK_UNAVAILABLE`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Não foi possível confirmar a conta do aluno.
                status: 503
                code: STUDENT_ACCOUNT_CHECK_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
