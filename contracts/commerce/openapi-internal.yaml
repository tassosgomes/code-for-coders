      summary: Calcular o término de uma vigência por período
      description: 'Leitura **sem efeito**, para o passo "Vigência" e a revisão (RF-03): devolve o último dia de
        acesso e o instante em que o acesso deixa de valer **se a cortesia fosse concedida agora**, pela mesma regra
        da concessão (DP-03, RF-05). Nada é gravado e a tela não recalcula a regra. O resultado vale se a confirmação
        ocorrer no mesmo dia no fuso da escola; o término definitivo é o devolvido por `grantCourtesy`. Vigência
        vitalícia não tem término e não usa esta operação. Exige `cortesia.conceder` no claim `permissions`.'
      operationId: previewCourtesyTermInternal
