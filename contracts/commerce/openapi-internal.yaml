openapi: 3.1.0
info:
  title: Commerce — API interna
  version: 1.2.0
  description: |
    Contrato **vigente** consolidado. Fronteira: `bff-admin` → `commerce` (área financeira, Catálogo, cortesias), `bff-student` → `commerce` (vitrine) e serviços → `commerce` (decisão de acesso).

    Fonte da verdade do contrato desta fronteira. Mudanças entram por PR neste arquivo, promovidas a partir do recorte do PRD (ver `contracts/README.md`). Os documentos de origem, arquivados, são só histórico:

    - `tasks/archive/prd-acesso-interno/internal-api-contract-commerce.yaml` 1.0.0
    - `tasks/archive/prd-vitrine-oferta/internal-api-contract-commerce.yaml` 1.1.0
    - `tasks/archive/prd-concessao-acesso/internal-api-contract-commerce.yaml` 1.2.0

    **Notas de prd-acesso-interno (1.0.0):** Recorte interno de CAP-002 (TechSpec aprovada em 2026-09-25, V-07; ADR-0005). Consumidor único conhecido: `bff-admin`. `commerce` valida localmente o JWT de usuário emitido por Identity (assinatura pelo JWKS de Identity, emissor `identity`, audiência `commerce`, validade) e decide pela permissão do claim `permissions`, sem consultar Identity e sem confiar no BFF. A área não tem dado até CAP-011.

    **Notas de prd-vitrine-oferta (1.1.0):** Recorte interno do primeiro PRD de CAP-003 (`tasks/archive/prd-vitrine-oferta/prd.md` v1.0, aprovado em 2026-09-30). Evolui `commerce` 1.0.0 (`tasks/archive/prd-acesso-interno/internal-api-contract-commerce.yaml`, área financeira reservada, sem mudança) com o módulo Catálogo. Três consumidores e dois esquemas de segurança: (1) `bff-admin`, com o JWT do ator de audiência `commerce` (ADR-0005) — operações de ficha e oferta, derivadas mecanicamente de `api-contract.yaml` 1.0.0 (sem cookie nem CSRF; sem 502/504, que são do BFF), e `resolveOfferReferencesInternal` para a consulta da trilha; (2) `bff-student`, com asserção de serviço própria (C-04) — vitrine, página e clique, derivadas de `api-contract-student.yaml` 1.0.0. `commerce` decide pelas claims, sem confiar no BFF. A escola vem do `tenantId` do token ou da asserção (G07).

    **Notas de prd-concessao-acesso (1.2.0):** Recorte interno do primeiro PRD de CAP-008 (`tasks/archive/prd-concessao-acesso/prd.md` v1.0, aprovado em 2026-10-01). Evolui `commerce` 1.1.0 (`tasks/archive/prd-vitrine-oferta/internal-api-contract-commerce.yaml`, Catálogo e vitrine, sem mudança) com o módulo Matrícula. Dois consumidores e dois esquemas de segurança: (1) `bff-admin`, com o JWT do ator de audiência `commerce` (ADR-0005) — operações de cortesia, derivadas mecanicamente de `api-contract.yaml` 1.0.0 (sem cookie nem CSRF; sem 502/504, que são do BFF); (2) `media` e `learning`, com asserção de serviço própria (C-04) — a decisão "pode acessar agora?", fonte única do direito (RN-D01), sem consumidor nesta entrega. `commerce` decide pelas claims, sem confiar no BFF. A escola vem do `tenantId` do token ou da asserção (G07). A localização do aluno por e-mail não passa por aqui: é de Identity (`internal-api-contract-identity.yaml`).
  contact:
    name: Time de Commerce
servers:
- url: /internal/v1
  description: Rota privada de Commerce, inacessível ao navegador
tags:
- name: FinanceArea
  description: Área financeira reservada
- name: Catálogo
  description: Fichas e ofertas, pelo backoffice
- name: Vitrine
  description: Leitura pública e intenção de compra, pelo BFF do aluno
- name: Auditoria
  description: Rótulos para a consulta da trilha
- name: Cortesias
  description: Cortesia e concessões, pelo backoffice
- name: Decisão de acesso
  description: '"Este aluno pode acessar este curso agora?", consultada por outros serviços'
paths:
  /finance-area:
    get:
      tags:
      - FinanceArea
      summary: Abrir a área financeira reservada
      description: Exige `financeiro.ler` em `permissions`. Token ausente, inválido, expirado, com audiência ou
        emissor errados → 401 TOKEN_INVALID. Token válido sem a permissão → 403 PERMISSION_DENIED.
      operationId: getFinanceAreaInternal
      security:
      - StaffUserToken: []
      responses:
        '200':
          description: Acesso concedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceArea'
              examples:
                reservada:
                  value:
                    status: reserved
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tokenInvalido:
                  value:
                    type: about:blank
                    title: Token de acesso inválido.
                    status: 401
                    code: TOKEN_INVALID
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '403':
          description: Token válido sem a permissão.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                semPermissao:
                  value:
                    type: about:blank
                    title: Sem permissão para esta área.
                    status: 403
                    code: PERMISSION_DENIED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
  /catalog/courses:
    get:
      tags:
      - Catálogo
      summary: Listar os cursos publicados no catálogo
      description: Todos os cursos com versão vigente da escola do ator, com o nível da versão vigente e quantas
        ofertas cada um tem por estado (RF-02). Curso nunca publicado não aparece. Ordenados pelo título. `inShowcase`
        indica se o curso está na vitrine agora (ao menos uma oferta publicada e nível na versão vigente — DP-04).
        Exige `oferta.editar` no claim `permissions`; o autor dos atos é `sub`.
      operationId: listCatalogCoursesInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de cursos do catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseSummaryPage'
              examples:
                pagina:
                  value:
                    data:
                    - courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                      title: .NET do zero à API
                      level: advanced
                      inShowcase: true
                      offerCounts:
                        draft: 0
                        published: 2
                        unpublished: 1
                    - courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                      title: Fundamentos de C#
                      level: null
                      inShowcase: false
                      offerCounts:
                        draft: 1
                        published: 0
                        unpublished: 0
                    pagination:
                      page: 1
                      size: 10
                      total: 2
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /catalog/courses/{courseId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      tags:
      - Catálogo
      summary: Abrir a ficha do curso
      description: Ficha de vitrine com os dados da versão vigente do curso, só para leitura — título, nível, pré-requisito
        (RN-O03) — a chamada comercial e todas as ofertas do curso, com a contagem de cliques em *Comprar* de cada
        uma (RF-09). Curso de outra escola ou nunca publicado → 404. Exige `oferta.editar` no claim `permissions`;
        o autor dos atos é `sub`.
      operationId: getCatalogCourseInternal
      security:
      - StaffUserToken: []
      responses:
        '200':
          description: Ficha do curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseDetail'
              examples:
                ficha:
                  $ref: '#/components/examples/CatalogCourseWithOffers'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CatalogCourseNotFound'
    patch:
      tags:
      - Catálogo
      summary: Alterar a chamada comercial da ficha
      description: Único dado editável da ficha (RF-02). `null` remove a chamada; a vitrine passa a usar o início
        da descrição pedagógica. Não é ato auditado. Vale na vitrine imediatamente. Exige `oferta.editar` no claim
        `permissions`; o autor dos atos é `sub`.
      operationId: updateCatalogCourseInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogCourseRequest'
            examples:
              chamada:
                value:
                  tagline: Da primeira linha de C# a uma API no ar.
      responses:
        '200':
          description: Ficha atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseDetail'
              examples:
                ficha:
                  $ref: '#/components/examples/CatalogCourseWithOffers'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CatalogCourseNotFound'
        '422':
          $ref: '#/components/responses/InvalidOfferContent'
  /catalog/courses/{courseId}/offers:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    post:
      tags:
      - Catálogo
      summary: Criar oferta em rascunho
      description: Cria uma oferta em rascunho, invisível ao público (RF-03). Um curso pode ter várias (OD48). Pode
        ser criada mesmo que a versão vigente do curso não tenha nível; só a publicação exige (RN-O03). Exige `oferta.editar`
        no claim `permissions`; o autor dos atos é `sub`.
      operationId: createOfferInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferInput'
            examples:
              dozeMeses:
                value:
                  name: Acesso por 12 meses
                  priceCents: 49700
                  accessPeriod:
                    type: months
                    months: 12
              vitalicio:
                value:
                  name: Acesso vitalício
                  priceCents: 89700
                  accessPeriod:
                    type: lifetime
      responses:
        '201':
          description: Oferta criada em rascunho.
          headers:
            Location:
              description: Endereço da oferta criada.
              schema:
                type: string
                examples:
                - /api/v1/catalog/offers/7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                rascunho:
                  $ref: '#/components/examples/OfferDraft'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CatalogCourseNotFound'
        '422':
          $ref: '#/components/responses/InvalidOfferContent'
  /catalog/offers/{offerId}:
    parameters:
    - $ref: '#/components/parameters/OfferId'
    patch:
      tags:
      - Catálogo
      summary: Alterar oferta
      description: Altera nome, preço ou vigência, em rascunho ou publicada (RF-03, RF-05). Campo ausente não muda.
        Numa oferta **publicada**, mudança de preço ou de vigência vale só para compras futuras (RN-O10) e gera
        o ato `oferta-alterada` com os valores anterior e novo, e o fato `catalogo.oferta-alterada`; mudança só
        de nome não gera ato (DP-05). Oferta despublicada também pode ser alterada, sem ato, porque não está à venda.
        Exige `oferta.editar` no claim `permissions`; o autor dos atos é `sub`.
      operationId: updateOfferInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
            examples:
              novoPreco:
                value:
                  priceCents: 39700
      responses:
        '200':
          description: Oferta alterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                publicada:
                  $ref: '#/components/examples/OfferPublished'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/InvalidOfferContent'
    delete:
      tags:
      - Catálogo
      summary: Excluir oferta em rascunho
      description: Só oferta que nunca foi publicada (RN-O11). Oferta publicada ou despublicada → 422 `OFFER_STATE_CONFLICT`.
        Exige `oferta.editar` no claim `permissions`; o autor dos atos é `sub`.
      operationId: deleteOfferInternal
      security:
      - StaffUserToken: []
      responses:
        '204':
          description: Oferta excluída.
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/OfferStateConflict'
  /catalog/offers/{offerId}/publish:
    parameters:
    - $ref: '#/components/parameters/OfferId'
    post:
      tags:
      - Catálogo
      summary: Publicar oferta
      description: Coloca uma oferta em rascunho ou despublicada à venda (RF-04). Exige que a versão vigente do
        curso declare nível (RN-O03) → senão 422 `COURSE_LEVEL_REQUIRED`. Oferta já publicada → 422 `OFFER_STATE_CONFLICT`.
        Gera, na mesma transação, o fato `catalogo.oferta-publicada` e o ato `oferta-publicada`. Exige `oferta.editar`
        no claim `permissions`; o autor dos atos é `sub`.
      operationId: publishOfferInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Oferta publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                publicada:
                  $ref: '#/components/examples/OfferPublished'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/PublishRejected'
  /catalog/offers/{offerId}/unpublish:
    parameters:
    - $ref: '#/components/parameters/OfferId'
    post:
      tags:
      - Catálogo
      summary: Despublicar oferta
      description: Tira a oferta da vitrine e impede compra nova (RF-06, RN-O12); não afeta pedido nem concessão.
        Oferta que não está publicada → 422 `OFFER_STATE_CONFLICT`. Gera o fato `catalogo.oferta-despublicada` e
        o ato `oferta-despublicada`. Exige `oferta.editar` no claim `permissions`; o autor dos atos é `sub`.
      operationId: unpublishOfferInternal
      security:
      - StaffUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Oferta despublicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                despublicada:
                  $ref: '#/components/examples/OfferUnpublished'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/OfferStateConflict'
  /showcase/courses:
    get:
      tags:
      - Vitrine
      summary: Listar os cursos da vitrine
      description: Cursos com ao menos uma oferta publicada e nível na versão vigente (RF-07, DP-04), do mais recentemente
        colocado na vitrine para o mais antigo. `summary` é a chamada comercial ou, sem ela, o início da descrição
        pedagógica, cortado em até 200 caracteres. `lowestPriceCents` é o menor preço entre as ofertas publicadas;
        `offerCount` permite exibir "a partir de" quando maior que 1. Exige a asserção do `bff-student` com escopo
        `showcase:read`; a escola é o `tenantId` da asserção.
      operationId: listShowcaseCoursesInternal
      security:
      - StudentBffServiceAssertion: []
      parameters:
      - name: level
        in: query
        required: false
        description: Filtra por nível. Ausente = todos.
        schema:
          $ref: '#/components/schemas/CourseLevel'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/ShowcaseSize'
      responses:
        '200':
          description: Página da vitrine. Filtro sem resultado devolve `data` vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseCoursePage'
              examples:
                iniciante:
                  value:
                    data:
                    - courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                      title: Fundamentos de C#
                      level: beginner
                      summary: Sintaxe, tipos e orientação a objetos em C#.
                      lowestPriceCents: 29700
                      offerCount: 1
                    pagination:
                      page: 1
                      size: 12
                      total: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AssertionInvalid'
        '403':
          $ref: '#/components/responses/ScopeDenied'
  /showcase/courses/{courseId}:
    parameters:
    - name: courseId
      in: path
      required: true
      description: Identificador do curso; compõe o endereço público estável da página (RF-08, C-07).
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Vitrine
      summary: Abrir a página pública do curso
      description: Título, nível, descrição pedagógica, pré-requisito recomendado, estrutura da versão vigente (módulos
        e títulos de aulas, sem vídeo) e as opções de compra publicadas (RF-08). Cada curso recomendado indica se
        está na vitrine (`inShowcase`), para o link; o título é o atual quando o Catálogo conhece o curso e o da
        publicação quando não (C-02). Curso fora da vitrine, inexistente ou de outra escola → 404 indistinto. Exige
        a asserção do `bff-student` com escopo `showcase:read`; a escola é o `tenantId` da asserção.
      operationId: getShowcaseCourseInternal
      security:
      - StudentBffServiceAssertion: []
      responses:
        '200':
          description: Página do curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseCourseDetail'
              examples:
                avancado:
                  value:
                    courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                    title: .NET do zero à API
                    level: advanced
                    description: Do primeiro programa a uma API publicada, com testes e deploy.
                    prerequisite:
                      text: Git e C# básico.
                      recommendedCourses:
                      - courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                        title: Fundamentos de C#
                        inShowcase: true
                    modules:
                    - title: Fundamentos da linguagem
                      lessons:
                      - title: Tipos e variáveis
                      - title: Controle de fluxo
                    offers:
                    - offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                      name: Acesso por 12 meses
                      priceCents: 39700
                      accessPeriod:
                        type: months
                        months: 12
                    - offerId: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
                      name: Acesso vitalício
                      priceCents: 89700
                      accessPeriod:
                        type: lifetime
        '404':
          $ref: '#/components/responses/ShowcaseCourseNotFound'
        '401':
          $ref: '#/components/responses/AssertionInvalid'
        '403':
          $ref: '#/components/responses/ScopeDenied'
  /showcase/offers/{offerId}/purchase-intents:
    parameters:
    - name: offerId
      in: path
      required: true
      description: Oferta publicada cujo botão *Comprar* foi clicado.
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Vitrine
      summary: Registrar um clique em Comprar
      description: 'Soma um à contagem anônima da oferta (RF-09, OD53) e responde que a compra estará disponível
        em breve. Sem corpo. Nada que identifique a pessoa é recebido ou guardado: nem sessão, nem cookie, nem identificador
        de navegador, nem IP (G10, G26). A `Idempotency-Key`, gerada por clique no navegador, evita contar duas
        vezes a repetição automática de uma mesma requisição (G09). Não exige prova CSRF: não usa sessão, e o pior
        efeito de uma requisição forjada é um clique a mais num sinal sem valor financeiro (C-08). Oferta não publicada
        → 404, sem contar. Quando `CAP-011` existir, o botão passa a levar ao checkout e esta operação deixa de
        ser chamada. Exige a asserção do `bff-student` com escopo `purchase-intent:write`; a escola é o `tenantId`
        da asserção.'
      operationId: registerPurchaseIntentInternal
      security:
      - StudentBffServiceAssertion: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Chave opaca por clique; repetição na janela de 24 horas não conta de novo.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '202':
          description: Clique contado; a compra ainda não está disponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseIntentAccepted'
              examples:
                emBreve:
                  value:
                    purchaseAvailability: coming-soon
        '404':
          $ref: '#/components/responses/OfferNotAvailable'
        '401':
          $ref: '#/components/responses/AssertionInvalid'
        '403':
          $ref: '#/components/responses/ScopeDenied'
  /offer-references/resolve:
    post:
      tags:
      - Auditoria
      summary: Resolver rótulos de ofertas para a consulta da trilha
      description: Para a consulta da trilha de CAP-030 (RF-10; mesmo papel de `resolveCourseReferencesInternal`
        em C-08 de CAP-005). Devolve, para cada oferta da escola do ator, o rótulo "título do curso — nome da opção"
        atual. Oferta desconhecida ou de outra escola é omitida, e o BFF mostra o alvo sem rótulo. Exige o papel
        administrador no claim `roles`; não exige `oferta.editar`. Leitura sem efeito colateral; POST para manter
        os identificadores fora da URL, como nas buscas de CAP-030.
      operationId: resolveOfferReferencesInternal
      security:
      - StaffUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveOfferReferencesRequest'
            examples:
              duas:
                value:
                  offerIds:
                  - 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
