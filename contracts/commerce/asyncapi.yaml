asyncapi: 3.0.0
info:
  title: Commerce — fatos do Catálogo e da Matrícula
  version: 1.1.0
  description: 'Contrato **vigente** consolidado. Fronteira: Aplicação `commerce`.


    Fonte da verdade do contrato desta fronteira. Mudanças entram por PR neste arquivo, promovidas a partir do recorte
    do PRD (ver `contracts/README.md`). Os documentos de origem, arquivados, são só histórico:


    - `tasks/archive/prd-vitrine-oferta/asyncapi-contract.yaml` 1.0.0

    - `tasks/archive/prd-concessao-acesso/asyncapi-contract.yaml` 1.1.0


    **Notas de prd-vitrine-oferta (1.0.0):** Recorte do primeiro PRD de CAP-003, `tasks/archive/prd-vitrine-oferta/prd.md`
    v1.0, aprovado em 2026-09-30. Aplicação `commerce`, módulo Catálogo (dono de Catálogo e Oferta). Recebe `conteudo.versao-publicada.v1`
    1.1.0 para manter a própria visão dos cursos publicados (C-01, C-09 de CAP-005). Envia os fatos de oferta e
    os atos de oferta no envelope da Auditoria 1.3.0 (RN-O15). Nenhuma mensagem carrega nome, e-mail ou dado do
    visitante.


    **Notas de prd-concessao-acesso (1.1.0):** Recorte do primeiro PRD de CAP-008, `tasks/archive/prd-concessao-acesso/prd.md`
    v1.0, aprovado em 2026-10-01. Aplicação `commerce`, módulo Matrícula e Direito de Acesso (dono do direito de
    acesso), que evolui o contrato de `commerce` 1.0.0 (`tasks/archive/prd-vitrine-oferta/asyncapi-contract.yaml`,
    módulo Catálogo, sem mudança). Recebe `conteudo.versao-publicada.v1` 1.1.0 em **fila própria**, para manter
    a própria visão mínima dos cursos em que se pode conceder cortesia (C-01). Envia os fatos `matricula.acesso-concedido.v1`
    e `matricula.acesso-expirado.v1` e o ato de cortesia no envelope da Auditoria 1.4.0 (RN-D11). Nenhuma mensagem
    carrega e-mail, nome ou motivo: o aluno vai por referência (RN-21 de Identidade, G23).

    '
id: urn:code-4-coders:commerce
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: RabbitMQ do baseline; topologia física e credenciais são configuração de implantação.
    variables:
      host:
        default: localhost
channels:
  versaoPublicada:
    address: conteudo.versao-publicada.v1
    description: Fato de `learning` 1.1.0 (`tasks/archive/prd-nivel-prerequisito-curso/asyncapi-contract.yaml`).
      Matrícula consome com fila própria, distinta da do Catálogo.
    messages:
      versaoPublicada:
        $ref: ../learning/asyncapi.yaml#/components/messages/VersaoPublicada
  ofertaPublicada:
    address: catalogo.oferta-publicada.v1
    description: Uma oferta passou a estar à venda.
    messages:
      ofertaPublicada:
        $ref: '#/components/messages/OfertaPublicada'
  ofertaAlterada:
    address: catalogo.oferta-alterada.v1
    description: Preço ou vigência de uma oferta publicada mudou, para compras futuras (RN-O10).
    messages:
      ofertaAlterada:
        $ref: '#/components/messages/OfertaAlterada'
  ofertaDespublicada:
    address: catalogo.oferta-despublicada.v1
    description: A oferta deixou de estar à venda (RN-O12).
    messages:
      ofertaDespublicada:
        $ref: '#/components/messages/OfertaDespublicada'
  atoPraticado:
    address: auditoria.ato-praticado.v1
    description: Canal da Auditoria (RN-A14), contrato 1.4.0 em `asyncapi-contract-audit.yaml`; aqui `commerce`
      só produz.
    messages:
      atoPraticado:
        $ref: ../audit/asyncapi.yaml#/components/messages/AtoPraticado
  acessoConcedido:
    address: matricula.acesso-concedido.v1
    description: Uma concessão passou a valer, de qualquer origem.
    messages:
      acessoConcedido:
        $ref: '#/components/messages/AcessoConcedido'
  acessoExpirado:
    address: matricula.acesso-expirado.v1
    description: A vigência de uma concessão por período terminou. Informativo (RN-D06).
    messages:
      acessoExpirado:
        $ref: '#/components/messages/AcessoExpirado'
  pedidoCriado:
    address: vendas.pedido-criado.v1
    description: Um pedido nasceu, com a condição congelada.
    messages:
      pedidoCriado:
        $ref: '#/components/messages/PedidoCriado'
  compraConcluida:
    address: vendas.compra-concluida.v1
    description: Um pedido foi pago. É a ordem de concessão que Matrícula consome (domain doc de Matrícula §7).
    messages:
      compraConcluida:
        $ref: '#/components/messages/CompraConcluida'
  pagamentoConfirmado:
    address: cobranca.pagamento-confirmado.v1
    description: Fato de `billing` (`asyncapi-contract-billing.yaml`).
    messages:
      pagamentoConfirmado:
        $ref: ../billing/asyncapi.yaml#/components/messages/PagamentoConfirmado
operations:
  receberVersaoPublicada:
    action: receive
    summary: Atualizar a visão do Catálogo sobre o curso publicado.
    channel:
      $ref: '#/channels/versaoPublicada'
    messages:
    - $ref: '#/channels/versaoPublicada/messages/versaoPublicada'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Guarda, por curso e escola, o que a vitrine exibe e o que as regras exigem: título, descrição,
      nível, pré-requisito (com o título de publicação de cada recomendado) e a estrutura com títulos de módulos
      e aulas — sem `videoId`, que o Catálogo não usa. Aplica só a maior `versionNumber` por curso; fato com número
      menor ou igual ao já aplicado é confirmado sem efeito. Deduplica por `eventId`. Mensagem 1.0.0 sem os campos
      novos é aplicada como sem nível e sem pré-requisito. Falha transitória não confirma; esgotadas as entregas,
      segue para a fila de erro e pode ser reprocessada sem efeito duplicado. Se a versão nova não tiver nível,
      o curso sai da vitrine sem despublicar ofertas (DP-04). O consumidor precisa existir antes do reenvio de `learning`
      (C-01).'
  publicarOfertaPublicada:
    action: send
    summary: Comunicar que uma oferta passou a estar à venda.
    channel:
      $ref: '#/channels/ofertaPublicada'
    messages:
    - $ref: '#/channels/ofertaPublicada/messages/ofertaPublicada'
    description: 'Pelo outbox, na mesma transação da publicação e do ato (G06). Ao menos uma vez; consumidores deduplicam
      por `eventId`. Ordem não garantida: para a mesma oferta vale o maior `offerRevision`. Consumidores conhecidos:
      nenhum nesta entrega (Inteligência de Negócio, depois).'
  publicarOfertaAlterada:
    action: send
    summary: Comunicar mudança de preço ou vigência de oferta publicada.
    channel:
      $ref: '#/channels/ofertaAlterada'
    messages:
    - $ref: '#/channels/ofertaAlterada/messages/ofertaAlterada'
    description: Mesmas garantias de `publicarOfertaPublicada`. Só quando preço ou vigência de oferta **publicada**
      mudam; mudança só de nome não gera fato nem ato (DP-05).
  publicarOfertaDespublicada:
    action: send
    summary: Comunicar que a oferta saiu da vitrine.
    channel:
      $ref: '#/channels/ofertaDespublicada'
    messages:
    - $ref: '#/channels/ofertaDespublicada/messages/ofertaDespublicada'
    description: Mesmas garantias de `publicarOfertaPublicada`.
  publicarAtoDeOferta:
    action: send
    summary: Comunicar à Auditoria os atos de publicar, alterar e despublicar oferta.
    channel:
      $ref: '#/channels/atoPraticado'
    messages:
    - $ref: '#/channels/atoPraticado/messages/atoPraticado'
    description: 'Pelo outbox, na mesma transação do fato correspondente. Conteúdo fixo (C-09): `origem: catalogo`;
      `tipo` = `oferta-publicada`, `oferta-alterada` ou `oferta-despublicada`; `autor` = conta interna do financeiro
      (`sub`); `alvo` = `{tipo: oferta, id: offerId}`; `complemento.curso` = `courseId`; em `oferta-alterada`, `precoAnterior`/`precoNovo`
      e/ou `vigenciaAnterior`/`vigenciaNova` do que mudou; `praticadoEm` = `occurredAt`; sem `motivo` (OD50). `fatoId`
      = `eventId` do fato de oferta. **Ordem de implantação:** `audit` 1.3.0 antes do primeiro ato, senão ele é
      gravado como não conforme.'
  receberVersaoPublicadaEmMatricula:
    action: receive
    summary: Atualizar a visão de Matrícula sobre os cursos em que se pode conceder cortesia.
    channel:
      $ref: '#/channels/versaoPublicada'
    messages:
    - $ref: '#/channels/versaoPublicada/messages/versaoPublicada'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Guarda, por curso e escola, **só** o necessário a Matrícula: identificador do curso, título da
      versão vigente e `versionNumber` — nada de estrutura, nível, descrição ou pré-requisito, que Matrícula não
      usa (C-01). Aplica só o maior `versionNumber` por curso; fato com número menor ou igual ao já aplicado é confirmado
      sem efeito. Deduplica por `eventId`. Falha transitória não confirma; esgotadas as entregas, segue para a fila
      de erro e pode ser reprocessada sem efeito duplicado. Curso que nunca recebeu o fato **não existe** para Matrícula
      (`COURSE_NOT_ELIGIBLE`, DP-05). **Carga inicial:** o reenvio de `learning` (C-01 de CAP-005) precisa acontecer
      **depois** deste consumidor existir; se já aconteceu antes, é repetido na implantação desta entrega — os demais
      consumidores já o ignoram por `versionNumber` e `eventId` (C-01 deste conjunto).'
  publicarAcessoConcedido:
    action: send
    summary: Comunicar que uma concessão passou a valer.
    channel:
      $ref: '#/channels/acessoConcedido'
    messages:
    - $ref: '#/channels/acessoConcedido/messages/acessoConcedido'
    description: 'Pelo outbox, na mesma transação da concessão e do ato (G06): **não existe cortesia gravada sem
      o fato**. Ao menos uma vez; consumidores deduplicam por `eventId`. Ordem não garantida entre concessões; para
      uma mesma concessão há um único fato. Publicado para toda origem (RN-D02); nesta entrega só `courtesy` ocorre.
      Consumidores conhecidos: nenhum nesta entrega (Notificação e Inteligência de Negócio, depois — DP-08).'
  publicarAcessoExpirado:
    action: send
    summary: Comunicar que a vigência de uma concessão terminou.
    channel:
      $ref: '#/channels/acessoExpirado'
    messages:
    - $ref: '#/channels/acessoExpirado/messages/acessoExpirado'
    description: 'Pelo outbox, **depois** do término e em até uma hora dele (DP-10). Exatamente um fato por concessão
      por período: uma rotina executada mais de uma vez não republica; consumidores ainda deduplicam por `eventId`.
      É **informativo**: a decisão de acesso nunca depende dele (RN-D06) e atraso ou perda não mudam a decisão.
      Refere-se à **concessão**, não ao acesso do aluno ao curso, que pode continuar por outra concessão. Concessão
      vitalícia nunca o gera.'
  publicarAtoDeCortesia:
    action: send
    summary: Comunicar à Auditoria o ato de conceder cortesia.
    channel:
      $ref: '#/channels/atoPraticado'
    messages:
    - $ref: '#/channels/atoPraticado/messages/atoPraticado'
    description: 'Pelo outbox, na mesma transação da concessão e do fato `acesso-concedido`. Conteúdo fixo (C-06):
      `origem: matricula`; `tipo: cortesia-concedida`; `autor` = conta interna do financeiro (`sub`); `alvo` = `{tipo:
      conta-aluno, id: studentId}`; `complemento.curso` = `courseId`, `complemento.concessao` = `grantId`, `complemento.vigencia`
      = `vitalicia` ou `{N}m`; **`motivo` obrigatório** (RN-D11); `praticadoEm` = `occurredAt`. `fatoId` = `eventId`
      do fato `acesso-concedido`. **Ordem de implantação:** `audit` 1.4.0 antes do primeiro ato, senão ele é gravado
      como não conforme (precedente de CAP-005 e CAP-003).'
  publicarPedidoCriado:
    action: send
    summary: Comunicar que um pedido nasceu.
    channel:
      $ref: '#/channels/pedidoCriado'
    messages:
    - $ref: '#/channels/pedidoCriado/messages/pedidoCriado'
    description: 'Pelo outbox, na mesma transação da criação (G06). Ao menos uma vez; consumidores deduplicam por
      `eventId`. Repetição idempotente da criação (mesma `Idempotency-Key`) e retorno do pedido pendente existente
      (RN-V06) não geram outro fato. Consumidores conhecidos: nenhum nesta entrega (Inteligência de Negócio, depois).'
  publicarCompraConcluida:
    action: send
    summary: Ordenar a concessão do pedido pago.
    channel:
      $ref: '#/channels/compraConcluida'
    messages:
    - $ref: '#/channels/compraConcluida/messages/compraConcluida'
    description: 'Pelo outbox, na mesma transação que marca o pedido `paid` e que registra o pedido de envio do
      comprovante (G06): **não existe pedido pago sem a ordem de concessão**. **Um único fato por pedido** (RN-V09):
      confirmações repetidas, ou confirmação de pedido já pago, não geram outro. Ao menos uma vez; consumidores
      deduplicam por `eventId` e, para o efeito, por `orderId`. Consumidor: Matrícula (`commerce`); depois, Fiscal
      (`CAP-016`) e Inteligência de Negócio.'
  receberPagamentoConfirmado:
    action: receive
    summary: Concluir o pedido pago.
    channel:
      $ref: '#/channels/pagamentoConfirmado'
    messages:
    - $ref: '#/channels/pagamentoConfirmado/messages/pagamentoConfirmado'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Pedido `awaiting-payment`, `expired` ou `cancelled` → `paid` (RN-V08), com `paidAt` = `confirmedAt`,
      meio, valor confirmado e referência do gateway; publica a compra concluída e o pedido de envio. Pedido já
      `paid` → confirmado sem efeito. Valor confirmado diferente do congelado **não impede** a conclusão: fica visível
      no detalhe do backoffice (`paidAmountCents`). Pedido desconhecido (de outra escola ou inexistente) → fila
      de erro e alerta: não há pedido a concluir, e não se inventa um.'
  receberCompraConcluidaEmMatricula:
    action: receive
    summary: Conceder o acesso comprado.
    channel:
      $ref: '#/channels/compraConcluida'
    messages:
    - $ref: '#/channels/compraConcluida/messages/compraConcluida'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Matrícula, em **fila própria**, cria a concessão `origin purchase`, `originRef` = `orderId`, com
      a vigência **da mensagem** (RN-D03 — nunca consulta o Catálogo), contada do momento da concessão (RN-D04),
      e publica `matricula.acesso-concedido.v1` na mesma transação. **A mesma origem não gera duas concessões**
      (RN-D10): mensagem repetida para o mesmo pedido é confirmada sem efeito, sem novo fato. Curso que Matrícula
      não conhece → fila de erro e alerta, sem conceder. Indisponibilidade de Matrícula não perde a ordem: a mensagem
      fica na fila e a concessão nasce quando ela voltar (RF-07, último critério).'
  receberAcessoConcedidoEmVendas:
    action: receive
    summary: Registrar no pedido que o acesso foi liberado.
    channel:
      $ref: '#/channels/acessoConcedido'
    messages:
    - $ref: '#/channels/acessoConcedido/messages/acessoConcedido'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    description: 'Vendas, em fila própria, só para `origin purchase`: preenche `grantId` e `accessGrantedAt` do
      pedido `originRef` (C-07). Outras origens → confirmado sem efeito. **Exibição**: nada decide acesso a partir
      disso (RN-V10).'
