  schemas:
    Cabecalho:
      type: object
      additionalProperties: false
      required:
      - correlationId
      properties:
        correlationId:
          type: string
          description: traceparent da requisição do backoffice, ou identificador da execução da rotina de expiração.
            Sem dado pessoal.
    Vigencia:
      description: Vigência da concessão (RN-D04). Mesmo formato de `AccessPeriod` nas interfaces HTTP e do fato
        de oferta.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - months
        properties:
          type:
            const: months
          months:
            type: integer
            minimum: 1
            maximum: 60
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: lifetime
    OfertaPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - offerId
      - courseId
      - offerRevision
      - occurredAt
      - name
      - priceCents
      - currency
      - accessPeriod
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por fato; chave de deduplicação. Também é o `fatoId` do ato correspondente.
        tenantId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
          description: Curso de Conteúdo e Currículo.
        offerRevision:
          type: integer
          minimum: 1
          description: Cresce a cada mudança da oferta; define o estado mais recente quando fatos chegam fora de
            ordem.
        occurredAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 60
        priceCents:
          type: integer
          minimum: 1
          maximum: 9999999
          description: Preço em centavos de real, estado após o fato.
        currency:
          const: BRL
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
    OfertaAlteradaPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - offerId
      - courseId
      - offerRevision
      - occurredAt
      - name
      - priceCents
      - currency
      - accessPeriod
      - previous
      properties:
        eventId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        offerRevision:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 60
        priceCents:
          type: integer
          minimum: 1
          maximum: 9999999
        currency:
          const: BRL
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
        previous:
          type: object
          additionalProperties: false
          required:
          - priceCents
          - accessPeriod
          description: Preço e vigência antes da mudança.
          properties:
            priceCents:
              type: integer
              minimum: 1
              maximum: 9999999
            accessPeriod:
              $ref: '#/components/schemas/Vigencia'
    OrigemDaConcessao:
      type: string
      enum:
      - courtesy
      - purchase
      - subscription
      - cohort
      description: Origem da concessão (RN-D02). Nesta entrega só `courtesy` ocorre; `purchase`, `subscription`
        e `cohort` nascem em `CAP-011`, `CAP-013`/`CAP-014` e `CAP-010`. Consumidores devem tolerar valor novo.
    AcessoConcedidoPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - grantId
      - studentId
      - courseId
      - origin
      - originRef
      - accessPeriod
      - grantedAt
      - endsOn
      - expiresAt
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por fato; chave de deduplicação. Também é o `fatoId` do ato de auditoria, quando a origem
            é cortesia.
        tenantId:
          type: string
          format: uuid
        grantId:
          type: string
          format: uuid
          description: Concessão em Matrícula e Direito de Acesso.
        studentId:
          type: string
          format: uuid
          description: Conta de aluno em Identidade e Acesso, por referência. Nunca e-mail nem nome.
        courseId:
          type: string
          format: uuid
          description: Curso de Conteúdo e Currículo. O direito é sobre o curso, não sobre uma versão (RN-D08).
        origin:
          $ref: '#/components/schemas/OrigemDaConcessao'
        originRef:
          type:
          - string
          - 'null'
          format: uuid
          description: Referência do fato de origem (RN-D02) — o pedido, quando a origem for compra. Nulo na cortesia,
            cuja origem é o ato (mesmo `eventId`).
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
        grantedAt:
          type: string
          format: date-time
          description: Momento da concessão, em UTC; é de onde a vigência conta (RN-D04).
        endsOn:
          type:
          - string
          - 'null'
          format: date
          description: Último dia de acesso no fuso da escola (DP-03). Nulo na vitalícia.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Instante, em UTC, em que o acesso deixa de valer (exclusivo). Nulo na vitalícia.
        occurredAt:
          type: string
          format: date-time
    AcessoExpiradoPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - grantId
      - studentId
      - courseId
      - origin
      - expiresAt
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por concessão; chave de deduplicação.
        tenantId:
          type: string
          format: uuid
        grantId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        origin:
          $ref: '#/components/schemas/OrigemDaConcessao'
        expiresAt:
          type: string
          format: date-time
          description: Instante em que a vigência terminou, o mesmo `expiresAt` do fato de concessão.
        occurredAt:
          type: string
          format: date-time
          description: Momento em que o fato foi emitido, até uma hora depois de `expiresAt` (DP-10).
    PedidoCriadoPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - orderId
      - orderNumber
      - studentId
      - courseId
      - offerId
      - priceCents
      - currency
      - accessPeriod
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por fato; chave de deduplicação.
        tenantId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          pattern: ^[0-9]{6,}$
        studentId:
          type: string
          format: uuid
          description: Conta de aluno, por referência. Nunca e-mail nem nome.
        courseId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        priceCents:
          type: integer
          minimum: 1
          description: Preço congelado, em centavos de real.
        currency:
          type: string
          const: BRL
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
        occurredAt:
          type: string
          format: date-time
    CompraConcluidaPayload:
      type: object
      additionalProperties: false
      required:
      - eventId
      - tenantId
      - orderId
      - orderNumber
      - studentId
      - courseId
      - offerId
      - priceCents
      - paidAmountCents
      - currency
      - accessPeriod
      - paymentMethod
      - paidAt
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por pedido; chave de deduplicação.
        tenantId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
          description: O pedido pago. É o `originRef` da concessão (RN-D02) e a chave que impede segunda concessão
            (RN-D10).
        orderNumber:
          type: string
          pattern: ^[0-9]{6,}$
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
          description: O direito é sobre o curso, não sobre uma versão (RN-D08).
        offerId:
          type: string
          format: uuid
          description: A oferta comprada, para rastreabilidade (RN-O11). Matrícula não a consulta.
        priceCents:
          type: integer
          minimum: 1
          description: Preço congelado no pedido.
        paidAmountCents:
          type: integer
          minimum: 1
          description: Valor confirmado pelo gateway.
        currency:
          type: string
          const: BRL
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
        paymentMethod:
          type: string
          enum:
          - card
          - pix
          - boleto
          description: Consumidores devem tolerar valor novo.
        paidAt:
          type: string
          format: date-time
          description: Momento da confirmação do pagamento. A vigência **não** conta daqui, e sim da concessão (RN-D04).
        occurredAt:
          type: string
          format: date-time
