name: code-for-coders

services:
  postgres:
    image: postgres:18
    container_name: code-for-coders-postgres
    environment:
      POSTGRES_DB: code_for_coders_identity
      POSTGRES_USER: code_for_coders_identity
      POSTGRES_PASSWORD: code-for-coders-local
    ports:
      - "5432:5432"
    volumes:
      - code-for-coders-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_for_coders_identity -d code_for_coders_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: code-for-coders-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: code_for_coders
      RABBITMQ_DEFAULT_PASS: code-for-coders-local
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - code-for-coders-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: code-for-coders-valkey
    ports:
      - "6379:6379"
    volumes:
      - code-for-coders-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.145.0
    container_name: code-for-coders-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  code-for-coders-postgres:
  code-for-coders-rabbitmq:
  code-for-coders-valkey:
