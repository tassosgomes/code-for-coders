openapi: 3.1.0
info:
  title: Learning — aula do aluno (interno)
  version: 1.1.0
  description: 'Recorte interno de `CAP-007`, `tasks/prd-reproducao-protegida/prd.md` v1.0. Acrescenta uma leitura
    ao contrato interno de `learning` (1.0.0, `tasks/prd-autoria-curso/internal-api-contract-learning.yaml`, autoria
    por ator interno). Consumidor único conhecido: `bff-student`. `learning` valida localmente o JWT de aluno com
    audiência `learning` (ADR-0003) e, **antes de devolver a estrutura**, consulta a decisão de acesso em `commerce`
    com a asserção de serviço de `learning` (escopo `access-decision:read`, ADR-0011; C-02). Nada do curso é devolvido
    a quem não pode acessá-lo.'
  contact:
    name: Time de Conteúdo e Currículo
servers:
- url: /internal/v1
  description: Rota privada de learning, inacessível ao navegador
tags:
- name: Aula
  description: A aula e a estrutura vigente do curso, para o aluno com direito
paths:
  /lessons/{lessonId}:
    get:
      tags:
      - Aula
      summary: Obter a aula e a lista de aulas do curso
      description: 'Devolve a aula pedida e o curso **na versão vigente**, para a tela da aula (RF-01, RF-06). Ordem
        das verificações: (1) a aula existe na versão vigente de um curso publicado da escola do aluno; (2) Matrícula
        responde que o aluno pode acessar o curso agora (`decideAccessInternal`, cache de até 30 s, falha fechada:
        BA07, G11). Nada do conteúdo é devolvido antes da decisão positiva (RN-R07). Todas as aulas estão abertas
        a quem tem direito; não há liberação progressiva (RN-R06, G20).'
      operationId: getStudentLessonInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: A aula e o curso na versão vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonScreen'
              examples:
                aula:
                  value:
                    lesson:
                      lessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
                      moduleId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                      title: Injeção de dependência na prática
                      position: 2
                    course:
                      courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                      title: APIs com .NET do zero ao deploy
                      versionNumber: 3
                      modules:
                      - moduleId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                        title: Fundamentos
                        position: 1
                        lessons:
                        - lessonId: 5c2e8f4d-7b60-4a13-9a13-3f6a1c527d84
                          title: Visão geral do curso
                          position: 1
                        - lessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
                          title: Injeção de dependência na prática
                          position: 2
                      - moduleId: d2e3f4a5-b6c7-4d8e-9fa0-1b2c3d4e5f60
                        title: Persistência
                        position: 2
                        lessons:
                        - lessonId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
                          title: Migrations com Entity Framework
                          position: 1
          headers:
            Cache-Control:
              description: '`private, no-store`.'
              schema:
                type: string
                examples:
                - private, no-store
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/LessonNotAvailable'
        '503':
          $ref: '#/components/responses/AccessDecisionUnavailable'
        '401':
          $ref: '#/components/responses/TokenInvalid'
components:
  securitySchemes:
    StudentUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 de aluno emitido por Identity em `validateStudentSessionInternal` com a audiência do
        serviço dono (ADR-0003), vida curta, claims `iss`, `aud`, `sub` (= `studentId`), `tenantId`, `sessionId`,
        `exp` e `jti`. Validado localmente pelo JWKS de Identity, sem consulta a Identity. A escola é sempre a do
        token (G07).
  parameters:
    LessonId:
      name: lessonId
      in: path
      required: true
      description: Identidade estável da aula (RN-C07). Opaca para quem a recebe.
      schema:
        type: string
        format: uuid
      examples:
        aula:
          value: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        reason:
          type: string
          enum:
          - no-grant
          - grant-ended
          description: 'Só em `ACCESS_DENIED`: `no-grant` (nunca teve acesso ao curso) ou `grant-ended` (já teve,
            nenhuma concessão está ativa). Clientes devem tolerar valor novo (`suspended` e `revoked` virão com
            `CAP-009`).'
        accessEndedAt:
          type: string
          format: date-time
          description: 'Só em `ACCESS_DENIED` com `reason: grant-ended`: término (exclusivo, UTC) da última concessão.
            O último dia de acesso é o dia anterior a este instante, no fuso da escola (DP-03 de `CAP-008`); é a
            data da mensagem "Seu acesso a este curso terminou em ...".'
    LessonOutline:
      type: object
      additionalProperties: false
      required:
      - lessonId
      - title
      - position
      properties:
        lessonId:
          type: string
          format: uuid
          description: Identidade estável entre versões (RN-C07).
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
    ModuleOutline:
      type: object
      additionalProperties: false
      required:
      - moduleId
      - title
      - position
      - lessons
      properties:
        moduleId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
        lessons:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LessonOutline'
    LessonScreen:
      type: object
      additionalProperties: false
      required:
      - lesson
      - course
      description: 'O necessário para desenhar a tela da aula: a aula pedida e o curso na **versão vigente**, com
        módulos e aulas na ordem do currículo (RF-06). Não leva `videoId`, estado de progresso nem liberação: todas
        as aulas estão abertas a quem tem direito (RN-R06).'
      properties:
        lesson:
          type: object
          additionalProperties: false
          required:
          - lessonId
          - moduleId
          - title
          - position
          properties:
            lessonId:
              type: string
              format: uuid
            moduleId:
              type: string
              format: uuid
            title:
              type: string
              minLength: 1
              maxLength: 200
            position:
              type: integer
              minimum: 1
        course:
          type: object
          additionalProperties: false
          required:
          - courseId
          - title
          - versionNumber
          - modules
          properties:
            courseId:
              type: string
              format: uuid
            title:
              type: string
              minLength: 1
              maxLength: 200
            versionNumber:
              type: integer
              minimum: 1
            modules:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ModuleOutline'
  responses:
    LessonNotAvailable:
      description: Aula inexistente, de outra escola, de curso não publicado ou removida da versão vigente. A resposta
        **não distingue** o motivo (RN-R07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Esta aula não está disponível.
                status: 404
                code: LESSON_NOT_AVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    AccessDecisionUnavailable:
      description: 'Matrícula não respondeu a tempo ou respondeu com erro. **Não é negação** (RN-R02, DP-08): nenhuma
        sessão abre nem se estende. O cliente oferece *Tentar de novo*.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Não foi possível confirmar seu acesso agora.
                status: 503
                code: ACCESS_DECISION_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    TokenInvalid:
      description: JWT de aluno ausente, inválido, de outra audiência ou expirado. Autenticação por JWT com a audiência
        do serviço dono (ADR-0003); nenhuma consulta a Identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tokenInvalido:
              value:
                type: about:blank
                title: Token do aluno ausente, inválido ou expirado.
                status: 401
                code: TOKEN_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    AccessDenied:
      description: Matrícula respondeu que o aluno não pode acessar o curso agora. `reason` distingue nunca ter
        tido de ter vencido; nada do conteúdo do curso é revelado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semAcesso:
              value:
                type: about:blank
                title: Você não tem acesso a este curso.
                status: 403
                code: ACCESS_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                reason: no-grant
            vencido:
              value:
                type: about:blank
                title: Seu acesso a este curso terminou.
                status: 403
                code: ACCESS_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                reason: grant-ended
                accessEndedAt: '2026-10-04T03:00:00Z'
