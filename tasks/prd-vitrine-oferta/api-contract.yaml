openapi: 3.1.0
info:
  title: BFF do backoffice — Catálogo (fichas e ofertas)
  version: 1.0.0
  description: >
    Recorte do primeiro PRD de CAP-003, `tasks/prd-vitrine-oferta/prd.md` v1.0, aprovado em 2026-09-30.
    Interface `admin-spa` → `bff-admin`, área **Catálogo**. Acrescenta operações novas ao BFF do
    backoffice, sem alterar as de CAP-002, CAP-005, CAP-006 e CAP-030. Toda operação exige
    `oferta.editar`, concedida ao financeiro (RF-01, OD47). O BFF recusa antes, e `commerce` recusa de
    novo com o JWT do ator (ADR-0005). Preço sempre em **centavos de real**, inteiro (C-05). Alterações
    de oferta: a última gravação vence, como na autoria (OD44 de CAP-005).
  contact:
    name: Time de Commerce
servers:
  - url: /api/v1
    description: URL pública versionada do BFF do backoffice
tags:
  - name: Catálogo
    description: Cursos no catálogo, fichas de vitrine e ofertas
paths:
  /catalog/courses:
    get:
      tags: [Catálogo]
      summary: Listar os cursos publicados no catálogo
      description: >
        Todos os cursos com versão vigente da escola do ator, com o nível da versão vigente e quantas
        ofertas cada um tem por estado (RF-02). Curso nunca publicado não aparece. Ordenados pelo título.
        `inShowcase` indica se o curso está na vitrine agora (ao menos uma oferta publicada e nível na
        versão vigente — DP-04).
      operationId: listCatalogCourses
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de cursos do catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseSummaryPage'
              examples:
                pagina:
                  value:
                    data:
                      - courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                        title: .NET do zero à API
                        level: advanced
                        inShowcase: true
                        offerCounts: {draft: 0, published: 2, unpublished: 1}
                      - courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                        title: Fundamentos de C#
                        level: null
                        inShowcase: false
                        offerCounts: {draft: 1, published: 0, unpublished: 0}
                    pagination: {page: 1, size: 10, total: 2, totalPages: 1}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
  /catalog/courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Catálogo]
      summary: Abrir a ficha do curso
      description: >
        Ficha de vitrine com os dados da versão vigente do curso, só para leitura — título, nível,
        pré-requisito (RN-O03) — a chamada comercial e todas as ofertas do curso, com a contagem de
        cliques em *Comprar* de cada uma (RF-09). Curso de outra escola ou nunca publicado → 404.
      operationId: getCatalogCourse
      security: [{StaffSessionCookie: []}]
      responses:
        '200':
          description: Ficha do curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseDetail'
              examples:
                ficha:
                  $ref: '#/components/examples/CatalogCourseWithOffers'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/CatalogCourseNotFound'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
    patch:
      tags: [Catálogo]
      summary: Alterar a chamada comercial da ficha
      description: >
        Único dado editável da ficha (RF-02). `null` remove a chamada; a vitrine passa a usar o início da
        descrição pedagógica. Não é ato auditado. Vale na vitrine imediatamente.
      operationId: updateCatalogCourse
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogCourseRequest'
            examples:
              chamada:
                value:
                  tagline: Da primeira linha de C# a uma API no ar.
      responses:
        '200':
          description: Ficha atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseDetail'
              examples:
                ficha:
                  $ref: '#/components/examples/CatalogCourseWithOffers'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/CatalogCourseNotFound'
        '422':
          $ref: '#/components/responses/InvalidOfferContent'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
  /catalog/courses/{courseId}/offers:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Catálogo]
      summary: Criar oferta em rascunho
      description: >
        Cria uma oferta em rascunho, invisível ao público (RF-03). Um curso pode ter várias (OD48). Pode
        ser criada mesmo que a versão vigente do curso não tenha nível; só a publicação exige (RN-O03).
      operationId: createOffer
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferInput'
            examples:
              dozeMeses:
                value:
                  name: Acesso por 12 meses
                  priceCents: 49700
                  accessPeriod: {type: months, months: 12}
              vitalicio:
                value:
                  name: Acesso vitalício
                  priceCents: 89700
                  accessPeriod: {type: lifetime}
      responses:
        '201':
          description: Oferta criada em rascunho.
          headers:
            Location:
              description: Endereço da oferta criada.
              schema:
                type: string
                examples:
                  - /api/v1/catalog/offers/7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                rascunho:
                  $ref: '#/components/examples/OfferDraft'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/CatalogCourseNotFound'
        '422':
          $ref: '#/components/responses/InvalidOfferContent'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
  /catalog/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    patch:
      tags: [Catálogo]
      summary: Alterar oferta
      description: >
        Altera nome, preço ou vigência, em rascunho ou publicada (RF-03, RF-05). Campo ausente não muda.
        Numa oferta **publicada**, mudança de preço ou de vigência vale só para compras futuras (RN-O10) e
        gera o ato `oferta-alterada` com os valores anterior e novo, e o fato `catalogo.oferta-alterada`;
        mudança só de nome não gera ato (DP-05). Oferta despublicada também pode ser alterada, sem ato,
        porque não está à venda.
      operationId: updateOffer
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
            examples:
              novoPreco:
                value:
                  priceCents: 39700
      responses:
        '200':
          description: Oferta alterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                publicada:
                  $ref: '#/components/examples/OfferPublished'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/InvalidOfferContent'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
    delete:
      tags: [Catálogo]
      summary: Excluir oferta em rascunho
      description: >
        Só oferta que nunca foi publicada (RN-O11). Oferta publicada ou despublicada → 422
        `OFFER_STATE_CONFLICT`.
      operationId: deleteOffer
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Oferta excluída.
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/OfferStateConflict'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
  /catalog/offers/{offerId}/publish:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags: [Catálogo]
      summary: Publicar oferta
      description: >
        Coloca uma oferta em rascunho ou despublicada à venda (RF-04). Exige que a versão vigente do curso
        declare nível (RN-O03) → senão 422 `COURSE_LEVEL_REQUIRED`. Oferta já publicada → 422
        `OFFER_STATE_CONFLICT`. Gera, na mesma transação, o fato `catalogo.oferta-publicada` e o ato
        `oferta-publicada`.
      operationId: publishOffer
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Oferta publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                publicada:
                  $ref: '#/components/examples/OfferPublished'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/PublishRejected'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
  /catalog/offers/{offerId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags: [Catálogo]
      summary: Despublicar oferta
      description: >
        Tira a oferta da vitrine e impede compra nova (RF-06, RN-O12); não afeta pedido nem concessão.
        Oferta que não está publicada → 422 `OFFER_STATE_CONFLICT`. Gera o fato
        `catalogo.oferta-despublicada` e o ato `oferta-despublicada`.
      operationId: unpublishOffer
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Oferta despublicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
              examples:
                despublicada:
                  $ref: '#/components/examples/OfferUnpublished'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/OfferNotFound'
        '422':
          $ref: '#/components/responses/OfferStateConflict'
        '502':
          $ref: '#/components/responses/CommerceUnavailable'
        '504':
          $ref: '#/components/responses/CommerceTimeout'
components:
  securitySchemes:
    StaffSessionCookie:
      type: apiKey
      in: cookie
      name: staff_session
      description: >
        Cookie opaco de sessão do backoffice (CAP-002, BA06). O BFF valida a sessão em Identity a cada
        ação (ADR-0005) e exige `oferta.editar`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Chave opaca única por intenção de escrita (G09). Repetição com o mesmo corpo devolve o mesmo
        resultado na janela de 24 horas; corpo diferente com a mesma chave → 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Prova CSRF vinculada à sessão, obtida de GET /staff-sessions/current (CAP-002).
      schema:
        type: string
        minLength: 1
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identificador do curso em Conteúdo e Currículo.
      schema:
        type: string
        format: uuid
    OfferId:
      name: offerId
      in: path
      required: true
      description: Identificador da oferta.
      schema:
        type: string
        format: uuid
    Page:
      name: _page
      in: query
      required: false
      description: Página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  schemas:
    CourseLevel:
      type: string
      enum: [beginner, intermediate, advanced]
      description: Nível do curso, vindo da versão vigente (RN-C18). Clientes devem tolerar valor novo.
    PriceCents:
      type: integer
      minimum: 1
      maximum: 9999999
      description: Preço em centavos de real (BRL), de R$ 0,01 a R$ 99.999,99 (DP-03). Sem parcelamento.
      examples:
        - 49700
    AccessPeriod:
      description: >
        Vigência prometida (RN-O08, OD51). `months`: acesso por N meses inteiros, contados da concessão
        (RN-D04). `lifetime`: sem término.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, months]
          properties:
            type:
              const: months
            months:
              type: integer
              minimum: 1
              maximum: 60
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              const: lifetime
    OfferName:
      type: string
      minLength: 1
      maxLength: 60
      description: Nome da opção exibido na vitrine (DP-03).
      examples:
        - Acesso por 12 meses
    OfferStatus:
      type: string
      enum: [draft, published, unpublished]
      description: >
        `draft` — nunca publicada; pode ser excluída. `published` — à venda. `unpublished` — já foi
        publicada, não está à venda e não pode ser excluída (RN-O11).
    OfferInput:
      type: object
      additionalProperties: false
      required: [name, priceCents, accessPeriod]
      properties:
        name:
          $ref: '#/components/schemas/OfferName'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
    UpdateOfferRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/OfferName'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
    UpdateCatalogCourseRequest:
      type: object
      additionalProperties: false
      required: [tagline]
      properties:
        tagline:
          $ref: '#/components/schemas/Tagline'
    Tagline:
      description: Chamada comercial, até 160 caracteres (RF-02, DP-03); `null` quando não há.
      oneOf:
        - type: string
          minLength: 1
          maxLength: 160
        - type: 'null'
    Offer:
      type: object
      additionalProperties: false
      required: [offerId, courseId, name, priceCents, accessPeriod, status, purchaseIntentCount, createdAt, updatedAt, publishedAt]
      properties:
        offerId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/OfferName'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        status:
          $ref: '#/components/schemas/OfferStatus'
        purchaseIntentCount:
          type: integer
          minimum: 0
          description: Cliques em *Comprar* desde a primeira publicação (RF-09). Anônimo.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
          description: Última publicação; `null` se nunca foi publicada.
    RecommendedCourse:
      type: object
      additionalProperties: false
      required: [courseId, title]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
    CatalogCourseSummary:
      type: object
      additionalProperties: false
      required: [courseId, title, level, inShowcase, offerCounts]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          description: Título da versão vigente.
        level:
          oneOf:
            - $ref: '#/components/schemas/CourseLevel'
            - type: 'null'
        inShowcase:
          type: boolean
        offerCounts:
          type: object
          additionalProperties: false
          required: [draft, published, unpublished]
          properties:
            draft: {type: integer, minimum: 0}
            published: {type: integer, minimum: 0}
            unpublished: {type: integer, minimum: 0}
    CatalogCourseSummaryPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCourseSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CatalogCourseDetail:
      type: object
      additionalProperties: false
      required: [courseId, title, level, prerequisite, tagline, inShowcase, offers]
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
        level:
          description: Nível da versão vigente; `null` bloqueia a publicação de oferta (RN-O03).
          oneOf:
            - $ref: '#/components/schemas/CourseLevel'
            - type: 'null'
        prerequisite:
          type: object
          additionalProperties: false
          required: [text, recommendedCourses]
          properties:
            text:
              type: [string, 'null']
            recommendedCourses:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RecommendedCourse'
        tagline:
          $ref: '#/components/schemas/Tagline'
        inShowcase:
          type: boolean
        offers:
          type: array
          maxItems: 50
          description: Todas as ofertas do curso, rascunhos primeiro, depois publicadas e despublicadas (C-06).
          items:
            $ref: '#/components/schemas/Offer'
    Pagination:
      type: object
      additionalProperties: false
      required: [page, size, total, totalPages]
      properties:
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
  responses:
    InvalidRequest:
      description: Requisição malformada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            malformada:
              value: {type: about:blank, title: Requisição inválida., status: 400, code: INVALID_REQUEST, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    SessionRequired:
      description: Sessão ausente, expirada ou revogada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            sessao:
              value: {type: about:blank, title: Sessão encerrada., status: 401, code: SESSION_REQUIRED, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    PermissionDenied:
      description: Sessão válida sem `oferta.editar`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            semPermissao:
              value: {type: about:blank, title: Sem permissão para o Catálogo., status: 403, code: PERMISSION_DENIED, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    PermissionOrCsrfDenied:
      description: Sem `oferta.editar` (`PERMISSION_DENIED`) ou prova CSRF ausente/inválida (`CSRF_INVALID`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            csrf:
              value: {type: about:blank, title: Prova CSRF inválida., status: 403, code: CSRF_INVALID, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    CatalogCourseNotFound:
      description: Curso inexistente, de outra escola ou sem versão vigente — indistintos (G07).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            naoEncontrado:
              value: {type: about:blank, title: Curso não encontrado no catálogo., status: 404, code: CATALOG_COURSE_NOT_FOUND, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    OfferNotFound:
      description: Oferta inexistente ou de outra escola — indistintas (G07).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            naoEncontrada:
              value: {type: about:blank, title: Oferta não encontrada., status: 404, code: OFFER_NOT_FOUND, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    InvalidOfferContent:
      description: >
        Conteúdo fora das regras: `FIELD_INVALID` (preço, vigência, nome ou chamada fora dos limites de
        DP-03, com o campo em `detail`) ou `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            preco:
              value: {type: about:blank, title: Campo inválido., status: 422, detail: 'priceCents deve estar entre 1 e 9999999.', code: FIELD_INVALID, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    OfferStateConflict:
      description: A ação não cabe no estado atual da oferta (RN-O11).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            estado:
