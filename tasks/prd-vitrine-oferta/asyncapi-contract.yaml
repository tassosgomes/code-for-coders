asyncapi: 3.0.0
id: urn:code-4-coders:commerce
info:
  title: Commerce — fatos do Catálogo e visão do curso publicado
  version: 1.0.0
  description: >-
    Recorte do primeiro PRD de CAP-003, `tasks/prd-vitrine-oferta/prd.md` v1.0, aprovado em 2026-09-30.
    Aplicação `commerce`, módulo Catálogo (dono de Catálogo e Oferta). Recebe `conteudo.versao-publicada.v1`
    1.1.0 para manter a própria visão dos cursos publicados (C-01, C-09 de CAP-005). Envia os fatos de oferta
    e os atos de oferta no envelope da Auditoria 1.3.0 (RN-O15). Nenhuma mensagem carrega nome, e-mail ou
    dado do visitante.
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: RabbitMQ do baseline; topologia física e credenciais são configuração de implantação.
    variables:
      host:
        default: localhost
channels:
  versaoPublicada:
    address: conteudo.versao-publicada.v1
    description: Fato de `learning` 1.1.0 (`tasks/prd-nivel-prerequisito-curso/asyncapi-contract.yaml`).
    messages:
      versaoPublicada:
        $ref: '../prd-nivel-prerequisito-curso/asyncapi-contract.yaml#/components/messages/VersaoPublicada'
  ofertaPublicada:
    address: catalogo.oferta-publicada.v1
    description: Uma oferta passou a estar à venda.
    messages:
      ofertaPublicada:
        $ref: '#/components/messages/OfertaPublicada'
  ofertaAlterada:
    address: catalogo.oferta-alterada.v1
    description: Preço ou vigência de uma oferta publicada mudou, para compras futuras (RN-O10).
    messages:
      ofertaAlterada:
        $ref: '#/components/messages/OfertaAlterada'
  ofertaDespublicada:
    address: catalogo.oferta-despublicada.v1
    description: A oferta deixou de estar à venda (RN-O12).
    messages:
      ofertaDespublicada:
        $ref: '#/components/messages/OfertaDespublicada'
  atoPraticado:
    address: auditoria.ato-praticado.v1
    description: Canal da Auditoria (RN-A14), contrato 1.3.0 em `asyncapi-contract-audit.yaml`; aqui `commerce` só produz.
    messages:
      atoPraticado:
        $ref: './asyncapi-contract-audit.yaml#/components/messages/AtoPraticado'
operations:
  receberVersaoPublicada:
    action: receive
    summary: Atualizar a visão do Catálogo sobre o curso publicado.
    channel:
      $ref: '#/channels/versaoPublicada'
    messages:
      - $ref: '#/channels/versaoPublicada/messages/versaoPublicada'
    bindings:
      amqp:
        ack: true
        bindingVersion: '0.3.0'
    description: >-
      Guarda, por curso e escola, o que a vitrine exibe e o que as regras exigem: título, descrição, nível,
      pré-requisito (com o título de publicação de cada recomendado) e a estrutura com títulos de módulos e
      aulas — sem `videoId`, que o Catálogo não usa. Aplica só a maior `versionNumber` por curso; fato com
      número menor ou igual ao já aplicado é confirmado sem efeito. Deduplica por `eventId`. Mensagem 1.0.0
      sem os campos novos é aplicada como sem nível e sem pré-requisito. Falha transitória não confirma; esgotadas
      as entregas, segue para a fila de erro e pode ser reprocessada sem efeito duplicado. Se a versão nova
      não tiver nível, o curso sai da vitrine sem despublicar ofertas (DP-04). O consumidor precisa existir
      antes do reenvio de `learning` (C-01).
  publicarOfertaPublicada:
    action: send
    summary: Comunicar que uma oferta passou a estar à venda.
    channel:
      $ref: '#/channels/ofertaPublicada'
    messages:
      - $ref: '#/channels/ofertaPublicada/messages/ofertaPublicada'
    description: >-
      Pelo outbox, na mesma transação da publicação e do ato (G06). Ao menos uma vez; consumidores
      deduplicam por `eventId`. Ordem não garantida: para a mesma oferta vale o maior `offerRevision`.
      Consumidores conhecidos: nenhum nesta entrega (Inteligência de Negócio, depois).
  publicarOfertaAlterada:
    action: send
    summary: Comunicar mudança de preço ou vigência de oferta publicada.
    channel:
      $ref: '#/channels/ofertaAlterada'
    messages:
      - $ref: '#/channels/ofertaAlterada/messages/ofertaAlterada'
    description: >-
      Mesmas garantias de `publicarOfertaPublicada`. Só quando preço ou vigência de oferta **publicada**
      mudam; mudança só de nome não gera fato nem ato (DP-05).
  publicarOfertaDespublicada:
    action: send
    summary: Comunicar que a oferta saiu da vitrine.
    channel:
      $ref: '#/channels/ofertaDespublicada'
    messages:
      - $ref: '#/channels/ofertaDespublicada/messages/ofertaDespublicada'
    description: Mesmas garantias de `publicarOfertaPublicada`.
  publicarAtoDeOferta:
    action: send
    summary: Comunicar à Auditoria os atos de publicar, alterar e despublicar oferta.
    channel:
      $ref: '#/channels/atoPraticado'
    messages:
      - $ref: '#/channels/atoPraticado/messages/atoPraticado'
    description: >-
      Pelo outbox, na mesma transação do fato correspondente. Conteúdo fixo (C-09): `origem: catalogo`;
      `tipo` = `oferta-publicada`, `oferta-alterada` ou `oferta-despublicada`; `autor` = conta interna do
      financeiro (`sub`); `alvo` = `{tipo: oferta, id: offerId}`; `complemento.curso` = `courseId`; em
      `oferta-alterada`, `precoAnterior`/`precoNovo` e/ou `vigenciaAnterior`/`vigenciaNova` do que mudou;
      `praticadoEm` = `occurredAt`; sem `motivo` (OD50). `fatoId` = `eventId` do fato de oferta. **Ordem de
      implantação:** `audit` 1.3.0 antes do primeiro ato, senão ele é gravado como não conforme.
components:
  messages:
    OfertaPublicada:
      name: OfertaPublicada
      title: Oferta publicada
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Cabecalho'
      payload:
        $ref: '#/components/schemas/OfertaPayload'
      examples:
        - name: dozeMeses
          headers:
            correlationId: 00-708192a3b4c5d6e7f8091a2b3c4d5e6f-708192a3b4c5d6e7-01
          payload:
            eventId: 3d4e5f60-7182-4a93-8ba4-b5c6d7e8f901
            tenantId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
            offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
            courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
            offerRevision: 2
            occurredAt: '2026-10-07T10:05:00Z'
            name: Acesso por 12 meses
            priceCents: 49700
            currency: BRL
            accessPeriod: {type: months, months: 12}
    OfertaAlterada:
      name: OfertaAlterada
      title: Oferta publicada alterada
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Cabecalho'
      payload:
        $ref: '#/components/schemas/OfertaAlteradaPayload'
      examples:
        - name: novoPreco
          headers:
            correlationId: 00-8192a3b4c5d6e7f8091a2b3c4d5e6f70-8192a3b4c5d6e7f8-01
          payload:
            eventId: 2c3d4e5f-6071-4a82-9b93-a4b5c6d7e8f9
            tenantId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
            offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
            courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
            offerRevision: 3
            occurredAt: '2026-10-08T11:30:00Z'
            name: Acesso por 12 meses
            priceCents: 39700
            currency: BRL
            accessPeriod: {type: months, months: 12}
            previous:
              priceCents: 49700
              accessPeriod: {type: months, months: 12}
    OfertaDespublicada:
      name: OfertaDespublicada
      title: Oferta despublicada
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Cabecalho'
      payload:
        $ref: '#/components/schemas/OfertaPayload'
      examples:
        - name: saiu
          headers:
            correlationId: 00-92a3b4c5d6e7f8091a2b3c4d5e6f7081-92a3b4c5d6e7f809-01
          payload:
            eventId: 4e5f6071-8293-4aa4-8bb5-c6d7e8f9a012
            tenantId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
            offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
            courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
            offerRevision: 4
            occurredAt: '2026-10-09T08:00:00Z'
            name: Acesso por 12 meses
            priceCents: 39700
            currency: BRL
            accessPeriod: {type: months, months: 12}
  schemas:
    Cabecalho:
      type: object
      additionalProperties: false
      required: [correlationId]
      properties:
        correlationId:
          type: string
          description: traceparent da requisição do backoffice. Sem dado pessoal.
    Vigencia:
      description: Vigência prometida (RN-O08, OD51). Mesmo formato de `AccessPeriod` nas interfaces HTTP.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, months]
          properties:
            type:
              const: months
            months:
              type: integer
              minimum: 1
              maximum: 60
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              const: lifetime
    OfertaPayload:
      type: object
      additionalProperties: false
      required: [eventId, tenantId, offerId, courseId, offerRevision, occurredAt, name, priceCents, currency, accessPeriod]
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por fato; chave de deduplicação. Também é o `fatoId` do ato correspondente.
        tenantId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
          description: Curso de Conteúdo e Currículo.
        offerRevision:
          type: integer
          minimum: 1
          description: Cresce a cada mudança da oferta; define o estado mais recente quando fatos chegam fora de ordem.
        occurredAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 60
        priceCents:
          type: integer
          minimum: 1
          maximum: 9999999
          description: Preço em centavos de real, estado após o fato.
        currency:
          const: BRL
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
    OfertaAlteradaPayload:
      type: object
      additionalProperties: false
      required: [eventId, tenantId, offerId, courseId, offerRevision, occurredAt, name, priceCents, currency, accessPeriod, previous]
      properties:
        eventId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        offerId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        offerRevision: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
        name: {type: string, minLength: 1, maxLength: 60}
        priceCents: {type: integer, minimum: 1, maximum: 9999999}
        currency: {const: BRL}
        accessPeriod:
          $ref: '#/components/schemas/Vigencia'
        previous:
          type: object
          additionalProperties: false
          required: [priceCents, accessPeriod]
          description: Preço e vigência antes da mudança.
          properties:
            priceCents: {type: integer, minimum: 1, maximum: 9999999}
            accessPeriod:
              $ref: '#/components/schemas/Vigencia'
