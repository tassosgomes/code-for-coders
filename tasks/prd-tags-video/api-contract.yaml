openapi: 3.1.0
info:
  title: BFF do backoffice — vídeos da escola
  version: 1.2.0
  description: |
    Recorte de `CAP-006` (terceira fatia), PRD `tasks/prd-tags-video/prd.md` v1.0, aprovado em 2026-10-11. Fronteira `admin-spa` → `bff-admin`. Contrato anterior: `contracts/bff-admin/openapi-midia.yaml` 1.1.1.

    Este recorte traz só as operações cujo comportamento muda (`createVideoUpload`, `completeVideoUpload`, `listVideos`, `getVideo`) e as novas (`replaceVideoTags`, `listVideoTags`). `Video` e `VideoUpload` ganham `tags`, sempre presente; por isso `listPendingVideoUploads`, `getVideoUpload` e `updateVideoTitle`, fora deste recorte, passam a devolver o campo sem outra mudança. `createVideoUploadPartUrls` não muda. Toda operação continua exigindo `midia.enviar`: o BFF recusa antes, e o serviço de mídia recusa de novo. As tags não entram nos fatos `midia.*` (RN-T01).
  contact:
    name: Time de Entrega de Mídia
servers:
  - url: /api/v1
    description: URL pública versionada do BFF do backoffice
tags:
  - name: Envio
    description: Envio em partes, agora com tags opcionais (RF-01)
  - name: Vídeos
    description: Biblioteca de vídeos da escola com tags e filtro por tag (RF-02 a RF-06)
paths:
  /video-uploads:
    post:
      tags:
        - Envio
      summary: Iniciar ou retomar o envio de um vídeo
      description: |
        Verifica formato e tamanho **antes** de qualquer byte ser transferido (RF-02). Se o mesmo ator já tem um envio pendente e não expirado com a mesma `fingerprint`, devolve esse envio (200), com as partes já recebidas, em vez de criar outro (RF-03). Fingerprint igual de outro ator não retoma nada: cada ator só vê os próprios envios pendentes.

        **Tags (prd-tags-video):** `tags` é opcional (RF-01). As tags são validadas e resolvidas para a grafia canônica da escola junto com formato e tamanho, antes de qualquer byte transferido, e ficam guardadas no envio. Na retomada (200) valem as tags do envio pendente, como o título: as do novo pedido são ignoradas, e o professor as ajusta depois com `replaceVideoTags` (C-05).
      operationId: createVideoUpload
      security:
        - StaffSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoUploadRequest'
            examples:
              aula:
                value:
                  title: Aula 3 — Injeção de dependência
                  fileName: aula-3-injecao-de-dependencia.mp4
                  fileSize: 3221225472
                  contentType: video/mp4
                  fingerprint: 6c1f0b9e2d7a4e53a1c8f4d2b9e07a31
                  tags:
                    - docker
                    - Módulo 2
      responses:
        '201':
          description: Envio novo criado.
          headers:
            Location:
              description: Endereço do envio criado.
              schema:
                type: string
                examples:
                  - /api/v1/video-uploads/3f6d2c1a-8b7e-4f90-a1b2-c3d4e5f60718
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUpload'
              examples:
                novo:
                  $ref: '#/components/examples/VideoUploadNew'
        '200':
          description: Envio pendente do mesmo ator com a mesma fingerprint — retomada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUpload'
              examples:
                retomada:
                  $ref: '#/components/examples/VideoUploadResumed'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '422':
          description: Arquivo acima de 5 GB, formato não aceito, título em branco, tag inválida, mais de 10 tags ou chave de idempotência reutilizada com outro corpo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                grandeDemais:
                  value:
                    type: about:blank
                    title: O arquivo passa do limite de 5 GB.
                    status: 422
                    code: FILE_TOO_LARGE
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                formato:
                  value:
                    type: about:blank
                    title: Formato não aceito. Envie MP4, MOV ou MKV.
                    status: 422
                    code: FORMAT_NOT_SUPPORTED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                semTitulo:
                  $ref: '#/components/examples/TitleRequired'
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
                tagInvalida:
                  $ref: '#/components/examples/TagInvalid'
                tagsDemais:
                  $ref: '#/components/examples/TagsLimitExceeded'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /video-uploads/{uploadId}/complete:
    post:
      tags:
        - Envio
      summary: Concluir o envio
      description: |
        O serviço de mídia confere no armazenamento que **todas** as partes chegaram, e só então cria o vídeo no estado `received`, com o ator como autor. A preparação começa sozinha (RF-04). Repetir a conclusão do mesmo envio devolve o mesmo vídeo, nunca um segundo (RF-02), mesmo com outra `Idempotency-Key`.

        **Tags (prd-tags-video):** o vídeo nasce com as tags do envio, resolvidas de novo para a grafia canônica vigente na escola no momento da conclusão (RF-01, RN-T02).
      operationId: completeVideoUpload
      security:
        - StaffSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Vídeo criado a partir do envio, ou o mesmo vídeo de uma conclusão anterior.
          headers:
            Location:
              description: Endereço do vídeo.
              schema:
                type: string
                examples:
                  - /api/v1/videos/0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                recebido:
                  $ref: '#/components/examples/VideoReceived'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '422':
          description: Ainda faltam partes, ou chave de idempotência reutilizada com outro envio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                incompleto:
                  value:
                    type: about:blank
                    title: Ainda faltam partes deste envio.
                    status: 422
                    code: UPLOAD_INCOMPLETE
                    detail: Faltam 38 de 48 partes.
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos:
    get:
      tags:
        - Vídeos
      summary: Listar os vídeos da escola
      description: |
        Todos os vídeos da escola do ator, de qualquer autor (DP-03), do mais recente ao mais antigo. Filtro por estado e busca por trecho do título, sem diferenciar maiúsculas nem acento. A tela consulta de novo enquanto houver vídeo em `received` ou `preparing` (DP-04). Serve também ao seletor de vídeo pronto da tela de aula (RF-08), com `status=ready`.

        **Tags (prd-tags-video):** cada vídeo traz `tags`. Filtro por `tag` (repetível) e `tagMatch` (`all` padrão, ou `any`), combinado com `status` e `q` (RF-04, RF-06). O seletor de vídeo da aula usa `status=ready` com os mesmos filtros (RF-05); nenhum vídeo fora de `ready` é oferecido a ele (RN-C04).
      operationId: listVideos
      security:
        - StaffSessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Estados a incluir; repetível. Ausente → todos.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/VideoStatus'
          examples:
            falhou:
              value:
                - failed
        - name: q
          in: query
          required: false
          description: Trecho do título.
          schema:
            type: string
            minLength: 1
            maxLength: 120
          examples:
            injecao:
              value: injeção
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/TagMatch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de vídeos; `data` vazio quando nenhum atende ao filtro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
              examples:
                variados:
                  value:
                    data:
                      - videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                        title: Aula 3 — Injeção de dependência
                        status: ready
                        uploadedBy:
                          accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
                          name: Marina Alves
                        uploadedAt: '2026-09-26T09:40:00Z'
                        durationSeconds: 2415
                        failureReason: null
                        tags:
                          - Docker
                          - Módulo 2
                      - videoId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                        title: Aula 4 — Testes de integração
                        status: failed
                        uploadedBy:
                          accountId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                          name: Rafael Costa
                        uploadedAt: '2026-09-26T08:05:00Z'
                        durationSeconds: null
                        failureReason: unreadable-file
                        tags: []
                    pagination:
                      page: 1
                      size: 10
                      total: 2
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}:
    get:
      tags:
        - Vídeos
      summary: Consultar um vídeo
      description: |
        Existência, estado, título e duração de um vídeo da escola do ator (RF-08). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente. Nunca devolve endereço, chave nem nome de arquivo guardado.

        **Tags (prd-tags-video):** inclui `tags`.
      operationId: getVideo
      security:
        - StaffSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Vídeo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                pronto:
                  $ref: '#/components/examples/VideoReady'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}/tags:
    put:
      tags:
        - Vídeos
      summary: Substituir as tags de um vídeo
      description: |
        Qualquer ator com `midia.enviar` troca o conjunto **inteiro** de tags de qualquer vídeo da escola, em qualquer estado (RF-02, RN-T04). `[]` remove todas. Não muda título, estado nem vínculos, e não publica fato `midia.*` (RN-T01).

        Concorrência: a última gravação prevalece por inteiro (C-03). A resposta traz o estado real do vídeo depois desta gravação. A tag que deixa de estar em todos os vídeos da escola some de `listVideoTags` e não casa mais com o filtro (RN-T05). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente (RN-T06).
      operationId: replaceVideoTags
      security:
        - StaffSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceVideoTagsRequest'
            examples:
              trocar:
                value:
                  tags:
                    - kubernetes
              removerTodas:
                value:
                  tags: []
      responses:
        '200':
          description: Tags substituídas; o vídeo no estado gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                trocadas:
                  $ref: '#/components/examples/VideoTagsReplaced'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '422':
          description: Tag vazia ou com mais de 30 caracteres, mais de 10 tags distintas, ou chave de idempotência reutilizada com outro corpo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tagInvalida:
                  $ref: '#/components/examples/TagInvalid'
                tagsDemais:
                  $ref: '#/components/examples/TagsLimitExceeded'
                chaveReutilizada:
                  $ref: '#/components/examples/IdempotencyKeyReused'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /video-tags:
    get:
      tags:
        - Vídeos
      summary: Sugerir tags da escola
      description: |
        Tags usadas em pelo menos um vídeo da escola do ator, em qualquer estado, que contêm o trecho `q` (RF-03, RN-T05, RN-T06). Serve à sugestão no envio e na edição e às opções do filtro na tela Vídeos e no seletor da aula. Sem paginação: teto fixo de 20 (C-04).
      operationId: listVideoTags
      security:
        - StaffSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TagQuery'
      responses:
        '200':
          description: Tags sugeridas; `data` vazio quando nenhuma contém `q`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTagList'
              examples:
                dock:
                  value:
                    data:
                      - Docker
                      - Docker Compose
                nenhuma:
                  value:
                    data: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
components:
  securitySchemes:
    StaffSessionCookie:
      type: apiKey
      in: cookie
      name: staff_session
      description: |
        Cookie opaco de sessão do backoffice (CAP-002, BA06). O BFF valida a sessão em Identity a cada ação (ADR-0005) e exige `midia.enviar` na permissão vigente.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave opaca única por intenção de escrita. Repetição com o mesmo corpo devolve o mesmo resultado na janela de 24 horas; corpo diferente com a mesma chave retorna 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Prova CSRF vinculada à sessão, obtida de GET /staff-sessions/current (CAP-002).
      schema:
        type: string
        minLength: 1
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Identificador opaco do envio.
      schema:
        type: string
        format: uuid
      examples:
        envio:
          value: 3f6d2c1a-8b7e-4f90-a1b2-c3d4e5f60718
    VideoId:
      name: videoId
      in: path
      required: true
      description: Identificador opaco do vídeo, o mesmo usado nos fatos `midia.*`.
      schema:
        type: string
        format: uuid
      examples:
        video:
          value: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
    Page:
      name: _page
      in: query
      required: false
      description: Página, iniciando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Tag:
      name: tag
      in: query
      required: false
      description: |
        Tags da escola a filtrar; repetível, até 10. Cada valor é comparado sem diferenciar maiúsculas, acentos nem espaços nas pontas e repetidos (RN-T02). Valor que não é tag da escola não casa com nenhum vídeo: com `tagMatch=all` o resultado fica vazio, com `any` ele é ignorado. Combina-se com `status` e `q` como "todos ao mesmo tempo" (RF-04, RF-05).
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          minLength: 1
          maxLength: 100
      examples:
        duasTags:
          value:
            - docker
            - módulo 2
    TagMatch:
      name: tagMatch
      in: query
      required: false
      description: |
        Combinação entre as tags de `tag` (RF-06): `all` traz o vídeo que tem todas; `any`, o que tem pelo menos uma. Ausente → `all`. Sem efeito com menos de duas tags.
      schema:
        $ref: '#/components/schemas/TagMatch'
      examples:
        qualquer:
          value: any
    TagQuery:
      name: q
      in: query
      required: false
      description: Trecho da tag, sem diferenciar maiúsculas nem acentos. Ausente → as primeiras tags da escola em ordem alfabética.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      examples:
        dock:
          value: dock
  responses:
    InvalidRequest:
      description: JSON malformado, campo obrigatório ausente ou valor fora do schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              value:
                type: about:blank
                title: JSON ou campos obrigatórios inválidos.
                status: 400
                code: INVALID_REQUEST
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    SessionRequired:
      description: Sessão ausente, expirada ou encerrada — inclusive por revogação de papel (RN-17).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semSessao:
              value:
                type: about:blank
                title: Sessão ausente, expirada ou encerrada.
                status: 401
                code: SESSION_REQUIRED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PermissionDenied:
      description: Sessão válida sem `midia.enviar`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              $ref: '#/components/examples/PermissionDenied'
    PermissionOrCsrfDenied:
      description: Sessão válida sem `midia.enviar`, ou prova CSRF ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              $ref: '#/components/examples/PermissionDenied'
            csrf:
              value:
                type: about:blank
                title: Prova CSRF ausente ou inválida.
                status: 403
                code: CSRF_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    UploadNotFound:
      description: Envio inexistente, de outro ator, expirado ou já concluído — resposta idêntica.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Envio não encontrado ou expirado.
                status: 404
                code: UPLOAD_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    VideoNotFound:
      description: Vídeo inexistente ou de outra escola — resposta idêntica.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Vídeo não encontrado.
                status: 404
                code: VIDEO_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    MediaUnavailable:
      description: Media indisponível ou falha de infraestrutura atrás do BFF, inclusive armazenamento indisponível (C-16). Nenhum detalhe interno é exposto; o cliente pode repetir com a mesma `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Serviço de vídeos indisponível no momento.
                status: 502
                code: MEDIA_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    MediaTimeout:
      description: Media não respondeu dentro do tempo limite do BFF (C-16). Mesmo tratamento de `MediaUnavailable`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tempoEsgotado:
              value:
                type: about:blank
                title: Serviço de vídeos indisponível no momento.
                status: 504
                code: MEDIA_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
  examples:
    PermissionDenied:
      value:
        type: about:blank
        title: Sem permissão para esta área.
        status: 403
        code: PERMISSION_DENIED
        traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    TitleRequired:
      value:
        type: about:blank
        title: O título é obrigatório.
        status: 422
        code: TITLE_REQUIRED
        traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    IdempotencyKeyReused:
      value:
        type: about:blank
        title: Chave de idempotência já usada com outro pedido.
        status: 422
        code: IDEMPOTENCY_KEY_REUSED
        traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    VideoUploadNew:
      value:
        uploadId: 3f6d2c1a-8b7e-4f90-a1b2-c3d4e5f60718
        title: Aula 3 — Injeção de dependência
