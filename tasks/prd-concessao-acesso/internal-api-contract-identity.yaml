openapi: 3.1.0
info:
  title: Identity — conta de aluno para cortesia
  version: 1.4.0
  description: >-
    Recorte do primeiro PRD de CAP-008, `tasks/prd-concessao-acesso/prd.md` v1.0, aprovado em 2026-10-01.
    Evolui Identity 1.3.0 com duas operações internas, ambas sobre a conta de **aluno** e ambas devolvendo só o
    mínimo (RN-16 de Identidade): (1) `bff-admin` localiza a conta pelo e-mail para o financeiro conferir o
    beneficiário (RF-02); (2) `commerce` reconfirma, no momento de conceder, que o beneficiário é conta de aluno
    ativa (RN-D09, C-03). Identity valida a asserção do chamador e, na localização, a sessão interna vigente e a
    permissão `cortesia.conceder`. O e-mail trafega no corpo, nunca em URL, log, métrica ou chave de cache
    (RN-21, G23). Conta de outro tenant, de ator interno e inexistente são indistintas (G07).
  contact:
    name: Time de Identidade e Acesso
servers:
  - url: /internal/v1
    description: Rota privada de Identity, inacessível ao navegador
tags:
  - name: StudentAccounts
    description: Conta de aluno como beneficiário de acesso
paths:
  /student-account-lookups:
    post:
      tags: [StudentAccounts]
      summary: Localizar a conta de aluno pelo e-mail
      description: >-
        Consulta de leitura para a tela de cortesia (RF-02). Exige asserção do `bff-admin` com escopo
        `student-account:lookup` e `X-Staff-Session` de ator com `cortesia.conceder` vigente: Identity valida a
        sessão (RN-17) e a permissão. O e-mail é normalizado como o da conta (RN-01). Conta de ator interno,
        inexistente e de outro tenant devolvem o mesmo 404 (`STUDENT_ACCOUNT_NOT_FOUND`). Conta desativada é
        encontrada, com `status: disabled` (RN-23). Devolve nome e e-mail, e nada mais da conta.
      operationId: lookupStudentAccountInternal
      security: [{BffAdminServiceAssertion: []}]
      parameters:
        - $ref: '#/components/parameters/StaffSession'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StudentAccountLookupInput'}
            examples:
              email:
                value:
                  email: joana.ribeiro@example.com
      responses:
        '200':
          description: Conta de aluno encontrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentAccount'}
              examples:
                ativa:
                  value:
                    studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                    email: joana.ribeiro@example.com
                    name: Joana Ribeiro
                    emailConfirmed: true
                    status: active
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/StudentAccountNotFound'}
  /student-account-confirmations:
    post:
      tags: [StudentAccounts]
      summary: Confirmar que o beneficiário é conta de aluno ativa
      description: >-
        Consulta de `commerce` no momento de conceder (RN-D09, C-03), para que Matrícula decida com a fonte
        única da identidade e não confie no BFF. Exige asserção de `commerce` com escopo
        `student-account:confirm`; não há sessão de ator, porque a autorização do ato já foi decidida em
        `commerce` pelo JWT do ator. Devolve `eligible: true` só para conta **de aluno**, **ativa** e do tenant
        da asserção. Qualquer outro caso — inexistente, de ator interno, desativada, de outro tenant — devolve
        `eligible: false`, sem dizer qual. **Falha fechada:** sem resposta, `commerce` não concede.
      operationId: confirmStudentAccountInternal
      security: [{CommerceServiceAssertion: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StudentAccountConfirmationInput'}
            examples:
              conta:
                value:
                  studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
      responses:
        '200':
          description: Resultado da confirmação.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentAccountConfirmation'}
              examples:
                elegivel:
                  value:
                    studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                    eligible: true
                inelegivel:
                  value:
                    studentId: 5e6f7081-92a3-4b4c-8d5e-6f708192a3b4
                    eligible: false
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    BffAdminServiceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Asserção curta e assimétrica exclusiva de `bff-admin` (ADR-0005). Identity verifica assinatura, kid,
        issuer, audience, tenant, scope e jti contra replay. Não é token do usuário; o ator vem da sessão
        validada por Identity. Escopo desta operação: `student-account:lookup`, novo no emissor `bff-admin`.
    CommerceServiceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Asserção curta e assimétrica exclusiva de `commerce`, no mecanismo da ADR-0004 e da ADR-0005 (Identity
        aceita mais de um emissor, cada um com chaves e escopos próprios). `commerce` ainda não é emissor em
        Identity: a extensão é registrada em ADR própria pela TechSpec (C-03), como a ADR-0009 fez para o
        `bff-student` em `commerce`. Escopo: `student-account:confirm`. Identity verifica assinatura, kid, issuer,
        audience, tenant, scope e jti contra replay.
  parameters:
    StaffSession:
      name: X-Staff-Session
      in: header
      required: true
      description: ID opaco da sessão interna; Identity valida vigência, tenant e a permissão `cortesia.conceder`.
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Pedido inválido; code VALIDATION_ERROR.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            invalido:
              value: {type: about:blank, title: Pedido inválido., status: 400, code: VALIDATION_ERROR, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    Unauthorized:
      description: Asserção inválida ou, na localização, sessão ausente/revogada; code SERVICE_UNAUTHORIZED ou SESSION_REQUIRED.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            servico:
              value: {type: about:blank, title: Serviço não autenticado., status: 401, code: SERVICE_UNAUTHORIZED, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    Forbidden:
      description: Asserção sem o escopo da operação ou, na localização, ator sem `cortesia.conceder`; code PERMISSION_DENIED.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            semPermissao:
              value: {type: about:blank, title: Sem permissão., status: 403, code: PERMISSION_DENIED, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    StudentAccountNotFound:
      description: Não há conta de aluno com esse e-mail — inexistente, de ator interno ou de outro tenant, indistintos (G07).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            naoEncontrada:
              value: {type: about:blank, title: Não há conta de aluno com este e-mail., status: 404, code: STUDENT_ACCOUNT_NOT_FOUND, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        traceId: {type: string}
    StudentAccountLookupInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail exato da conta de aluno.
          examples:
            - joana.ribeiro@example.com
    StudentAccount:
      type: object
      additionalProperties: false
      required: [studentId, email, name, emailConfirmed, status]
      properties:
        studentId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: E-mail normalizado da conta (minúsculas, sem espaços nas bordas).
        name:
          type: string
        emailConfirmed:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
          description: Clientes devem tolerar valor novo.
    StudentAccountConfirmationInput:
      type: object
      additionalProperties: false
      required: [studentId]
      properties:
        studentId:
          type: string
          format: uuid
    StudentAccountConfirmation:
      type: object
      additionalProperties: false
      required: [studentId, eligible]
      properties:
        studentId:
          type: string
          format: uuid
        eligible:
          type: boolean
          description: Verdadeiro só para conta de aluno ativa do tenant da asserção. Não distingue os motivos do falso.
