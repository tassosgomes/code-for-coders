openapi: 3.1.0
info:
  title: BFF do backoffice — Cortesias (cortesia)
  version: 1.0.0
  description: >
    Recorte do primeiro PRD de CAP-008, `tasks/prd-concessao-acesso/prd.md` v1.0, aprovado em 2026-10-01.
    Interface `admin-spa` → `bff-admin`, área **Cortesias**. Acrescenta operações novas ao BFF do backoffice,
    sem alterar as de CAP-002, CAP-003, CAP-005, CAP-006 e CAP-030. Toda operação exige `cortesia.conceder`,
    concedida ao financeiro (RF-01, DP-01). O BFF recusa antes, e `commerce` e `identity` recusam de novo
    (ADR-0005). O aluno é identificado pelo e-mail exato da conta (DP-02), enviado no **corpo**, nunca na URL
    (G23). Vigência na forma única `accessPeriod` (C-05 de CAP-003); o término é o fim do dia no fuso da escola
    (DP-03) e vem pronto na resposta, em `endsOn` e `expiresAt`. A decisão "pode acessar agora?" não é exposta ao
    navegador: é consulta entre serviços (`commerce` 1.2.0).
  contact:
    name: Time de Commerce
servers:
  - url: /api/v1
    description: URL pública versionada do BFF do backoffice
tags:
  - name: Cortesias
    description: Localizar aluno, ver concessões e conceder cortesia
paths:
  /student-account-lookups:
    post:
      tags: [Cortesias]
      summary: Localizar a conta de aluno pelo e-mail
      description: >
        Confirma que existe uma conta de **aluno** com o e-mail informado e devolve só o necessário para o
        financeiro conferir: e-mail, nome, se o e-mail foi confirmado e se a conta está ativa (RF-02). É POST
        para manter o e-mail fora da URL, de log e de chave de cache (RN-21, G23). Inexistente, conta de ator
        interno e conta de outra escola respondem **o mesmo** 404, sem distinguir (RF-02, G07). Conta
        desativada é encontrada, com `status: disabled`, e não pode receber cortesia.
      operationId: lookupStudentAccount
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentAccountLookupInput'
            examples:
              email:
                value:
                  email: Joana.Ribeiro@example.com
      responses:
        '200':
          description: Conta de aluno encontrada. O e-mail devolvido é o normalizado da conta (minúsculas, sem espaços nas bordas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccount'
              examples:
                ativa:
                  value:
                    studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                    email: joana.ribeiro@example.com
                    name: Joana Ribeiro
                    emailConfirmed: true
                    status: active
                naoConfirmada:
                  value:
                    studentId: 2b3c4d5e-6f70-4a81-9b92-a3b4c5d6e7f8
                    email: carlos.menezes@example.com
                    name: Carlos Menezes
                    emailConfirmed: false
                    status: active
                desativada:
                  value:
                    studentId: 5e6f7081-92a3-4b4c-8d5e-6f708192a3b4
                    email: paulo.andrade@example.com
                    name: Paulo Andrade
                    emailConfirmed: true
                    status: disabled
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/StudentAccountNotFound'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /courtesy-courses:
    get:
      tags: [Cortesias]
      summary: Listar os cursos em que se pode conceder cortesia
      description: >
        Cursos da escola do ator com versão vigente, ordenados pelo título (DP-05, RF-03). **Não depende de o
        curso ter oferta**: cortesia não tem pedido (RN-D11). Curso nunca publicado não aparece. `title`
        filtra por trecho do título, sem distinguir maiúsculas nem acentos.
      operationId: listCourtesyCourses
      security: [{StaffSessionCookie: []}]
      parameters:
        - name: title
          in: query
          required: false
          description: Trecho do título do curso.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          examples:
            trecho:
              value: dotnet
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de cursos concedíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtesyCoursePage'
              examples:
                pagina:
                  value:
                    data:
                      - courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                        title: .NET do zero à API
                      - courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                        title: Fundamentos de C#
                    pagination: {page: 1, size: 10, total: 2, totalPages: 1}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /courtesy-term-preview:
    get:
      tags: [Cortesias]
      summary: Calcular o término de uma vigência por período
      description: >
        Leitura **sem efeito**, para o passo "Vigência" e a revisão (RF-03): devolve o último dia de acesso e o
        instante em que o acesso deixa de valer **se a cortesia fosse concedida agora**, pela mesma regra da
        concessão (DP-03, RF-05). Nada é gravado e a tela não recalcula a regra. O resultado vale se a confirmação
        ocorrer no mesmo dia no fuso da escola; o término definitivo é o devolvido por `grantCourtesy`. Vigência
        vitalícia não tem término e não usa esta operação.
      operationId: previewCourtesyTerm
      security: [{StaffSessionCookie: []}]
      parameters:
        - name: months
          in: query
          required: true
          description: Duração em meses inteiros, de 1 a 60 (DP-04).
          schema:
            type: integer
            minimum: 1
            maximum: 60
          examples:
            seis:
              value: 6
      responses:
        '200':
          description: O término que a concessão teria agora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtesyTermPreview'
              examples:
                seisMeses:
                  value:
                    months: 6
                    computedAt: '2026-10-12T14:10:00Z'
                    endsOn: '2027-04-12'
                    expiresAt: '2027-04-13T03:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /students/{studentId}/access-grants:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Cortesias]
      summary: Listar as concessões de um aluno
      description: >
        Todas as concessões do aluno na escola do ator, de qualquer origem, da mais recente para a mais
        antiga (RF-02): curso, origem, vigência e situação. `status` é **calculado na leitura**, comparando o
        término com o momento atual (RN-D06): nenhuma rotina precisa ter rodado. Aluno sem concessão devolve
        página vazia, não 404. Aluno inexistente ou de outra escola também devolve página vazia (G07).
      operationId: listStudentAccessGrants
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de concessões do aluno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantPage'
              examples:
                umaAtivaUmaVencida:
                  value:
                    data:
                      - grantId: 4c5d6e7f-8091-4a2b-9c3d-4e5f6a7b8c9d
                        studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                        courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                        courseTitle: .NET do zero à API
                        origin: courtesy
                        status: active
                        accessPeriod: {type: months, months: 12}
                        grantedAt: '2026-10-12T14:10:00Z'
                        endsOn: '2027-10-12'
                        expiresAt: '2027-10-13T03:00:00Z'
                        reason: Bolsa do programa de mentoria, turma de outubro
                      - grantId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                        courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                        courseTitle: Fundamentos de C#
                        origin: courtesy
                        status: expired
                        accessPeriod: {type: months, months: 1}
                        grantedAt: '2026-08-31T09:00:00Z'
                        endsOn: '2026-09-30'
                        expiresAt: '2026-10-01T03:00:00Z'
                        reason: Compensação por indisponibilidade da plataforma
                    pagination: {page: 1, size: 10, total: 2, totalPages: 1}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /courtesy-grants:
    post:
      tags: [Cortesias]
      summary: Conceder cortesia
      description: >
        Concede a cortesia: acesso ao curso **sem pedido**, a partir do momento da confirmação, por 1 a 60
        meses ou vitalício, com motivo obrigatório (RF-03, RN-D11). Várias concessões convivem (RN-D07): já
        haver uma ativa **não** impede. Concessão, fato `matricula.acesso-concedido` e ato `cortesia-concedida`
        nascem na mesma transação ou não nascem. Reenvio com a mesma `Idempotency-Key` e o mesmo corpo não
        duplica: devolve a concessão original (200). O beneficiário é reconfirmado como conta de aluno ativa no
        momento da concessão (RN-D09, C-03): conta desativada ou deixada de ser de aluno entre a localização e
        a confirmação → 422 `STUDENT_ACCOUNT_NOT_ELIGIBLE`. **Não há operação para desfazer** nesta entrega
        (DP-07, `CAP-009`).
      operationId: grantCourtesy
      security: [{StaffSessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourtesyGrantInput'
            examples:
              seisMeses:
                value:
                  studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                  courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                  accessPeriod: {type: months, months: 6}
                  reason: Bolsa do programa de mentoria, turma de outubro
              vitalicia:
                value:
                  studentId: 2b3c4d5e-6f70-4a81-9b92-a3b4c5d6e7f8
                  courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                  accessPeriod: {type: lifetime}
                  reason: Parceria com a comunidade de desenvolvedores
      responses:
        '200':
          description: Reenvio da mesma solicitação (mesma `Idempotency-Key` e mesmo corpo); devolve a concessão já criada. Nada novo foi gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              examples:
                reenvio:
                  $ref: '#/components/examples/AccessGrantSixMonths'
        '201':
          description: Cortesia concedida.
          headers:
            Location:
              description: Endereço da concessão criada.
              schema:
                type: string
                examples:
                  - /api/v1/courtesy-grants/4c5d6e7f-8091-4a2b-9c3d-4e5f6a7b8c9d
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              examples:
                seisMeses:
                  $ref: '#/components/examples/AccessGrantSixMonths'
                vitalicia:
                  $ref: '#/components/examples/AccessGrantLifetime'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '422':
          $ref: '#/components/responses/GrantRejected'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /courtesy-grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/GrantId'
    get:
      tags: [Cortesias]
      summary: Ver uma cortesia concedida
      description: >
        Devolve a concessão de origem cortesia, na escola do ator. Concessão de outra origem, inexistente ou
        de outra escola respondem o mesmo 404 (G07).
      operationId: getCourtesyGrant
      security: [{StaffSessionCookie: []}]
      responses:
        '200':
          description: A concessão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              examples:
                seisMeses:
                  $ref: '#/components/examples/AccessGrantSixMonths'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/GrantNotFound'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
components:
  securitySchemes:
    StaffSessionCookie:
      type: apiKey
      in: cookie
      name: staff_session
      description: >
        Cookie opaco de sessão do backoffice (CAP-002, BA06). O BFF valida a sessão em Identity a cada ação
        (ADR-0005) e exige `cortesia.conceder`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Chave opaca única por intenção de escrita (G09). Repetição com o mesmo corpo devolve o mesmo
        resultado na janela de 24 horas; corpo diferente com a mesma chave → 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Prova CSRF vinculada à sessão, obtida de GET /staff-sessions/current (CAP-002).
      schema:
        type: string
        minLength: 1
    StudentId:
      name: studentId
      in: path
      required: true
      description: Identificador da conta de aluno em Identidade e Acesso.
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      description: Identificador da concessão.
      schema:
        type: string
        format: uuid
    Page:
      name: _page
      in: query
      required: false
      description: Página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  schemas:
    AccessPeriod:
      description: >
        Vigência da concessão, na forma única de `AccessPeriod` de CAP-003 (C-05): por período, em meses
        inteiros de 1 a 60 (DP-04), contados a partir do momento da concessão (RN-D04), ou vitalícia.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, months]
          properties:
            type:
              const: months
            months:
              type: integer
              minimum: 1
              maximum: 60
              examples:
                - 12
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              const: lifetime
    StudentAccountLookupInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail exato da conta de aluno. Normalizado como o da conta (RN-01 de Identidade).
          examples:
            - joana.ribeiro@example.com
    StudentAccount:
      type: object
      additionalProperties: false
      required: [studentId, email, name, emailConfirmed, status]
      description: O mínimo da conta para o financeiro conferir o beneficiário (RF-02, RN-16 de Identidade).
      properties:
        studentId:
          type: string
          format: uuid
          description: Identificador da conta de aluno; é o que a concessão referencia.
        email:
          type: string
          format: email
        name:
          type: string
        emailConfirmed:
          type: boolean
          description: Conta que ainda não confirmou o e-mail pode receber cortesia; só usará o acesso depois de confirmar e entrar.
        status:
          type: string
          enum: [active, disabled]
          description: Conta `disabled` não pode receber cortesia. Clientes devem tolerar valor novo.
    CourtesyCourse:
      type: object
      additionalProperties: false
      required: [courseId, title]
      properties:
        courseId:
          type: string
          format: uuid
          description: Identificador do curso em Conteúdo e Currículo.
        title:
          type: string
          description: Título da versão vigente.
    CourtesyGrantInput:
      type: object
      additionalProperties: false
      required: [studentId, courseId, accessPeriod, reason]
      properties:
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: >
            Motivo obrigatório (RN-D11, DP-04): de 1 a 500 caracteres, com ao menos um caractere que não seja
            espaço. Não deve conter dado pessoal de terceiros (RN-A08). Vai ao ato de auditoria e à concessão;
            nunca a log, métrica ou rastreamento.
          examples:
            - Bolsa do programa de mentoria, turma de outubro
    AccessGrant:
      type: object
      additionalProperties: false
      required: [grantId, studentId, courseId, courseTitle, origin, status, accessPeriod, grantedAt, endsOn, expiresAt, reason]
      description: Uma concessão de acesso de um aluno a um curso (Matrícula e Direito de Acesso).
      properties:
        grantId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
          description: Título atual do curso na visão de Matrícula. Só para exibição.
        origin:
          type: string
          enum: [courtesy, purchase, subscription, cohort]
          description: >
            Origem da concessão (RN-D02). Nesta entrega só `courtesy` é concedível; os demais valores nascem
            em `CAP-011`, `CAP-013`/`CAP-014` e `CAP-010`. Clientes devem tolerar valor novo.
        status:
          type: string
          enum: [active, expired]
          description: >
            Calculado na leitura (RN-D06): `expired` quando o momento atual é igual ou posterior a `expiresAt`.
            `suspended` e `revoked` virão com `CAP-009`; clientes devem tolerar valor novo.
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        grantedAt:
          type: string
          format: date-time
          description: Momento da concessão, em UTC. É de onde a vigência conta (RN-D04).
        endsOn:
          type:
            - string
            - 'null'
          format: date
          description: >
            Último dia de acesso, no fuso da escola (horário de Brasília na Fase 1, DP-03), para exibir
            "até DD/MM/AAAA". Nulo na vitalícia. Mês sem o dia → último dia do mês.
          examples:
            - '2027-10-12'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: >
            Instante, em UTC, em que o acesso **deixa** de valer (exclusivo): o início do dia seguinte a
            `endsOn` no fuso da escola. Há acesso se o momento da pergunta é anterior a ele. Nulo na vitalícia.
          examples:
            - '2027-10-13T03:00:00Z'
        reason:
          type:
            - string
            - 'null'
          description: Motivo informado ao conceder. Presente na cortesia; nulo em origens sem motivo.
    CourtesyTermPreview:
      type: object
      additionalProperties: false
      required: [months, computedAt, endsOn, expiresAt]
      description: Prévia do término de uma vigência por período, calculada pela regra da concessão e sem efeito (RF-03, DP-03).
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 60
        computedAt:
          type: string
          format: date-time
          description: Momento, em UTC, a partir do qual o servidor calculou. A concessão calcula de novo no seu momento.
        endsOn:
          type: string
          format: date
          description: Último dia de acesso, no fuso da escola.
        expiresAt:
          type: string
          format: date-time
          description: Instante, em UTC, em que o acesso deixa de valer (exclusivo).
    PaginationInfo:
      type: object
      additionalProperties: false
      required: [page, size, total, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    CourtesyCoursePage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourtesyCourse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    AccessGrantPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrant'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
  responses:
    InvalidRequest:
      description: Requisição malformada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            malformada:
              value: {type: about:blank, title: Requisição inválida., status: 400, code: INVALID_REQUEST, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    SessionRequired:
      description: Sessão ausente, expirada ou revogada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            sessao:
              value: {type: about:blank, title: Sessão encerrada., status: 401, code: SESSION_REQUIRED, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    PermissionDenied:
      description: Sessão válida sem `cortesia.conceder`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            semPermissao:
              value: {type: about:blank, title: Sem permissão para conceder acesso., status: 403, code: PERMISSION_DENIED, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    PermissionOrCsrfDenied:
      description: Sem `cortesia.conceder` (`PERMISSION_DENIED`) ou prova CSRF ausente/inválida (`CSRF_INVALID`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            csrf:
              value: {type: about:blank, title: Prova CSRF inválida., status: 403, code: CSRF_INVALID, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    StudentAccountNotFound:
      description: Não há conta de aluno com esse e-mail — inexistente, de ator interno ou de outra escola, indistintos (RF-02, G07).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            naoEncontrada:
              value: {type: about:blank, title: Não há conta de aluno com este e-mail., status: 404, code: STUDENT_ACCOUNT_NOT_FOUND, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    GrantNotFound:
      description: Cortesia inexistente, de outra origem ou de outra escola — indistintas (G07).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            naoEncontrada:
              value: {type: about:blank, title: Cortesia não encontrada., status: 404, code: GRANT_NOT_FOUND, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    GrantRejected:
      description: >
        Regra violada, nada concedido: `FIELD_INVALID` (motivo vazio ou acima de 500 caracteres, meses fora de
        1 a 60, com o campo em `detail`), `STUDENT_ACCOUNT_NOT_ELIGIBLE` (conta inexistente, de outra escola,
        deixou de ser de aluno ou está desativada — RN-D09), `COURSE_NOT_ELIGIBLE` (curso nunca publicado ou
        de outra escola — DP-05, RN-D17) ou `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            motivoVazio:
              value: {type: about:blank, title: Campo inválido., status: 422, detail: reason deve ter de 1 a 500 caracteres e não ser só espaços., code: FIELD_INVALID, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
            contaDesativada:
              value: {type: about:blank, title: A conta não pode receber acesso., status: 422, code: STUDENT_ACCOUNT_NOT_ELIGIBLE, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    UpstreamUnavailable:
      description: >
        `commerce` ou `identity` não respondeu ou falhou: `COMMERCE_UNAVAILABLE`, `IDENTITY_UNAVAILABLE` ou
        `STUDENT_ACCOUNT_CHECK_UNAVAILABLE` (`commerce` não conseguiu reconfirmar a conta em Identity; **falha
        fechada**, nada é concedido — C-03). Nada foi alterado de forma visível ao cliente.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            indisponivel:
              value: {type: about:blank, title: Cortesias temporariamente indisponíveis., status: 502, code: COMMERCE_UNAVAILABLE, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
    UpstreamTimeout:
      description: O serviço excedeu o tempo-limite. Uma escrita pode ter acontecido; repetir com a mesma `Idempotency-Key` é seguro.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            tempo:
              value: {type: about:blank, title: O serviço não respondeu a tempo., status: 504, code: UPSTREAM_TIMEOUT, traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01}
