openapi: 3.1.0
info:
  title: Learning — API interna, meus cursos e progresso do aluno
  version: 1.3.0
  description: |
    Recorte interno de `CAP-017`, `tasks/prd-progresso-aluno/prd.md` v1.0 de 2026-10-04. Evolui `contracts/learning/openapi-internal.yaml` 1.2.0 de forma aditiva com duas leituras do aluno; as operações de autoria (`CAP-005`) e `getStudentLessonInternal` (`CAP-007`) não mudam. Consumidor único conhecido: `bff-student`.

    `learning` valida localmente o JWT de aluno com audiência `learning` (ADR-0013). Aprendizagem e Progresso é dono do progresso; a lista de cursos vem de Matrícula por `listStudentCourseAccessInternal` (`commerce` 1.3.0, C-02), e o progresso do curso exige a decisão de acesso (`decideAccessInternal`, C-04). As duas chamadas a `commerce` usam a asserção de serviço de `learning` (ADR-0012). Derivado do recorte público (`api-contract.yaml` 1.1.0) pela transformação já usada em `CAP-007`: sem cookie, JWT de aluno, 401 `TOKEN_INVALID`, sem 502/504.
  contact:
    name: Time de Aprendizagem e Progresso
servers:
- url: /internal/v1
  description: Rota privada de learning, inacessível ao navegador
tags:
- name: Meus cursos
  description: Cursos do aluno com acesso vigente e encerrado, com o progresso de cada um
- name: Progresso
  description: Progresso do aluno no curso
paths:
  /student-courses:
    get:
      tags:
      - Meus cursos
      summary: Listar meus cursos
      description: 'Os cursos do aluno (`sub`) em duas listas (RF-04): `active` (Matrícula responde que há acesso
        agora) e `ended` (houve concessão e nenhuma vale agora). A lista vem **sempre de Matrícula**; progresso nunca
        põe curso na lista (RN-P08). Um curso aparece uma vez (RN-D07). `active` vem ordenada pelo avanço mais recente;
        os nunca começados por último, do acesso mais recente para o mais antigo. `ended` vem do término mais recente
        para o mais antigo. Se Matrícula não responde, 503 `COURSE_ACCESS_UNAVAILABLE` e **nunca** lista vazia (RF-04).
        Se só o progresso não está disponível, 200 com `progressAvailable: false`, `progress: null` e `continueLessonId`
        na primeira aula do curso. Composição: `learning` pede a Matrícula os cursos do aluno (`listStudentCourseAccessInternal`,
        C-02), sem guardar a resposta, e junta título e estrutura da versão vigente (Conteúdo) e o progresso (Aprendizagem).
        Curso da resposta sem versão vigente na escola é omitido.'
      operationId: listStudentCoursesInternal
      security:
      - StudentUserToken: []
      responses:
        '200':
          description: Os cursos do aluno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCourses'
              examples:
                comProgresso:
                  value:
                    progressAvailable: true
                    active:
                    - courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                      title: APIs com .NET do zero ao deploy
                      started: true
                      lastActivityAt: '2026-10-05T14:02:12Z'
                      continueLessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
                      progress:
                        completedLessons: 3
                        totalLessons: 8
                        percent: 37
                    - courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                      title: Fundamentos de C#
                      started: false
                      lastActivityAt: null
                      continueLessonId: 5c2e8f4d-7b60-4a13-9a13-3f6a1c527d84
                      progress:
                        completedLessons: 0
                        totalLessons: 12
                        percent: 0
                    ended:
                    - courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                      title: Testes automatizados em .NET
                      endedOn: '2028-03-15'
                      endedReason: grant-ended
                      progress:
                        completedLessons: 5
                        totalLessons: 10
                        percent: 50
                semCursos:
                  value:
                    progressAvailable: true
                    active: []
                    ended: []
                progressoIndisponivel:
                  value:
                    progressAvailable: false
                    active:
                    - courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                      title: APIs com .NET do zero ao deploy
                      started: null
                      lastActivityAt: null
                      continueLessonId: 5c2e8f4d-7b60-4a13-9a13-3f6a1c527d84
                      progress: null
                    ended: []
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '503':
          $ref: '#/components/responses/CourseAccessUnavailable'
  /student-courses/{courseId}/progress:
    get:
      tags:
      - Progresso
      summary: Obter meu progresso no curso
      description: 'O progresso do aluno (`sub`) no curso, sobre a **versão vigente** (RF-03, RF-05, RF-06): contagem
        e percentual, e, por aula com algum registro, se está concluída e de onde retomar. Aula sem registro não aparece
        em `lessons`: não está concluída e começa do início. Ordem das verificações, como em `getStudentLessonInternal`:
        (1) o curso tem versão vigente na escola do token (404 `COURSE_NOT_AVAILABLE`); (2) Matrícula responde que
        o aluno pode acessar o curso agora (`decideAccessInternal`, cache de até 30 s, falha fechada: 403/503, C-04).
        Nada do curso é devolvido a quem não pode acessá-lo. `resumeAtSeconds` aplica RN-P09 com a duração do vídeo
        que a aula usa na versão vigente, recebida de Media (`midia.ativo-pronto`, C-07); duração ainda desconhecida
        → `resumeAtSeconds` = `lastPositionSeconds`, salvo avanço de fim.'
      operationId: getStudentCourseProgressInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: O progresso no curso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgress'
              examples:
                emAndamento:
                  value:
                    courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                    versionNumber: 3
                    completedLessons: 3
                    totalLessons: 8
                    percent: 37
                    lessons:
                    - lessonId: 5c2e8f4d-7b60-4a13-9a13-3f6a1c527d84
                      completed: true
                      lastPositionSeconds: 598
                      resumeAtSeconds: 0
                    - lessonId: 3f6a1c52-7d84-4b0e-9a13-5c2e8f4d7b60
                      completed: false
                      lastPositionSeconds: 252
                      resumeAtSeconds: 252
                naoComecado:
                  value:
                    courseId: 3b4c5d6e-7f80-4a91-8b2c-4d5e6f7a8b9c
                    versionNumber: 1
                    completedLessons: 0
                    totalLessons: 12
                    percent: 0
                    lessons: []
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/CourseNotAvailable'
        '503':
          $ref: '#/components/responses/AccessDecisionUnavailable'
components:
  securitySchemes:
    StudentUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT RS256 de aluno emitido por Identity em `validateStudentSessionInternal` com audiência `learning`
        (ADR-0003, ADR-0013), vida curta, claims `iss`, `aud`, `sub` (= `studentId`), `tenantId`, `sessionId`, `scope`
        (`lessons:read`), `exp` e `jti`, sem `permissions` e sem `email`. Validado localmente pelo JWKS de Identity.
        O aluno é sempre `sub` e a escola sempre `tenantId` (G07); nenhuma rota aceita aluno por parâmetro.'
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identidade do curso em Conteúdo e Currículo.
      schema:
        type: string
        format: uuid
      examples:
        curso:
          value: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
  headers:
    NoStore:
      description: '`private, no-store`: dado pessoal do aluno, que muda a cada avanço.'
      schema:
        type: string
        examples:
        - private, no-store
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        reason:
          type: string
          enum:
          - no-grant
          - grant-ended
          description: Só em `ACCESS_DENIED`, como em `openapi-aula.yaml` 1.0.0. Clientes devem tolerar valor novo.
        accessEndedAt:
          type: string
          format: date-time
          description: 'Só em `ACCESS_DENIED` com `reason: grant-ended`, como em `openapi-aula.yaml` 1.0.0.'
    ProgressSummary:
      type: object
      additionalProperties: false
      required:
      - completedLessons
      - totalLessons
      - percent
      description: 'Contagem sobre a **versão vigente** (RN-P07): aulas concluídas da versão vigente, total de aulas
        da versão vigente e percentual inteiro arredondado para baixo, todas com o mesmo peso. 100 só quando todas
        estão concluídas. Aula removida numa republicação não conta em nenhum dos dois.'
      properties:
        completedLessons:
          type: integer
          minimum: 0
        totalLessons:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
    ActiveCourse:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      - started
      - lastActivityAt
      - continueLessonId
      - progress
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Título do curso na versão vigente.
        started:
          type:
          - boolean
          - 'null'
          description: '`true` se o aluno tem algum avanço no curso (ação **Continuar**); `false` se não (ação **Começar**).
            Nulo quando `progressAvailable` é `false`.'
        lastActivityAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Instante do avanço mais recente do aluno no curso. Nulo se não começou ou sem progresso disponível.
        continueLessonId:
          type: string
          format: uuid
          description: 'Aula que Continuar (ou Começar) abre, pela regra RN-P10 sobre a versão vigente. Sem progresso
            disponível, ou nunca começado, é a primeira aula do curso.'
        progress:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ProgressSummary'
          description: Nulo quando `progressAvailable` é `false`.
    EndedCourse:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      - endedOn
      - endedReason
      - progress
      description: Curso com acesso encerrado (DP-02). Sem ação de abrir aula.
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        endedOn:
          type: string
          format: date
          description: 'Último dia de acesso, no fuso da escola, para "Seu acesso terminou em dd/mm/aaaa". Com várias
            concessões encerradas, o da que terminou por último.'
        endedReason:
          type: string
          enum:
          - grant-ended
          description: '`grant-ended`: a vigência terminou. `revoked` virá com `CAP-009`; clientes devem tolerar valor
            novo e exibir a mesma frase com `endedOn` (QA-03 do PRD).'
        progress:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ProgressSummary'
          description: O progresso como estava, sobre a versão vigente. Nulo quando `progressAvailable` é `false`.
    MyCourses:
      type: object
      additionalProperties: false
      required:
      - progressAvailable
      - active
      - ended
      properties:
        progressAvailable:
          type: boolean
          description: '`false` quando a lista veio de Matrícula, mas o progresso não pôde ser lido: a tela mostra
            "Seu progresso não pôde ser carregado agora".'
        active:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ActiveCourse'
        ended:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/EndedCourse'
    LessonProgress:
      type: object
      additionalProperties: false
      required:
      - lessonId
      - completed
      - lastPositionSeconds
      - resumeAtSeconds
      properties:
        lessonId:
          type: string
          format: uuid
          description: Identidade estável da aula (RN-C07).
        completed:
          type: boolean
          description: Concluída por RN-P04; permanente (RN-P05).
        lastPositionSeconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Posição do avanço mais recente pelo instante do avanço, em qualquer aparelho (RN-P02).
        resumeAtSeconds:
          type: integer
          minimum: 0
          description: 'Onde o player começa (RN-P09): a última posição, ou 0 se o último avanço foi de fim, se está
            a menos de 10 s do fim do vídeo ou se passa da duração atual.'
    CourseProgress:
      type: object
      additionalProperties: false
      required:
      - courseId
      - versionNumber
      - completedLessons
      - totalLessons
      - percent
      - lessons
      properties:
        courseId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
          description: Versão vigente sobre a qual a contagem foi feita; a mesma de `getStudentLesson` quando lidas
            juntas.
        completedLessons:
          type: integer
          minimum: 0
        totalLessons:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
        lessons:
          type: array
          maxItems: 20000
          description: Só aulas da versão vigente com algum registro do aluno. Teto = 100 módulos × 200 aulas, o
            limite da estrutura em `openapi-aula.yaml`.
          items:
            $ref: '#/components/schemas/LessonProgress'
  responses:
    AccessDenied:
      description: Matrícula respondeu que o aluno não pode acessar o curso agora. Nada do curso é revelado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semAcesso:
              value:
                type: about:blank
                title: Você não tem acesso a este curso.
                status: 403
                code: ACCESS_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                reason: no-grant
    CourseNotAvailable:
      description: Curso inexistente, de outra escola ou sem versão vigente; indistintos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Este curso não está disponível.
                status: 404
                code: COURSE_NOT_AVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    AccessDecisionUnavailable:
      description: Matrícula não respondeu à decisão a tempo. Não é "sem acesso" (RN-R02).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Não foi possível confirmar seu acesso agora. Tente de novo em instantes.
                status: 503
                code: ACCESS_DECISION_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    CourseAccessUnavailable:
      description: Matrícula não respondeu com os cursos do aluno. A tela mostra indisponibilidade com Tentar de
        novo, **nunca** "Você ainda não tem cursos" (RF-04).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Não foi possível carregar seus cursos agora. Tente de novo em instantes.
                status: 503
                code: COURSE_ACCESS_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    TokenInvalid:
      description: JWT ausente, inválido, expirado, com audiência, emissor ou escopo errados, ou com `permissions`
        (token de ator).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              value:
                type: about:blank
                title: Token inválido.
                status: 401
                code: TOKEN_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
