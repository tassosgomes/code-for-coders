openapi: 3.1.0
info:
  title: BFF do backoffice — transcrição de vídeo, recorte de CAP-032
  version: 1.3.0
  description: |-
    Recorte de `CAP-032`, `tasks/prd-transcricao-legenda-aula/prd.md` v1.1, aprovado em 2026-10-12. Interface `admin-spa` → `bff-admin` na tela **Vídeos**: estado da transcrição por vídeo, **Transcrever**/**Refazer** e leitura somente leitura do texto (RF-02, RF-08).

    Evolui de forma **aditiva** `contracts/bff-admin/openapi-midia.yaml` (1.1.1 vigente; o recorte de tags de vídeo, `tasks/prd-tags-video/api-contract.yaml` 1.2.0, ainda não foi consolidado, e este recorte parte dele: 1.2.0 → 1.3.0). `listVideos` e `getVideo` mudam só o corpo (o vídeo ganha `transcription`); `requestVideoTranscription` e `getVideoTranscription` são novas. Envio, tags, título e vínculo à aula não mudam e não estão no recorte.

    Toda operação exige `midia.enviar`: o BFF recusa antes e `media` recusa de novo (baseline, Autorização). O BFF repassa 1:1 ao contrato interno (`internal-api-contract-media.yaml`), sem guardar nem registrar o texto (RN-M26). A escrita exige `X-CSRF-Token`.
  contact:
    name: Time de Entrega de Mídia
servers:
- url: /api/v1
  description: URL pública versionada do BFF do backoffice
tags:
- name: Vídeos
  description: Biblioteca de vídeos da escola; aqui, só o que a transcrição acrescenta
- name: Transcrição
  description: Pedir e ler a transcrição de um vídeo, pelo professor (RF-02, RF-08)
paths:
  /videos:
    get:
      tags:
      - Vídeos
      summary: Listar os vídeos da escola
      description: |
        Recorte de `listVideos` (contrato vigente): **muda só o corpo de cada vídeo**, que ganha `transcription`. Filtros, ordenação e paginação não mudam e não estão repetidos aqui.

        A tela consulta de novo enquanto houver vídeo com preparação (`received`, `preparing`) **ou** com `transcription.status: in-progress`, e para quando não houver (RF-02: a tela atualiza sozinha; sem endpoint de estado separado, T-03).
      operationId: listVideos
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de vídeos, cada um com o estado da transcrição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
              examples:
                variados:
                  value:
                    data:
                    - videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                      title: Aula 3 — Injeção de dependência
                      status: ready
                      uploadedBy:
                        accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
                        name: Marina Alves
                      uploadedAt: '2026-09-26T09:40:00Z'
                      durationSeconds: 2415
                      failureReason: null
                      tags:
                      - Docker
                      transcription:
                        status: in-progress
                        readable: false
                        readyAt: null
                        failureReason: null
                        canStart: false
                    - videoId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                      title: Aula 9 — Workshop gravado
                      status: ready
                      uploadedBy:
                        accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
                        name: Marina Alves
                      uploadedAt: '2026-09-26T09:40:00Z'
                      durationSeconds: 9000
                      failureReason: null
                      tags:
                      - Docker
                      transcription:
                        status: failed
                        readable: false
                        readyAt: null
                        failureReason: duration-limit
                        canStart: false
                    pagination:
                      page: 1
                      size: 10
                      total: 2
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}:
    get:
      tags:
      - Vídeos
      summary: Consultar um vídeo
      description: |
        Recorte de `getVideo` (contrato vigente): a resposta ganha `transcription`. Vídeo de outra escola responde o mesmo 404 de vídeo inexistente. As operações `updateVideoTitle` e `replaceVideoTags` também devolvem `Video` e passam a trazer `transcription`, sem outra mudança.
      operationId: getVideo
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Vídeo encontrado, com o estado da transcrição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                VideoWithoutTranscription:
                  $ref: '#/components/examples/VideoWithoutTranscription'
                VideoTranscriptionReady:
                  $ref: '#/components/examples/VideoTranscriptionReady'
                VideoRedoFailed:
                  $ref: '#/components/examples/VideoRedoFailed'
                VideoTooLong:
                  $ref: '#/components/examples/VideoTooLong'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}/transcription-requests:
    post:
      tags:
      - Transcrição
      summary: Pedir a transcrição de um vídeo (Transcrever ou Refazer)
      description: |
        Ação **Transcrever** (vídeo pronto sem transcrição) e **Refazer** (com transcrição pronta, ou cuja última tentativa falhou) da tela Vídeos (RF-02, RN-M20). Uma só operação: o serviço decide pelo estado. Qualquer ator com `midia.enviar` pede para qualquer vídeo da escola, de qualquer autor (RN-M03, RN-M04). Sem corpo.

        O pedido apenas **registra a intenção** e responde 202 com o vídeo em `transcription.status: in-progress`; o disparo ao serviço de transcrição acontece depois, de forma assíncrona. Indisponibilidade desse serviço **não** falha o pedido nem muda o estado do vídeo (RN-M19). Pedir enquanto já há uma tentativa em andamento não cria outra: devolve 202 com o estado real (RN-M20, sem erro). Refazer mantém a transcrição vigente visível ao aluno até a nova ficar pronta (RN-M18, RN-TL07).

        Recusas de regra: vídeo que não está `ready` → 409 `VIDEO_NOT_READY` (também para vídeo que falhou na preparação); última tentativa falhou por `duration-limit` ou `size-limit` → 409 `TRANSCRIPTION_NOT_RETRYABLE` (RN-M24). Vídeo de outra escola responde o mesmo 404 de vídeo inexistente (G07). Não publica fato `midia.*` (domínio de Mídia, §7).
      operationId: requestVideoTranscription
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Pedido aceito (ou já havia uma tentativa em andamento); o vídeo no estado real depois do
            pedido.
          headers:
            Location:
              description: Caminho do vídeo, `/videos/{videoId}`.
              schema:
                type: string
                examples:
                - /videos/0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              examples:
                transcrevendo:
                  $ref: '#/components/examples/VideoTranscribing'
                refazendo:
                  value:
                    videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                    title: Aula 3 — Injeção de dependência
                    status: ready
                    uploadedBy:
                      accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
                      name: Marina Alves
                    uploadedAt: '2026-09-26T09:40:00Z'
                    durationSeconds: 2415
                    failureReason: null
                    tags:
                    - Docker
                    transcription:
                      status: in-progress
                      readable: true
                      readyAt: '2026-10-14T10:12:00Z'
                      failureReason: null
                      canStart: false
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionOrCsrfDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: O vídeo não está pronto, ou a última tentativa falhou por um motivo que refazer não resolve.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronto:
                  value:
                    type: about:blank
                    title: Só vídeo pronto pode ser transcrito.
                    status: 409
                    code: VIDEO_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
                naoRefazivel:
                  value:
                    type: about:blank
                    title: Este vídeo ultrapassa o limite da transcrição.
                    status: 409
                    code: TRANSCRIPTION_NOT_RETRYABLE
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '422':
          description: Chave de idempotência reutilizada em outro vídeo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                chaveReutilizada:
                  value:
                    type: about:blank
                    title: Chave de idempotência já usada em outro pedido.
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /videos/{videoId}/transcription:
    get:
      tags:
      - Transcrição
      summary: Ler a transcrição vigente de um vídeo (professor)
      description: |
        Texto completo da transcrição **vigente**, em ordem, com o tempo de cada trecho, para o professor avaliar a qualidade (RF-08, RN-M27). Somente leitura. **Não é reprodução**: não abre Sessão de Reprodução, não consulta Matrícula e não traz marca d'água (RN-TL08). Exige `midia.enviar`; vídeo de outra escola responde o mesmo 404 de vídeo inexistente (G07).

        Só existe quando `transcription.readable` é `true`; senão 409 `TRANSCRIPTION_NOT_READY` e o professor vê o estado (RF-02). Com refeita em andamento, devolve a vigente. Resposta `Cache-Control: private, no-store`. O texto não aparece em log nem em URL (RN-M26).
      operationId: getVideoTranscription
      security:
      - StaffSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Transcrição vigente.
          headers:
            Cache-Control:
              description: '`private, no-store`: o texto da aula nunca fica em cache compartilhado nem do navegador
                (RN-M21, G21).'
              schema:
                type: string
                examples:
                - private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTranscriptionContent'
              examples:
                vigente:
                  value:
                    videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
                    revision: tr_7d2a91c4
                    language: pt-BR
                    durationMs: 2415000
                    readyAt: '2026-10-14T10:12:00Z'
                    segments:
                    - startMs: 1240
                      endMs: 4100
                      text: Hoje vamos ver o docker compose.
                    - startMs: 4100
                      endMs: 7900
                      text: Ele descreve vários containers em um só arquivo.
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: O vídeo não tem transcrição pronta (sem transcrição, transcrevendo pela primeira vez ou falhou
            sem vigente).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                naoPronta:
                  value:
                    type: about:blank
                    title: Este vídeo ainda não tem transcrição pronta.
                    status: 409
                    code: TRANSCRIPTION_NOT_READY
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '502':
          $ref: '#/components/responses/MediaUnavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
components:
  securitySchemes:
    StaffSessionCookie:
      type: apiKey
      in: cookie
      name: staff_session
      description: Cookie opaco de sessão do backoffice (CAP-002, BA06). O BFF valida a sessão em Identity a cada
        ação (ADR-0005) e exige `midia.enviar` na permissão vigente. Como no contrato vigente.
  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      description: Identificador opaco do vídeo, o mesmo usado nos fatos `midia.*`.
      schema:
        type: string
        format: uuid
      examples:
        videoId:
          value: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca única por intenção de escrita. Repetição na janela de 24 horas devolve o mesmo resultado;
        a mesma chave em outro vídeo retorna 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Prova CSRF vinculada à sessão, obtida de GET /staff-sessions/current (CAP-002).
      schema:
        type: string
        minLength: 1
    Page:
      name: _page
      in: query
      required: false
      description: Página, iniciando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  responses:
    InvalidRequest:
      description: JSON malformado, campo obrigatório ausente ou valor fora do schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              value:
                type: about:blank
                title: JSON ou campos obrigatórios inválidos.
                status: 400
                code: INVALID_REQUEST
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PermissionDenied:
      description: Token válido sem `midia.enviar`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              value:
                type: about:blank
                title: Sem permissão para esta área.
                status: 403
                code: PERMISSION_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    VideoNotFound:
      description: Vídeo inexistente ou de outra escola — resposta idêntica.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Vídeo não encontrado.
                status: 404
                code: VIDEO_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    SessionRequired:
      description: Sessão ausente, expirada ou encerrada — inclusive por revogação de papel (RN-17).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semSessao:
              value:
                type: about:blank
                title: Sessão ausente, expirada ou encerrada.
                status: 401
                code: SESSION_REQUIRED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PermissionOrCsrfDenied:
      description: Sessão válida sem `midia.enviar`, ou prova CSRF ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              value:
                type: about:blank
                title: Sem permissão para esta área.
                status: 403
                code: PERMISSION_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
            csrf:
              value:
                type: about:blank
                title: Prova CSRF ausente ou inválida.
                status: 403
                code: CSRF_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    MediaUnavailable:
      description: Media indisponível ou falha de infraestrutura atrás do BFF. Nenhum detalhe interno é exposto;
        o cliente pode repetir com a mesma `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Serviço de vídeos indisponível no momento.
                status: 502
                code: MEDIA_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    MediaTimeout:
      description: Media não respondeu dentro do tempo limite do BFF. Mesmo tratamento de `MediaUnavailable`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tempoEsgotado:
              value:
                type: about:blank
                title: Serviço de vídeos indisponível no momento.
                status: 504
                code: MEDIA_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
  examples:
    VideoWithoutTranscription:
      value:
        videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
        title: Aula 3 — Injeção de dependência
        status: ready
        uploadedBy:
          accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
          name: Marina Alves
        uploadedAt: '2026-09-26T09:40:00Z'
        durationSeconds: 2415
        failureReason: null
        tags:
        - Docker
        transcription:
          status: not-requested
          readable: false
          readyAt: null
          failureReason: null
          canStart: true
    VideoTranscribing:
      value:
        videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
        title: Aula 3 — Injeção de dependência
        status: ready
        uploadedBy:
          accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
          name: Marina Alves
        uploadedAt: '2026-09-26T09:40:00Z'
        durationSeconds: 2415
        failureReason: null
        tags:
        - Docker
        transcription:
          status: in-progress
          readable: false
          readyAt: null
          failureReason: null
          canStart: false
    VideoTranscriptionReady:
      value:
        videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
        title: Aula 3 — Injeção de dependência
        status: ready
        uploadedBy:
          accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
          name: Marina Alves
        uploadedAt: '2026-09-26T09:40:00Z'
        durationSeconds: 2415
        failureReason: null
        tags:
        - Docker
        transcription:
          status: ready
          readable: true
          readyAt: '2026-10-14T10:12:00Z'
          failureReason: null
          canStart: true
    VideoRedoFailed:
      value:
        videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
        title: Aula 3 — Injeção de dependência
        status: ready
        uploadedBy:
          accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
          name: Marina Alves
        uploadedAt: '2026-09-26T09:40:00Z'
        durationSeconds: 2415
        failureReason: null
        tags:
        - Docker
        transcription:
          status: failed
          readable: true
          readyAt: '2026-10-14T10:12:00Z'
          failureReason: service-unavailable
          canStart: true
    VideoTooLong:
      value:
        videoId: 0b1c2d3e-4f50-4a61-8b72-9c8d7e6f5a41
        title: Aula 9 — Workshop gravado
        status: ready
        uploadedBy:
          accountId: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
          name: Marina Alves
        uploadedAt: '2026-09-26T09:40:00Z'
        durationSeconds: 9000
        failureReason: null
        tags:
        - Docker
        transcription:
          status: failed
          readable: false
          readyAt: null
          failureReason: duration-limit
          canStart: false
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        reason:
          type: string
          enum:
          - no-grant
          - grant-ended
          description: 'Só em `ACCESS_DENIED`: `no-grant` (nunca teve acesso ao curso) ou `grant-ended` (já teve,
            nenhuma concessão está ativa). Clientes devem tolerar valor novo.'
        accessEndedAt:
          type: string
          format: date-time
          description: 'Só em `ACCESS_DENIED` com `reason: grant-ended`: término (exclusivo, UTC) da última concessão.'
    Video:
      type: object
      additionalProperties: false
      required:
      - videoId
      - title
      - status
      - uploadedBy
      - uploadedAt
      - durationSeconds
      - failureReason
      - tags
      - transcription
      description: 'Vídeo da escola. **Evolução aditiva** sobre o contrato vigente: acrescenta `transcription` (obrigatório
        na resposta). Os demais campos permanecem como em `contracts/`; aparecem aqui só para que o recorte seja
        válido.'
      properties:
        videoId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome do vídeo para reconhecê-lo no vínculo à aula.
        status:
          type: string
          enum:
          - received
          - preparing
          - ready
          - failed
          description: '`received` aguardando preparação; `preparing` em preparação; `ready` pronto; `failed` a
            preparação esgotou as tentativas. Só anda para frente (RN-M05). **A transcrição nunca altera este estado**
            (RN-M19).'
        uploadedBy:
          type: object
          additionalProperties: false
          required:
          - accountId
          - name
          properties:
            accountId:
              type: string
              format: uuid
            name:
              type: string
        uploadedAt:
          type: string
          format: date-time
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Duração em segundos; preenchida só em `ready`.
        failureReason:
          oneOf:
          - type: string
            enum:
            - unreadable-file
            - unsupported-format
            - duration-exceeded
            - preparation-failed
          - type: 'null'
          description: Motivo da falha **da preparação**; preenchido só em `failed`. Não confundir com `transcription.failureReason`.
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
          description: Tags do vídeo (contrato vigente, sem mudança neste PRD).
          examples:
          - - Docker
            - Módulo 2
        transcription:
          $ref: '#/components/schemas/VideoTranscription'
    VideoPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    TranscriptionStatus:
      type: string
      enum:
      - not-requested
      - in-progress
      - ready
      - failed
      description: 'Estado da **última tentativa** de transcrição do vídeo, na linguagem do professor (RN-TL06):
        `not-requested` sem transcrição; `in-progress` transcrevendo; `ready` pronta; `failed` falhou. Vídeo que
        não está `ready` (RN-M05) é sempre `not-requested`. Refazer mantém a transcrição vigente legível enquanto
        a nova roda (`status: in-progress`, `readable: true`) e depois que a nova falha (`status: failed`, `readable:
        true`): ver `readable` (RN-M18, RN-TL07).'
    TranscriptionFailureReason:
      type: string
      enum:
      - duration-limit
      - size-limit
      - service-unavailable
      - processing-failed
      - timed-out
      description: 'Categoria do motivo da falha, em termos do produto; nenhum código, estado ou limite do serviço
        de transcrição aparece aqui (camada anticorrupção). O SPA mostra o texto do PRD: `duration-limit` "vídeo
        mais longo que o limite de 2 horas"; `size-limit` "vídeo maior que o tamanho aceito para transcrição"; `service-unavailable`
        "serviço de transcrição indisponível no momento"; `processing-failed` "não foi possível transcrever este
        vídeo"; `timed-out` "a transcrição demorou mais que o limite". `duration-limit` e `size-limit` não se resolvem
        refazendo (RN-M24): `canStart` é `false`. Clientes devem tolerar valor novo.'
    VideoTranscription:
      type: object
      additionalProperties: false
      required:
      - status
      - readable
      - readyAt
      - failureReason
      - canStart
      description: 'Estado da transcrição do vídeo para a tela Vídeos (RF-02, RF-08). Sempre presente; para vídeo
        que não está pronto vale `not-requested`, `readable: false`, `canStart: false`.'
      properties:
        status:
          $ref: '#/components/schemas/TranscriptionStatus'
        readable:
          type: boolean
          description: Existe uma transcrição vigente pronta que o professor pode abrir em `getVideoTranscription`
            e que o aluno recebe (RN-M18, RN-M27). Pode ser `true` com `status` `in-progress` ou `failed` (refazer
            em andamento ou que falhou).
        readyAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Quando a transcrição **vigente** ficou pronta; `null` se não há vigente.
        failureReason:
          oneOf:
          - $ref: '#/components/schemas/TranscriptionFailureReason'
          - type: 'null'
          description: 'Preenchido só com `status: failed` (motivo da última tentativa).'
        canStart:
          type: boolean
          description: 'Se `requestVideoTranscription` seria aceita agora: vídeo `ready`, nenhuma tentativa em andamento
            e, se a última falhou, o motivo não é `duration-limit` nem `size-limit`. Dirige a ação **Transcrever**
            (`status: not-requested`) ou **Refazer** (`ready` ou `failed`) (RF-02).'
    TranscriptSegment:
      type: object
      additionalProperties: false
      required:
      - startMs
      - endMs
      - text
      description: 'Trecho: unidade da legenda, da busca e do clique que leva o vídeo ao tempo (domínio de Mídia).
        Tempos desde o início do vídeo.'
      properties:
        startMs:
          type: integer
          minimum: 0
          description: Início do trecho, em milissegundos.
          examples:
          - 1240
        endMs:
          type: integer
          minimum: 0
          description: Fim do trecho, em milissegundos; nunca antes de `startMs`.
          examples:
          - 4100
        text:
          type: string
          description: Texto da fala, em português do Brasil, como o serviço de transcrição o produziu (DP-07).
            Sem dado do aluno (RN-M22).
          examples:
          - Hoje vamos ver o docker compose.
    VideoTranscriptionContent:
      type: object
      additionalProperties: false
      required:
      - videoId
      - revision
      - language
      - durationMs
      - readyAt
      - segments
      description: 'Transcrição vigente de um vídeo, para leitura do professor no backoffice (RF-08, RN-M27). Somente
        leitura: não há operação de edição (DP-07).'
      properties:
        videoId:
          type: string
          format: uuid
        revision:
          type: string
          minLength: 1
          maxLength: 64
          description: Identificador opaco da transcrição vigente; muda quando uma refeita a substitui (DP-09).
            Igual para todos os alunos e sem dado pessoal (RN-M22). Serve para o cliente saber se o texto que tem
            ainda é o vigente.
          examples:
          - tr_7d2a91c4
        language:
          type: string
          const: pt-BR
          description: Idioma fixo neste corte (RN-M25).
        durationMs:
          type: integer
          minimum: 0
          description: Duração coberta pela transcrição, em milissegundos.
          examples:
          - 2415000
        readyAt:
          type: string
          format: date-time
          description: Quando esta transcrição ficou pronta.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptSegment'
          description: 'Trechos em ordem crescente de `startMs`. Resposta única, sem paginação: uma aula de 2 horas
            tem alguns milhares de trechos (a busca roda no cliente, RF-05). Limites exatos de tamanho: TechSpec.'
