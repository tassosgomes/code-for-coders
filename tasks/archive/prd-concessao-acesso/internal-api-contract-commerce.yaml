    GrantRejected:
      description: 'Regra violada, nada concedido: `FIELD_INVALID` (motivo vazio ou acima de 500 caracteres, meses fora de
        1 a 60, com o campo em `detail`), `STUDENT_ACCOUNT_NOT_ELIGIBLE` (conta inexistente, de outra escola, deixou de ser
        de aluno ou está desativada — RN-D09), `COURSE_NOT_ELIGIBLE` (curso nunca publicado ou de outra escola — DP-05, RN-D17)
        ou `IDEMPOTENCY_KEY_REUSED`.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            motivoVazio:
              value:
                type: about:blank
                title: Campo inválido.
                status: 422
