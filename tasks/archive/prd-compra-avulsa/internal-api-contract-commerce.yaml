        expiredAt: null
        cancelledAt: null
    OrderCancelled:
      summary: Aluno desistiu do boleto
      value:
        orderId: 2c3d4e5f-6071-4829-8b3c-4d5e6f7a8b92
        number: '000124'
        status: cancelled
        course:
          courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
          title: React na prática
        offer:
          offerId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          name: Acesso por 6 meses
        priceCents: 29700
        currency: BRL
        accessPeriod:
          type: months
          months: 6
        paymentMethod: boleto
        pendingPayment: null
        paymentPageExpiresAt: null
        accessGrantedAt: null
        createdAt: '2026-10-06T10:00:00Z'
        paidAt: null
        expiredAt: null
        cancelledAt: '2026-10-06T18:42:10Z'
  responses:
    InvalidRequest:
      description: Requisição malformada, parâmetro fora dos limites ou período invertido; code `INVALID_REQUEST`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformada:
              value:
                type: about:blank
                title: Requisição inválida.
                status: 400
                code: INVALID_REQUEST
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    TokenInvalid:
      description: JWT ausente, expirado, de audiência ou emissor errados, ou com assinatura inválida; code `TOKEN_INVALID`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            token:
              value:
                type: about:blank
                title: Token de acesso inválido.
                status: 401
                code: TOKEN_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    StudentScopeDenied:
      description: Token válido sem a política de aluno — sem `orders:use` ou com `permissions` (token de ator interno,
        RN-V01); code `SCOPE_DENIED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            atorInterno:
              value:
                type: about:blank
                title: Escopo insuficiente.
                status: 403
                code: SCOPE_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    FinancePermissionDenied:
      description: Token de ator sem `financeiro.ler`, ou token de aluno; code `PERMISSION_DENIED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semPermissao:
              value:
                type: about:blank
                title: Sem permissão para esta área.
                status: 403
                code: PERMISSION_DENIED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OfferNotAvailable:
      description: Oferta não publicada, inexistente ou de outra escola — indistintas; code `OFFER_NOT_AVAILABLE`.
        Nada é criado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Oferta não disponível.
                status: 404
                code: OFFER_NOT_AVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OrderNotFound:
      description: Pedido inexistente, de outro aluno ou de outra escola — indistintos; code `ORDER_NOT_FOUND`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              value:
                type: about:blank
                title: Pedido não encontrado.
                status: 404
                code: ORDER_NOT_FOUND
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    IdempotencyKeyReused:
      description: Mesma `Idempotency-Key` com corpo diferente; code `IDEMPOTENCY_KEY_REUSED`. Nada é criado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reuso:
              value:
                type: about:blank
                title: Chave de idempotência já usada com outro conteúdo.
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OrderNotPayable:
      description: Pedido `paid`, `expired` ou `cancelled`, ou prazo de pagamento vencido; code `ORDER_NOT_PAYABLE`,
        com a situação atual em `detail`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expirado:
              value:
                type: about:blank
                title: Este pedido não pode mais ser pago.
                status: 422
                detail: O prazo de pagamento venceu; o pedido está expirado.
                code: ORDER_NOT_PAYABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    OrderNotCancellable:
      description: Pedido `paid` ou `expired`; code `ORDER_NOT_CANCELLABLE`. Nada muda.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            pago:
              value:
                type: about:blank
                title: Este pedido não pode ser cancelado.
                status: 422
                code: ORDER_NOT_CANCELLABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    PaymentProviderUnavailable:
      description: '`billing` ou o gateway não responderam; nada mudou no pedido. code `PAYMENT_PROVIDER_UNAVAILABLE`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            indisponivel:
              value:
                type: about:blank
                title: Não foi possível abrir o pagamento agora.
                status: 503
                code: PAYMENT_PROVIDER_UNAVAILABLE
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    AssertionInvalid:
      description: Asserção de serviço ausente, inválida, repetida (`jti`) ou de outro emissor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            e:
              value:
                type: about:blank
                title: Credencial de serviço inválida.
                status: 401
                code: SERVICE_ASSERTION_INVALID
                traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
    ScopeDenied:
      description: Asserção sem o escopo da operação; code `SCOPE_DENIED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            escopo:
              value:
                type: about:blank
                title: Escopo insuficiente.
