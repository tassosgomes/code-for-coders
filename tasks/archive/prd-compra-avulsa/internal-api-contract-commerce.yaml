openapi: 3.1.0
info:
  title: Commerce — API interna (Vendas e Checkout)
  version: 1.4.0
  description: |
    Recorte interno de `CAP-011`, `tasks/prd-compra-avulsa/prd.md` v1.0, aprovado em 2026-10-05. Evolui `contracts/commerce/openapi-internal.yaml` 1.3.0 de forma **aditiva** com o módulo Vendas (pedido) e **deprecia** o clique anônimo de intenção de compra (DP-06). Catálogo, cortesias, decisão de acesso e cursos do aluno não mudam.

    Dois consumidores e dois esquemas de segurança:

    1. `bff-student`, com o **JWT de aluno** de audiência `commerce` (ADR-0013 estendida, C-03): resumo da compra, pedido, página de pagamento, desistência e *Meus pedidos*. O aluno é **sempre** o `sub` do token; nenhuma rota aceita identificador de aluno por parâmetro, corpo ou cabeçalho. Pedido de outro aluno é indistinguível de inexistente (404).
    2. `bff-admin`, com o JWT do ator de audiência `commerce` (ADR-0005) e `financeiro.ler`: consulta de pedidos, só leitura (RF-11, DP-09).

    O pedido **não** decide acesso (RN-V10): nenhuma resposta daqui é consultada por player, aula ou progresso. `accessGrantedAt` é informação de exibição, preenchida quando Vendas recebe `matricula.acesso-concedido.v1` da concessão daquele pedido (C-07).
  contact:
    name: Time de Commerce
servers:
- url: /internal/v1
  description: Rota privada de Commerce, inacessível ao navegador
tags:
- name: Compra
  description: Resumo da compra, pedido, pagamento e desistência, pelo BFF do aluno
- name: Meus pedidos
  description: Pedidos do próprio aluno
- name: Pedidos no backoffice
  description: Consulta de pedidos pelo financeiro
- name: Vitrine
  description: Leitura pública e intenção de compra, pelo BFF do aluno
paths:
  /offers/{offerId}/purchase-summary:
    parameters:
    - $ref: '#/components/parameters/OfferId'
    get:
      tags:
      - Compra
      summary: Resumir a compra de uma oferta
      description: |
        O que o aluno vê antes de ir ao pagamento (RF-01, RF-02): curso, opção, preço e vigência prometida **vigentes agora** — os que o pedido congelaria se fosse criado neste instante (RN-V03). Sem efeito.

        - `pendingOrderId`: pedido do aluno aguardando pagamento **nesta** oferta, se houver (RN-V06); o cliente leva a ele em vez de criar outro.
        - `existingAccess`: concessão ativa e dentro da vigência do aluno sobre o curso, de qualquer origem, a que termina por último (vitalícia prevalece). **Informativo** (RN-V11, DP-08): não bloqueia nem libera nada. Se Matrícula não responder, `existingAccessChecked: false` e `existingAccess: null`, e o resumo sai mesmo assim (RF-02, quarto critério).

        Oferta não publicada, inexistente ou de outra escola → 404 indistinto (RN-V02).
      operationId: getPurchaseSummaryInternal
      security:
      - StudentUserToken: []
      responses:
        '200':
          description: Resumo da compra.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSummary'
              examples:
                comCortesia:
                  value:
                    course:
                      courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                      title: .NET do zero à API
                    offer:
                      offerId: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
                      name: Acesso vitalício
                      priceCents: 89700
                      currency: BRL
                      accessPeriod:
                        type: lifetime
                    pendingOrderId: null
                    existingAccessChecked: true
                    existingAccess:
                      origin: courtesy
                      validity:
                        type: until
                        endsOn: '2026-11-30'
                semAcesso:
                  value:
                    course:
                      courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                      title: .NET do zero à API
                    offer:
                      offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                      name: Acesso por 12 meses
                      priceCents: 49700
                      currency: BRL
                      accessPeriod:
                        type: months
                        months: 12
                    pendingOrderId: null
                    existingAccessChecked: true
                    existingAccess: null
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/StudentScopeDenied'
        '404':
          $ref: '#/components/responses/OfferNotAvailable'
  /orders:
    post:
      tags:
      - Compra
      summary: Criar o pedido de uma oferta
      description: |
        Cria o pedido em `awaiting-payment` com curso, opção, preço e vigência da oferta **congelados neste instante** (RF-03, RN-V03, RN-V04). Só conta de aluno (RN-V01): token de ator interno não tem o escopo de aluno e é recusado com 403.

        - Já existe pedido do aluno aguardando pagamento **para a mesma oferta** → 200 com **esse** pedido, inalterado, sem criar outro (RN-V06). Pedido pendente de outra oferta do mesmo curso não impede (RF-03, quinto critério).
        - Oferta não publicada, inexistente ou de outra escola → 404, nada criado (RN-V02).
        - `Idempotency-Key` obrigatória (G09): repetição com o mesmo corpo devolve o mesmo resultado e o mesmo status; corpo diferente → 422 `IDEMPOTENCY_KEY_REUSED`.

        Publica `vendas.pedido-criado.v1` pelo outbox, na mesma transação (G06). Não abre pagamento: isso é `startOrderPaymentInternal`.
      operationId: createOrderInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
            examples:
              dozeMeses:
                value:
                  offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
      responses:
        '201':
          description: Pedido criado.
          headers:
            Location:
              description: Endereço do pedido criado.
              schema:
                type: string
                examples:
                - /internal/v1/orders/1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOrder'
              examples:
                criado:
                  $ref: '#/components/examples/OrderAwaitingNoMethod'
        '200':
          description: Já havia pedido do aluno aguardando pagamento nesta oferta; é ele que volta (RN-V06).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOrder'
              examples:
                pendente:
                  $ref: '#/components/examples/OrderAwaitingBoleto'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/StudentScopeDenied'
        '404':
          $ref: '#/components/responses/OfferNotAvailable'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      tags:
      - Meus pedidos
      summary: Listar os pedidos do aluno
      description: Pedidos do aluno do token, na escola do token, do mais recente para o mais antigo (RF-10). Mostram
        o que o pedido congelou, mesmo que a oferta tenha mudado ou saído da vitrine (RN-V03, RN-V12). Sem pedidos
        → lista vazia.
      operationId: listStudentOrdersInternal
      security:
      - StudentUserToken: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de pedidos do aluno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOrderPage'
              examples:
                tres:
                  value:
                    data:
                    - orderId: 2c3d4e5f-6071-4829-8b3c-4d5e6f7a8b92
                      number: '000124'
                      status: awaiting-payment
                      course:
                        courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                        title: React na prática
                      offer:
                        offerId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                        name: Acesso por 6 meses
                      priceCents: 29700
                      currency: BRL
                      accessPeriod:
                        type: months
                        months: 6
                      paymentMethod: boleto
                      pendingPayment:
                        method: boleto
                        expiresAt: '2026-10-09T02:59:59Z'
                      paymentPageExpiresAt: null
                      accessGrantedAt: null
                      createdAt: '2026-10-06T10:00:00Z'
                      paidAt: null
                      expiredAt: null
                      cancelledAt: null
                    - orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
                      number: '000123'
                      status: paid
                      course:
                        courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                        title: .NET do zero à API
                      offer:
                        offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                        name: Acesso por 12 meses
                      priceCents: 49700
                      currency: BRL
                      accessPeriod:
                        type: months
                        months: 12
                      paymentMethod: card
                      pendingPayment: null
                      paymentPageExpiresAt: null
                      accessGrantedAt: '2026-10-05T14:21:04Z'
                      createdAt: '2026-10-05T14:19:30Z'
                      paidAt: '2026-10-05T14:21:02Z'
                      expiredAt: null
                      cancelledAt: null
                    pagination:
                      page: 1
                      size: 10
                      total: 2
                      totalPages: 1
                vazio:
                  value:
                    data: []
                    pagination:
                      page: 1
                      size: 10
                      total: 0
                      totalPages: 0
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/StudentScopeDenied'
  /orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      tags:
      - Meus pedidos
      summary: Obter um pedido do aluno
      description: |
        A situação **real** do pedido, para a página de retorno e para a retomada (RF-05, RF-06, RN-CB04). O cliente consulta de novo até a situação mudar; a resposta não é guardada (`no-store`).

        - `paid` → pago; `accessGrantedAt` preenchido quando a concessão existe (RF-05: *Ir para o curso*).
        - `awaiting-payment` com `pendingPayment` → PIX ou boleto gerado, ainda não pago.
        - `awaiting-payment` sem `pendingPayment` → página de pagamento aberta (`paymentPageExpiresAt`) ou ainda não aberta (nulo). O cliente sabe se o aluno concluiu ou saiu pela própria volta da página; "Confirmando" é `awaiting-payment` sem `pendingPayment` depois de o aluno ter concluído.
        - `expired`, `cancelled` → terminais sem concessão, salvo confirmação tardia (RN-V08), que muda para `paid`.

        Pedido de outro aluno, de outra escola ou inexistente → 404 indistinto.
      operationId: getStudentOrderInternal
      security:
      - StudentUserToken: []
      responses:
        '200':
          description: O pedido.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOrder'
              examples:
                pago:
                  $ref: '#/components/examples/OrderPaid'
                boleto:
                  $ref: '#/components/examples/OrderAwaitingBoleto'
                semMeio:
                  $ref: '#/components/examples/OrderAwaitingNoMethod'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/StudentScopeDenied'
        '404':
          $ref: '#/components/responses/OrderNotFound'
  /orders/{orderId}/payment-session:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Compra
      summary: Ir para o pagamento do pedido
      description: |
        Devolve para onde levar o aluno (RF-04, RF-06): a página de pagamento ou, com PIX ou boleto já gerados, as instruções desse pagamento. `commerce` pede a `billing` (`ensurePaymentSessionInternal`) com o valor, a moeda e a descrição **congelados no pedido** e os endereços de volta da escola; repetir é seguro, porque `billing` é idempotente por pedido. Na primeira página aberta, o pedido passa a ter `paymentPageExpiresAt`.

        - Pedido `paid`, `expired` ou `cancelled` → 422 `ORDER_NOT_PAYABLE`, sem chamar `billing`.
        - `billing` responde que o prazo venceu → 422 `ORDER_NOT_PAYABLE`; o pedido expira pelo fato `cobranca.pagamento-nao-confirmado.v1`.
        - `billing` ou o gateway indisponível → 503 `PAYMENT_PROVIDER_UNAVAILABLE`; o pedido continua `awaiting-payment` e uma nova tentativa usa o mesmo pedido (RF-04, último critério).

        Sem corpo. `paymentUrl` é credencial de acesso ao pagamento: o BFF a entrega ao navegador do dono do pedido e não a guarda nem a registra.
      operationId: startOrderPaymentInternal
      security:
      - StudentUserToken: []
      responses:
        '200':
          description: Para onde levar o aluno.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentRedirect'
              examples:
                pagina:
                  value:
                    orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
                    kind: checkout
                    paymentUrl: https://checkout.stripe.com/c/pay/cs_test_a1B2c3D4e5F6g7H8
                    expiresAt: '2026-10-06T14:20:00Z'
                pix:
                  value:
                    orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
                    kind: pix-instructions
                    paymentUrl: https://payments.stripe.com/pix/instructions/test_YWNjdF8xUDJ
                    expiresAt: '2026-10-06T14:35:00Z'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/StudentScopeDenied'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/OrderNotPayable'
        '503':
          $ref: '#/components/responses/PaymentProviderUnavailable'
  /orders/{orderId}/cancellation:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Compra
      summary: Desistir de um pedido aguardando pagamento
      description: |
        Torna o pedido `cancelled` (RF-06, RN-V07). Publica `vendas.pedido-cancelado.v1` pelo outbox, na mesma transação; `billing` o recebe e cancela no gateway a página ou o pagamento pendente. Se, mesmo assim, o gateway confirmar o pagamento, o pedido vira `paid` e concede (RN-V08).

        - Pedido já `cancelled` → 200 com ele, sem novo fato (repetição segura).
        - Pedido `paid` ou `expired` → 422 `ORDER_NOT_CANCELLABLE`, nada muda.

        Depois de desistir, `createOrderInternal` na mesma oferta cria um pedido **novo**, pelas condições vigentes da oferta.
      operationId: cancelOrderInternal
      security:
      - StudentUserToken: []
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOrder'
              examples:
                cancelado:
                  $ref: '#/components/examples/OrderCancelled'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/StudentScopeDenied'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '422':
          $ref: '#/components/responses/OrderNotCancellable'
  /finance/orders:
    get:
      tags:
      - Pedidos no backoffice
      summary: Listar os pedidos da escola
      description: |
        Pedidos da escola do token, mais recentes primeiro (RF-11). Exige `financeiro.ler` (DP-09); só leitura. Filtros combináveis: `status`, `courseId`, `studentId` e período de **criação** do pedido (`createdFrom` e `createdTo`, datas inclusivas no fuso da escola). O aluno vai por referência (`studentId`): nome e e-mail são resolvidos pelo `bff-admin` em Identity, nunca guardados aqui.
      operationId: listFinanceOrdersInternal
      security:
      - StaffUserToken: []
      parameters:
      - name: status
        in: query
        required: false
        description: Situação do pedido. Ausente = todas.
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: courseId
        in: query
        required: false
        description: Curso do pedido.
        schema:
          type: string
          format: uuid
      - name: studentId
        in: query
        required: false
        description: Conta de aluno em Identidade e Acesso.
        schema:
          type: string
          format: uuid
      - name: createdFrom
        in: query
        required: false
        description: Primeiro dia do período, inclusivo, no fuso da escola.
        schema:
          type: string
          format: date
        examples:
          inicio:
            value: '2026-10-01'
      - name: createdTo
        in: query
        required: false
        description: Último dia do período, inclusivo, no fuso da escola. Anterior a `createdFrom` → 400.
        schema:
          type: string
          format: date
        examples:
          fim:
            value: '2026-10-31'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOrderPage'
              examples:
                pendentes:
                  value:
                    data:
                    - orderId: 2c3d4e5f-6071-4829-8b3c-4d5e6f7a8b92
                      number: '000124'
                      studentId: 2b3c4d5e-6f70-4a81-9b92-a3b4c5d6e7f8
                      status: awaiting-payment
                      courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
                      courseTitle: React na prática
                      offerName: Acesso por 6 meses
                      priceCents: 29700
                      currency: BRL
                      paymentMethod: boleto
                      createdAt: '2026-10-06T10:00:00Z'
                      paidAt: null
                    pagination:
                      page: 1
                      size: 10
                      total: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/FinancePermissionDenied'
  /finance/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      tags:
      - Pedidos no backoffice
      summary: Obter o detalhe de um pedido
      description: Tudo o que a lista mostra, mais a vigência congelada, os momentos de cada mudança, a referência
        do pagamento no gateway (para localizar no painel dele) e a concessão correspondente, quando existe (RF-11).
        Exige `financeiro.ler`. Pedido de outra escola ou inexistente → 404 indistinto.
      operationId: getFinanceOrderInternal
      security:
      - StaffUserToken: []
      responses:
        '200':
          description: O pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOrderDetail'
              examples:
                pago:
                  value:
                    orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
                    number: '000123'
                    studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                    status: paid
                    courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
                    courseTitle: .NET do zero à API
                    offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                    offerName: Acesso por 12 meses
                    priceCents: 49700
                    currency: BRL
                    accessPeriod:
                      type: months
                      months: 12
                    paymentMethod: card
                    paymentReference: pi_3Q2w3E4r5T6y7U8i0
                    paidAmountCents: 49700
                    grantId: 4c5d6e7f-8091-4a2b-9c3d-4e5f6a7b8c9d
                    accessGrantedAt: '2026-10-05T14:21:04Z'
                    createdAt: '2026-10-05T14:19:30Z'
                    paymentPageExpiresAt: '2026-10-06T14:19:41Z'
                    paidAt: '2026-10-05T14:21:02Z'
                    expiredAt: null
                    cancelledAt: null
        '401':
          $ref: '#/components/responses/TokenInvalid'
        '403':
          $ref: '#/components/responses/FinancePermissionDenied'
        '404':
          $ref: '#/components/responses/OrderNotFound'
  /showcase/offers/{offerId}/purchase-intents:
    parameters:
    - $ref: '#/components/parameters/OfferId'
    post:
      tags:
      - Vitrine
      summary: Registrar um clique em Comprar (depreciada)
      description: |
        **Depreciada em 1.4.0 (DP-06, C-08).** O botão *Comprar* passa a levar à compra (`getPurchaseSummaryInternal`, `createOrderInternal`), e esta operação **deixa de contar**: responde 202 com `purchaseAvailability: available` sem somar nada. A contagem histórica continua visível na oferta como estava (`purchaseIntentCount`, inalterado). Oferta não publicada → 404. Remoção em versão futura, quando nenhum cliente a chamar.
      operationId: registerPurchaseIntentInternal
      deprecated: true
      security:
      - StudentBffServiceAssertion: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Mantida por compatibilidade; sem efeito.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '202':
          description: Nada contado; a compra está disponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseIntentAccepted'
              examples:
                disponivel:
                  value:
                    purchaseAvailability: available
        '404':
          $ref: '#/components/responses/OfferNotAvailable'
        '401':
          $ref: '#/components/responses/AssertionInvalid'
        '403':
          $ref: '#/components/responses/ScopeDenied'
components:
  securitySchemes:
    StudentUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT RS256 de aluno emitido por Identity (`validateStudentSessionInternal` com `audience: commerce`),
        vida de 5 minutos, validado localmente pelo JWKS de Identity (ADR-0013, estendida a `commerce` por C-03;
        ADR própria na TechSpec). Política de aluno: `scope` igual a `orders:use` **e ausência da claim `permissions`**.
        Claims `iss`, `aud`, `sub` (= `studentId`), `tenantId`, `sessionId`, `scope`, `exp`, `jti`. **Sem `email`**:
        a claim só existe na audiência `media`.'
    StaffUserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT RS256 de ator interno emitido por Identity (`validateStaffSessionInternal` com `audience:
        commerce`), vida curta, claims iss, aud, sub, tenantId, sessionId, scope, roles, permissions, exp, jti.
        As operações de pedidos no backoffice exigem `financeiro.ler`.'
    StudentBffServiceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Asserção de serviço do `bff-student` (vigente em 1.3.0, sem mudança). Escopo `purchase-intent:write`
        na operação depreciada.'
  headers:
    NoStore:
      description: '`private, no-store`: a situação do pedido muda com o tempo e não é guardada pelo consumidor.'
      schema:
        type: string
        examples:
        - private, no-store
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave opaca única por intenção de escrita (G09). Repetição com o mesmo corpo devolve o mesmo resultado na janela de 24 horas; corpo diferente com a mesma chave → 422 `IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OfferId:
      name: offerId
      in: path
      required: true
      description: Identificador da oferta.
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identificador do pedido.
      schema:
        type: string
        format: uuid
    Page:
      name: _page
      in: query
      required: false
      description: Página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: _size
      in: query
      required: false
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        instance:
          type: string
    PriceCents:
      type: integer
      minimum: 1
      maximum: 9999999
      description: Valor em centavos de real (BRL), à vista.
      examples:
      - 49700
    Currency:
      type: string
      const: BRL
    AccessPeriod:
      description: Vigência prometida, na forma única de CAP-003 (C-05 daquele conjunto). Conta a partir da concessão,
        não da compra (RN-D04).
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - months
        properties:
          type:
            const: months
          months:
            type: integer
            minimum: 1
            maximum: 60
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: lifetime
    OrderStatus:
      type: string
      enum:
      - awaiting-payment
      - paid
      - expired
      - cancelled
      description: Situação do pedido (RN-V05). Só `paid` gera concessão. `paid` é terminal; `expired` e `cancelled`
        só mudam para `paid` por confirmação tardia (RN-V08). Clientes devem tolerar valor novo.
    PaymentMethod:
      type: string
      enum:
      - card
      - pix
      - boleto
      description: Meio de pagamento (RN-CB02, RN-CB05). Clientes devem tolerar valor novo.
    PendingPayment:
      type: object
      additionalProperties: false
      required:
      - method
      - expiresAt
      description: PIX ou boleto gerado e ainda não pago (RF-05, RF-06). As instruções em si (código, boleto) não
        ficam em `commerce` — vêm de `startOrderPaymentInternal`.
      properties:
        method:
          type: string
          enum:
          - pix
          - boleto
        expiresAt:
          type: string
          format: date-time
          description: Prazo do PIX (24 h) ou vencimento do boleto (3 dias corridos), RN-CB03.
    CourseRef:
      type: object
      additionalProperties: false
      required:
      - courseId
      - title
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          description: Título do curso. No pedido, o congelado na criação (RN-V03).
    OfferRef:
      type: object
      additionalProperties: false
      required:
      - offerId
      - name
      properties:
        offerId:
          type: string
          format: uuid
        name:
          type: string
          description: Nome da opção de compra. No pedido, o congelado na criação.
    SummaryOffer:
      type: object
      additionalProperties: false
      required:
      - offerId
      - name
      - priceCents
      - currency
      - accessPeriod
      properties:
        offerId:
          type: string
          format: uuid
        name:
          type: string
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        currency:
          $ref: '#/components/schemas/Currency'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
    ExistingAccess:
      type: object
      additionalProperties: false
      required:
      - origin
      - validity
      description: Concessão ativa e dentro da vigência do aluno sobre o curso; a que termina por último (RF-02).
      properties:
        origin:
          type: string
          enum:
          - courtesy
          - purchase
          - subscription
          - cohort
          description: Origem da concessão (RN-D02). Clientes devem tolerar valor novo.
        validity:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - type
            - endsOn
            properties:
              type:
                const: until
              endsOn:
                type: string
                format: date
                description: Último dia de acesso, no fuso da escola.
          - type: object
            additionalProperties: false
            required:
            - type
            properties:
              type:
                const: lifetime
    PurchaseSummary:
      type: object
      additionalProperties: false
      required:
      - course
      - offer
      - pendingOrderId
      - existingAccessChecked
      - existingAccess
      properties:
        course:
          $ref: '#/components/schemas/CourseRef'
        offer:
          $ref: '#/components/schemas/SummaryOffer'
        pendingOrderId:
          type:
          - string
          - 'null'
          format: uuid
          description: Pedido do aluno aguardando pagamento nesta oferta (RN-V06).
        existingAccessChecked:
          type: boolean
          description: Falso quando Matrícula não respondeu; o aviso fica ausente, e nada é bloqueado.
        existingAccess:
          oneOf:
          - $ref: '#/components/schemas/ExistingAccess'
          - type: 'null'
    CreateOrderInput:
      type: object
      additionalProperties: false
      required:
      - offerId
      properties:
        offerId:
          type: string
          format: uuid
          description: Oferta publicada a comprar. Preço e vigência **não** são aceitos do cliente; vêm da oferta
            no instante da criação.
    StudentOrder:
      type: object
      additionalProperties: false
      required:
      - orderId
      - number
      - status
      - course
      - offer
      - priceCents
      - currency
      - accessPeriod
      - paymentMethod
      - pendingPayment
      - paymentPageExpiresAt
      - accessGrantedAt
      - createdAt
      - paidAt
      - expiredAt
      - cancelledAt
      properties:
        orderId:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^[0-9]{6,}$
          description: Número do pedido para o aluno e o financeiro ("Pedido nº 000123"), sequencial por escola.
            Também no comprovante.
          examples:
          - '000123'
        status:
          $ref: '#/components/schemas/OrderStatus'
        course:
          $ref: '#/components/schemas/CourseRef'
        offer:
          $ref: '#/components/schemas/OfferRef'
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        currency:
          $ref: '#/components/schemas/Currency'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - type: 'null'
          description: Meio do PIX ou boleto pendente, ou o que pagou. Nulo enquanto nenhum foi escolhido.
        pendingPayment:
          oneOf:
          - $ref: '#/components/schemas/PendingPayment'
          - type: 'null'
        paymentPageExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Até quando vale a página de pagamento aberta sem meio escolhido (24 h, RN-CB03). Nulo se nunca
            foi aberta, depois de escolhido o meio, ou em pedido terminal.
        accessGrantedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Momento da concessão deste pedido em Matrícula, quando já existe (C-07). **Exibição**, não decisão
            de acesso (RN-V10).
        createdAt:
          type: string
          format: date-time
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Momento em que o gateway confirmou o pagamento.
        expiredAt:
          type:
          - string
          - 'null'
          format: date-time
        cancelledAt:
          type:
          - string
          - 'null'
          format: date-time
    StudentOrderPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentOrder'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    OrderPaymentRedirect:
      type: object
      additionalProperties: false
      required:
      - orderId
      - kind
      - paymentUrl
      - expiresAt
      properties:
        orderId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - checkout
          - pix-instructions
          - boleto-instructions
          description: Página para escolher o meio e pagar, ou instruções do PIX ou do boleto já gerados.
        paymentUrl:
          type: string
          format: uri
          description: Endereço do gateway para o navegador. Credencial de acesso ao pagamento; nunca registrado.
        expiresAt:
          type: string
          format: date-time
    FinanceOrderSummary:
      type: object
      additionalProperties: false
      required:
      - orderId
      - number
      - studentId
      - status
      - courseId
      - courseTitle
      - offerName
      - priceCents
      - currency
      - paymentMethod
      - createdAt
      - paidAt
      properties:
        orderId:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^[0-9]{6,}$
        studentId:
          type: string
          format: uuid
          description: Conta de aluno, por referência. Nome e e-mail são resolvidos pelo `bff-admin`.
        status:
          $ref: '#/components/schemas/OrderStatus'
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
        offerName:
          type: string
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        currency:
          $ref: '#/components/schemas/Currency'
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
    FinanceOrderPage:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FinanceOrderSummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    FinanceOrderDetail:
      type: object
      additionalProperties: false
      required:
      - orderId
      - number
      - studentId
      - status
      - courseId
      - courseTitle
      - offerId
      - offerName
      - priceCents
      - currency
      - accessPeriod
      - paymentMethod
      - paymentReference
      - paidAmountCents
      - grantId
      - accessGrantedAt
      - createdAt
      - paymentPageExpiresAt
      - paidAt
      - expiredAt
      - cancelledAt
      properties:
        orderId:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^[0-9]{6,}$
        studentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
        offerId:
          type: string
          format: uuid
        offerName:
          type: string
        priceCents:
          $ref: '#/components/schemas/PriceCents'
        currency:
          $ref: '#/components/schemas/Currency'
        accessPeriod:
          $ref: '#/components/schemas/AccessPeriod'
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - type: 'null'
        paymentReference:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Identificador opaco do pagamento no gateway, só para localizar no painel dele (RF-11). Nulo
            antes de haver pagamento.
        paidAmountCents:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Valor que o gateway confirmou. Igual a `priceCents` no caso normal; diferente, o pedido é pago
            assim mesmo (RN-V08) e a divergência fica visível aqui.
        grantId:
          type:
          - string
          - 'null'
          format: uuid
          description: Concessão de Matrícula originada por este pedido, quando já existe.
        accessGrantedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        paymentPageExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Prazo da última página de pagamento aberta.
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
        expiredAt:
          type:
          - string
          - 'null'
          format: date-time
        cancelledAt:
          type:
          - string
          - 'null'
          format: date-time
    PaginationInfo:
      type: object
      additionalProperties: false
      required:
      - page
      - size
      - total
      - totalPages
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PurchaseIntentAccepted:
      type: object
      additionalProperties: false
      required:
      - purchaseAvailability
      properties:
        purchaseAvailability:
          type: string
          enum:
          - coming-soon
          - available
          description: '`available` a partir de 1.4.0 (DP-06): a compra existe e o clique não é mais contado. `coming-soon`
            não volta a ocorrer.'
  examples:
    OrderAwaitingNoMethod:
      summary: Pedido criado, página de pagamento ainda não aberta
      value:
        orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
        number: '000123'
        status: awaiting-payment
        course:
          courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
          title: .NET do zero à API
        offer:
          offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
          name: Acesso por 12 meses
        priceCents: 49700
        currency: BRL
        accessPeriod:
          type: months
          months: 12
        paymentMethod: null
        pendingPayment: null
        paymentPageExpiresAt: null
        accessGrantedAt: null
        createdAt: '2026-10-05T14:19:30Z'
        paidAt: null
        expiredAt: null
        cancelledAt: null
    OrderAwaitingBoleto:
      summary: Boleto gerado, ainda não pago
      value:
        orderId: 2c3d4e5f-6071-4829-8b3c-4d5e6f7a8b92
        number: '000124'
        status: awaiting-payment
        course:
          courseId: 9a7e5c31-2b4d-4f68-8e01-6d3c5a7b9f24
          title: React na prática
        offer:
          offerId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          name: Acesso por 6 meses
        priceCents: 29700
        currency: BRL
        accessPeriod:
          type: months
          months: 6
        paymentMethod: boleto
        pendingPayment:
          method: boleto
          expiresAt: '2026-10-09T02:59:59Z'
        paymentPageExpiresAt: null
        accessGrantedAt: null
        createdAt: '2026-10-06T10:00:00Z'
        paidAt: null
        expiredAt: null
        cancelledAt: null
    OrderPaid:
      summary: Pago por cartão, concessão já existente
      value:
        orderId: 1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7a81
        number: '000123'
        status: paid
        course:
          courseId: 6f1e2d3c-4b5a-4c69-8d7e-1f2a3b4c5d6e
          title: .NET do zero à API
        offer:
          offerId: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
          name: Acesso por 12 meses
        priceCents: 49700
        currency: BRL
        accessPeriod:
          type: months
          months: 12
        paymentMethod: card
        pendingPayment: null
        paymentPageExpiresAt: null
        accessGrantedAt: '2026-10-05T14:21:04Z'
