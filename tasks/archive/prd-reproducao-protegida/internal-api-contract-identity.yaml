openapi: 3.1.0
info:
  title: Identity — JWT de aluno para Media e Learning (interno)
  version: 1.1.0
  description: 'Recorte de `CAP-007` sobre `tasks/prd-conta-aluno/internal-api-contract.yaml` 1.0.0. Só `validateStudentSessionInternal`
    é repetida, com a mudança **aditiva** de C-04; nenhuma outra operação de Identity muda. Consumidor único conhecido:
    BFF do aluno.'
  contact:
    name: Time de Identidade e Acesso
servers:
- url: /internal/v1
  description: Rota privada de Identity, inacessível ao navegador
tags:
- name: StudentIdentity
  description: Sessão de aluno e JWT de destino
paths:
  /student-session-validations:
    post:
      tags:
      - StudentIdentity
      summary: Validar e renovar sessão
      description: 'Sem mudança de comportamento em relação a 1.0.0: valida sessão, tenant, situação da Conta e
        expiração; renova a inatividade atomicamente; com `audience`, emite JWT de aluno curto só para aquela audiência
        autorizada. Mudança aditiva deste recorte (C-04): `media` e `learning` passam a ser audiências autorizadas,
        e o JWT de `media` carrega `email`. Falha fecha acesso.'
      operationId: validateStudentSessionInternal
      security:
      - BffServiceAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionValidationInput'
            examples:
              paraMedia:
                value:
                  sessionId: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                  audience: media
      responses:
        '200':
          description: Sessão ativa com expiração renovada e JWT opcional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionValidated'
              examples:
                comToken:
                  value:
                    accountId: 6f1e2d3c-4b5a-4968-8777-a1b2c3d4e5f6
                    name: Marina Alves
                    expiresAt: '2026-10-05T18:00:00Z'
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImlkMS0yMDI2LTEwIn0.eyJpc3MiOiJpZGVudGl0eSIsImF1ZCI6Im1lZGlhIn0.c2lnbmF0dXJl
        '400':
          description: JSON ou campo obrigatório inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalido:
                  value:
                    type: about:blank
                    title: Requisição inválida.
                    status: 400
                    code: VALIDATION_ERROR
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '401':
          description: Asserção de serviço inválida, ou sessão ausente, expirada ou revogada; distinguir por `code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sessaoRevogada:
                  value:
                    type: about:blank
                    title: Sessão revogada.
                    status: 401
                    code: SESSION_REVOKED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
        '403':
          description: Audiência de JWT não autorizada para o BFF do aluno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                audiencia:
                  value:
                    type: about:blank
                    title: Audiência não autorizada.
                    status: 403
                    code: AUDIENCE_NOT_ALLOWED
                    traceId: 00-9f2b5d6c4e7a8b90123456789abcdef0-0123456789abcdef-01
components:
  securitySchemes:
    BffServiceAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de serviço assimétrico curto emitido pelo BFF do aluno. Identity valida assinatura, kid,
        emissor, audiência, escopo, tenant, validade e jti contra replay. Não é JWT de aluno.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Código estável para tratamento no cliente.
        traceId:
          type: string
        reason:
          type: string
          enum:
          - no-grant
          - grant-ended
          description: 'Só em `ACCESS_DENIED`: `no-grant` (nunca teve acesso ao curso) ou `grant-ended` (já teve,
            nenhuma concessão está ativa). Clientes devem tolerar valor novo (`suspended` e `revoked` virão com
            `CAP-009`).'
        accessEndedAt:
          type: string
          format: date-time
          description: 'Só em `ACCESS_DENIED` com `reason: grant-ended`: término (exclusivo, UTC) da última concessão.
            O último dia de acesso é o dia anterior a este instante, no fuso da escola (DP-03 de `CAP-008`); é a
            data da mensagem "Seu acesso a este curso terminou em ...".'
    SessionValidationInput:
      type: object
      additionalProperties: false
      required:
      - sessionId
      properties:
        sessionId:
          type: string
          format: uuid
        audience:
          type: string
          minLength: 1
          description: 'Omitido quando o BFF só precisa consultar a sessão; obrigatório para obter JWT de destino.
            Audiências de aluno autorizadas para o BFF do aluno, neste recorte: `media` e `learning` (C-04). Audiência
            não autorizada → 403.'
          examples:
          - media
    SessionValidated:
      type: object
      additionalProperties: false
      required:
      - accountId
      - name
      - expiresAt
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
        accessToken:
          type: string
          description: 'JWT interno de aluno; presente somente quando `audience` foi solicitada. Vida curta, RS256,
            claims `iss`, `aud`, `sub`, `tenantId`, `sessionId`, `exp`, `jti`. **Com `audience: media`, acrescenta
            a claim `email`**, o e-mail da conta: exposição declarada de Identidade RN-21, para a marca d''água.
            Em nenhuma outra audiência a claim existe. O e-mail nunca vai em log, URL ou métrica.'
