asyncapi: 3.0.0
info:
  title: Identity — identificação fiscal informada
  version: 1.2.0
  description: |
    Recorte de `CAP-016`, `tasks/prd-emissao-nfse/prd.md` v1.0, aprovado em 2026-10-11.
    Evolui `contracts/identity/asyncapi.yaml` 1.1.0 com um fato novo.
    Conta criada, conta confirmada, senha e pedidos de envio já existentes não mudam e não estão aqui.

    O payload não leva CPF, CNPJ, NIF, e-mail nem nome (G23). O fiscal relê a conta em Identity na hora de emitir.
id: urn:code-4-coders:identity
defaultContentType: application/json
servers:
  rabbitmq:
    host: '{host}'
    protocol: amqp
    description: RabbitMQ do baseline. Topologia física é configuração de implantação.
    variables:
      host:
        default: localhost
channels:
  identificacaoFiscalInformada:
    address: identidade.identificacao-fiscal-informada.v1
    description: A conta de aluno passou a ter outro documento de tomador, ou o primeiro.
    messages:
      identificacaoFiscalInformada:
        $ref: '#/components/messages/IdentificacaoFiscalInformada'
operations:
  publicarIdentificacaoFiscalInformada:
    action: send
    summary: Publicar que o documento do tomador da conta mudou.
    channel:
      $ref: '#/channels/identificacaoFiscalInformada'
    messages:
      - $ref: '#/channels/identificacaoFiscalInformada/messages/identificacaoFiscalInformada'
    description: |
      Outbox na mesma transação da gravação (G06). Um fato por mudança de valor. Gravar o mesmo valor de novo não publica.
      Ao menos uma vez. Consumidor conhecido: `billing` (Fiscal), que deduplica por `eventId` e relê o documento.
      Sem ordenação prometida em relação a `vendas.compra-concluida.v1`.
components:
  messages:
    IdentificacaoFiscalInformada:
      name: IdentificacaoFiscalInformada
      title: Identificação fiscal informada
      contentType: application/json
      correlationId:
        location: $message.header#/correlationId
      headers:
        $ref: '#/components/schemas/Cabecalho'
      payload:
        $ref: '#/components/schemas/IdentificacaoFiscalInformadaPayload'
      examples:
        - name: troca
          headers:
            correlationId: 00-c3d4e5f60718293a4b5c6d7e8f900112-c3d4e5f60718293a-01
          payload:
            eventId: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
            tenantId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
            studentId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
            occurredAt: '2026-10-11T19:12:00Z'
  schemas:
    Cabecalho:
      type: object
      additionalProperties: false
      required: [correlationId]
      properties:
        correlationId:
          type: string
    IdentificacaoFiscalInformadaPayload:
      type: object
      additionalProperties: false
      required: [eventId, tenantId, studentId, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: Um por mudança. Chave de deduplicação.
        tenantId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
          description: Conta cujo documento mudou. O valor do documento não viaja.
        occurredAt:
          type: string
          format: date-time
