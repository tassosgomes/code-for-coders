load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes auto;
# Error diagnostics contain the request URI; the edge logs only credential-free access records.
error_log /dev/null crit;
# Unprivileged master writes its pid under /tmp.
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format credential_free '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log credential_free;
    sendfile on;
    include /etc/nginx/conf.d/*.conf;
}
