# Override that points the local APIs at the shared development infrastructure
# (PostgreSQL, RabbitMQ, Valkey, OTel Collector, and smtp4dev) instead of local containers.
# Provision it first with: scripts/remote-infra.sh provision
# Used by: scripts/apps.sh start --remote
# The PostgreSQL server is shared (max_connections=200), so every pool is capped via
# REMOTE_DB_MAX_POOL_SIZE (default 10) and idle connections are released after 60 s.

x-remote-environment: &remote-environment
  RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
  RabbitMq__Username: code_for_coders
  RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?run scripts/remote-infra.sh provision}
  RabbitMq__VirtualHost: code-for-coders
  Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?run scripts/remote-infra.sh provision},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
  OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317

services:
  identity:
    environment:
      <<: *remote-environment
      ServiceAssertions__Issuers__commerce__PublicKeys__local-commerce-identity-1: ${COMMERCE_IDENTITY_PUBLIC_KEY_B64:?run scripts/generate-local-env.sh}
      ServiceAssertions__Issuers__commerce__AllowedScopes__0: student-account:confirm
      ServiceAssertions__Issuers__commerce__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__9: ${BFF_ADMIN_STUDENT_LOOKUP_SCOPE:-student-account:lookup}
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_identity;Username=code_for_coders_identity;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !reset {}

  learning:
    environment:
      <<: *remote-environment
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_learning;Username=code_for_coders_learning;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !reset {}

  media:
    environment:
      <<: *remote-environment
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_media;Username=code_for_coders_media;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !override
      minio-bucket-init:
        condition: service_completed_successfully

  media-worker:
    environment:
      <<: *remote-environment
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_media;Username=code_for_coders_media;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !override
      minio-bucket-init:
        condition: service_completed_successfully

  commerce:
    environment:
      <<: *remote-environment
      StudentAccountIdentity__BaseAddress: http://identity:8080/
      StudentAccountIdentity__Issuer: commerce
      StudentAccountIdentity__SigningKeyBase64: ${COMMERCE_IDENTITY_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      StudentAccountIdentity__SchoolTimeZone: ${SCHOOL_TIME_ZONE:-America/Sao_Paulo}
      RabbitMq__EntitlementFactRetentionQueue: commerce.entitlement-fact-retention
      RabbitMq__EntitlementFactRetentionMaxLength: ${ENTITLEMENT_FACT_RETENTION_MAX_LENGTH:-10000}
      RabbitMq__EntitlementFactRetentionTtlMilliseconds: ${ENTITLEMENT_FACT_RETENTION_TTL_MS:-86400000}
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_commerce;Username=code_for_coders_commerce;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !override
      identity:
        condition: service_healthy
      audit:
        condition: service_healthy

  notification:
    environment:
      <<: *remote-environment
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_notification;Username=code_for_coders_notification;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      Email__SmtpHost: ${REMOTE_INFRA_HOST:-192.168.0.5}
    depends_on: !reset {}

  audit:
    environment:
      <<: *remote-environment
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_audit;Username=code_for_coders_audit_runtime;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !reset {}

  bff-admin:
    environment:
      <<: *remote-environment
      RabbitMq__Username: code_for_coders_bff_admin
      RabbitMq__Password: ${BFF_ADMIN_RABBITMQ_PASSWORD:?run scripts/remote-infra.sh provision}
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_bff_admin;Username=code_for_coders_bff_admin;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !override
      learning:
        condition: service_healthy

  bff-student:
    environment:
      <<: *remote-environment
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_bff_student;Username=code_for_coders_bff_student;Password=${REMOTE_DB_PASSWORD:?run scripts/remote-infra.sh provision};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
    depends_on: !override
      identity:
        condition: service_healthy
