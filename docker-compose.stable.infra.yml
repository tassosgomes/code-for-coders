name: infra

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Application-side settings for the media worker that consumes this shared S3 service.
# Keep this template aligned with docker-compose.stable.yml; infrastructure does not run a worker.
x-media-transcription-environment:
  Transcription__Service__BaseAddress: ${WHISPER_BASE_ADDRESS:-https://whisper.lab.tasso.dev.br/v1}
  Transcription__Service__ApiKey: ${WHISPER_API_KEY:-}
  AwsMedia__EndpointTranscription: ${AWS_S3_TRANSCRIPTION_ENDPOINT:-http://192.168.0.11:9000}
  Transcription__SourceUrlLifetimeMinutes: ${TRANSCRIPTION_SOURCE_URL_LIFETIME_MINUTES:-90}
  Transcription__MaxWaitHours: ${TRANSCRIPTION_MAX_WAIT_HOURS:-30}
  Transcription__MaxConcurrency: ${TRANSCRIPTION_MAX_CONCURRENCY:-1}
  Transcription__MaxSubmissions: ${TRANSCRIPTION_MAX_SUBMISSIONS:-3}
  Transcription__InitialPollSeconds: ${TRANSCRIPTION_INITIAL_POLL_SECONDS:-60}
  Transcription__IntermediatePollSeconds: ${TRANSCRIPTION_INTERMEDIATE_POLL_SECONDS:-300}
  Transcription__LongPollSeconds: ${TRANSCRIPTION_LONG_POLL_SECONDS:-900}
  Transcription__MinimumFreeDiskBytes: ${TRANSCRIPTION_MINIMUM_FREE_DISK_BYTES:-2147483648}

services:
  postgres:
    image: postgres:18
    container_name: infra-postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra .env}
      POSTGRES_DB: postgres
      TZ: ${TZ:-America/Fortaleza}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: infra-rabbitmq
    <<: [*restart, *logging]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in infra .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in infra .env}
      TZ: ${TZ:-America/Fortaleza}
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:5672:5672"
      - "${STABLE_HOST_IP:-192.168.0.11}:15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: infra-valkey
    <<: [*restart, *logging]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in infra .env}
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?set in infra .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:6379:6379"
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: infra-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: infra-minio
    <<: [*restart, *logging]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra .env}
      TZ: ${TZ:-America/Fortaleza}
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:9000:9000"
      - "${STABLE_HOST_IP:-192.168.0.11}:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: infra-otel-collector
    <<: [*restart, *logging]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:4317:4317"
      - "${STABLE_HOST_IP:-192.168.0.11}:4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: infra-smtp4dev
    <<: [*restart, *logging]
    environment:
      TZ: ${TZ:-America/Fortaleza}
    ports:
      - "${STABLE_HOST_IP:-192.168.0.11}:25:25"
    volumes:
      - smtp4dev:/smtp4dev

volumes:
  postgres:
    name: infra-postgres
  rabbitmq:
    name: infra-rabbitmq
  valkey:
    name: infra-valkey
  minio:
    name: infra-minio
  smtp4dev:
    name: infra-smtp4dev
