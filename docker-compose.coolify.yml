# Stack deployed by Coolify (project code4coders, environment development) on 192.168.0.11.
# Builds every service from this repository and points them at the shared development
# infrastructure on 192.168.0.5 (PostgreSQL, RabbitMQ, Valkey, OTel Collector, smtp4dev).
# Provision/credentials: scripts/remote-infra.sh provision (values live in Coolify env vars).
# The PostgreSQL server is shared (max_connections=200), so every pool is capped via
# REMOTE_DB_MAX_POOL_SIZE (default 10) and idle connections are released after 60 s.

services:
  media-edge:
    build:
      context: .
      dockerfile: src/media-edge/Dockerfile
    environment:
      MEDIA_EDGE_SHARED_SECRET: ${MEDIA_EDGE_SHARED_SECRET:?run scripts/generate-local-env.sh}
      MEDIA_EDGE_SPA_ORIGIN: ${STUDENT_SPA_URL:-https://c4c-student.lab.tasso.dev.br}
      MEDIA_EDGE_S3_HOST: ${REMOTE_INFRA_HOST:-192.168.0.5}:9000
      MEDIA_EDGE_S3_ACCESS_KEY: code_for_coders_media
      MEDIA_EDGE_S3_SECRET_KEY: ${REMOTE_S3_SECRET_KEY:?set in Coolify}
      MEDIA_EDGE_S3_BUCKET: ${AWS_MEDIA_BUCKET:?set in Coolify}
      MEDIA_EDGE_S3_PREFIX: ${AWS_MEDIA_OBJECT_PREFIX:-media}
      MEDIA_EDGE_S3_REGION: us-east-1
    ports:
      - "5109:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  identity:
    build:
      context: .
      dockerfile: src/identity/Dockerfile
    expose:
      - "8080"
    environment:
      ServiceAssertions__Issuers__notification__PublicKeys__local-notification-identity-1: ${NOTIFICATION_IDENTITY_PUBLIC_KEY_B64:?run scripts/generate-local-env.sh}
      ServiceAssertions__Issuers__notification__AllowedScopes__0: student-contact:read
      ServiceAssertions__Issuers__notification__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      StudentSessionTokens__Issuer: identity
      StudentSessionTokens__SigningKeyId: local-student-1
      StudentSessionTokens__SigningKeyBase64: ${IDENTITY_STUDENT_TOKEN_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      StudentSessionTokens__LifetimeMinutes: "5"
      StudentSessionTokens__AudienceScopes__learning: lessons:read
      StudentSessionTokens__AudienceScopes__commerce: orders:use
      StudentSessionTokens__AudienceScopes__media: playback:use
      StudentSessionTokens__EmailAudiences__0: media
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_identity;Username=code_for_coders_identity;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      RabbitMq__NotificationExchange: notification.events.${NOTIFICATION_NAMESPACE:-default}
      StaffSessionTokens__Issuer: identity
      StaffSessionTokens__SigningKeyId: local-dev-1
      StaffSessionTokens__SigningKeyBase64: ${IDENTITY_STAFF_TOKEN_PRIVATE_KEY_B64:?set in Coolify}
      StaffSessionTokens__LifetimeMinutes: "5"
      StaffSessionTokens__AudienceScopes__commerce: finance-area:read
      StaffSessionTokens__AudienceScopes__media: videos:write
      StaffSessionTokens__AudienceScopes__learning: courses:authoring
      StaffSessionTokens__AudienceScopes__audit: audit-records:read
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
      StudentAccount__ConfirmationBaseUrl: ${STUDENT_SPA_URL:-https://c4c-student.lab.tasso.dev.br}/student/confirm-account
      StudentAccount__ConfirmationLifetimeHours: ${ACCOUNT_CONFIRMATION_VALIDITY_HOURS:-24}
      StudentAccount__PasswordResetBaseUrl: ${STUDENT_SPA_URL:-https://c4c-student.lab.tasso.dev.br}/student/redefinir-senha
      StudentAccount__PasswordResetLifetimeHours: ${PASSWORD_RESET_VALIDITY_HOURS:-1}
      StaffAccount__PasswordResetBaseUrl: ${ADMIN_SPA_URL:-https://c4c-admin.lab.tasso.dev.br}/admin/redefinir-senha
      StaffAccount__PasswordResetLifetimeHours: ${PASSWORD_RESET_VALIDITY_HOURS:-1}
      StaffInvitation__AcceptanceBaseUrl: ${ADMIN_SPA_URL:-https://c4c-admin.lab.tasso.dev.br}/admin/convite
      StaffInvitation__LifetimeHours: ${STAFF_INVITATION_VALIDITY_HOURS:-168}
      RabbitMq__AuditExchange: audit.events
      Idempotency__FingerprintKeyBase64: ${IDENTITY_IDEMPOTENCY_KEY_B64:?set in Coolify}
      OutboxProtection__KeyBase64: ${IDENTITY_OUTBOX_KEY_B64:?set in Coolify}
      ServiceAssertions__Issuer: bff-student
      ServiceAssertions__Audience: identity-internal
      ServiceAssertions__PublicKeys__local-dev-1: ${BFF_IDENTITY_PUBLIC_KEY_B64:?set in Coolify}
      ServiceAssertions__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      ServiceAssertions__Issuers__bff-student__PublicKeys__local-dev-1: ${BFF_IDENTITY_PUBLIC_KEY_B64:?set in Coolify}
      ServiceAssertions__Issuers__bff-student__AllowedScopes__0: student-accounts:create
      ServiceAssertions__Issuers__bff-student__AllowedScopes__1: student-accounts:confirm
      ServiceAssertions__Issuers__bff-student__AllowedScopes__2: student-accounts:request-confirmation
      ServiceAssertions__Issuers__bff-student__AllowedScopes__3: student-sessions:create
      ServiceAssertions__Issuers__bff-student__AllowedScopes__4: student-sessions:validate
      ServiceAssertions__Issuers__bff-student__AllowedScopes__5: student-sessions:revoke
      ServiceAssertions__Issuers__bff-student__AllowedScopes__6: student-password-resets:request
      ServiceAssertions__Issuers__bff-student__AllowedScopes__7: student-password-resets:execute
      ServiceAssertions__Issuers__bff-student__AllowedScopes__8: student-password-changes:execute
      ServiceAssertions__Issuers__bff-student__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      ServiceAssertions__Issuers__bff-admin__PublicKeys__local-dev-1: ${BFF_ADMIN_IDENTITY_PUBLIC_KEY_B64:?set in Coolify}
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__0: staff-sessions:create
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__1: staff-sessions:validate
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__2: staff-sessions:revoke
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__3: staff-passwords:reset
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__4: staff-invitations:read
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__5: staff-invitations:write
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__6: staff-members:read
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__7: staff-members:write
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__8: audit-references:read
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__9: ${BFF_ADMIN_STUDENT_LOOKUP_SCOPE:-student-account:lookup}
      ServiceAssertions__Issuers__bff-admin__AllowedScopes__10: ${BFF_ADMIN_STUDENT_RESOLVE_SCOPE:-student-account:resolve}
      ServiceAssertions__Issuers__bff-admin__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      ServiceAssertions__Issuers__commerce__PublicKeys__local-commerce-identity-1: ${COMMERCE_IDENTITY_PUBLIC_KEY_B64:?run scripts/generate-local-env.sh}
      ServiceAssertions__Issuers__commerce__AllowedScopes__0: student-account:confirm
      ServiceAssertions__Issuers__commerce__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  learning:
    depends_on:
      audit:
        condition: service_healthy
      media-worker:
        condition: service_healthy
    build:
      context: .
      dockerfile: src/learning/Dockerfile
    expose:
      - "8080"
    environment:
      AccessDecision__BaseAddress: http://commerce:8080/
      AccessDecision__SigningKeyId: local-learning-commerce-1
      AccessDecision__SigningKeyBase64: ${LEARNING_COMMERCE_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      AccessDecision__TimeoutSeconds: "2"
      AccessDecision__CacheSeconds: "30"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_learning;Username=code_for_coders_learning;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      LearningTokens__Issuer: identity
      LearningTokens__Audience: learning
      LearningTokens__JwksUrl: http://identity:8080/internal/v1/jwks
      RabbitMq__MediaExchange: media.events
      RabbitMq__VideoFactsQueue: learning.video-availability
      RabbitMq__AuditExchange: audit.events
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  media:
    build:
      context: .
      dockerfile: src/media/Dockerfile
    expose:
      - "8080"
    environment:
      AccessDecision__BaseAddress: http://commerce:8080/
      AccessDecision__SigningKeyId: local-media-commerce-1
      AccessDecision__SigningKeyBase64: ${MEDIA_COMMERCE_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      Playback__Delivery__Adapter: DevelopmentEdge
      Playback__Delivery__BaseAddress: ${MEDIA_EDGE_PUBLIC_URL:?set the public HTTPS edge address}
      Playback__Delivery__SharedSecret: ${MEDIA_EDGE_SHARED_SECRET:?run scripts/generate-local-env.sh}
      Preparation__MasterKey: ${MEDIA_PREPARATION_MASTER_KEY:?set in environment}
      Preparation__MasterKeyId: ${MEDIA_PREPARATION_MASTER_KEY_ID:-local-v1}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_media;Username=code_for_coders_media;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      Media__Role: api
      RabbitMq__ManagementUri: ${RABBITMQ_MANAGEMENT_URI:-https://rabbit.tasso.dev.br}
      MediaTokens__Issuer: identity
      MediaTokens__Audience: media
      MediaTokens__JwksUrl: http://identity:8080/internal/v1/jwks
      AwsMedia__Region: ${AWS_REGION:-us-east-1}
      AwsMedia__BucketName: ${AWS_MEDIA_BUCKET:?set in Coolify}
      AwsMedia__ObjectKeyPrefix: ${AWS_MEDIA_OBJECT_PREFIX:-media}
      AwsMedia__EndpointInternal: ${AWS_S3_ENDPOINT:-}
      AwsMedia__EndpointPublic: ${AWS_S3_PUBLIC_ENDPOINT:-}
      AwsMedia__AccessKeyId: ${AWS_ACCESS_KEY_ID:-}
      AwsMedia__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-}
      AwsMedia__ForcePathStyle: ${AWS_S3_FORCE_PATH_STYLE:-false}
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      RabbitMq__AuditMessageTtlMilliseconds: ${MEDIA_AUDIT_TTL_MS:-604800000}
      RabbitMq__AuditMaxLength: ${MEDIA_AUDIT_MAX_LENGTH:-100000}
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  media-worker:
    build:
      context: .
      dockerfile: src/media/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_media;Username=code_for_coders_media;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      Media__Role: worker
      RabbitMq__LearningExchange: learning.events
      RabbitMq__CoursePublicationsQueue: media.course-publications
      RabbitMq__ManagementUri: ${RABBITMQ_MANAGEMENT_URI:-https://rabbit.tasso.dev.br}
      MediaTokens__Issuer: identity
      MediaTokens__Audience: media
      MediaTokens__JwksUrl: http://identity:8080/internal/v1/jwks
      AwsMedia__Region: ${AWS_REGION:-us-east-1}
      AwsMedia__BucketName: ${AWS_MEDIA_BUCKET:?set in Coolify}
      AwsMedia__ObjectKeyPrefix: ${AWS_MEDIA_OBJECT_PREFIX:-media}
      AwsMedia__EndpointInternal: ${AWS_S3_ENDPOINT:-}
      AwsMedia__EndpointPublic: ${AWS_S3_PUBLIC_ENDPOINT:-}
      AwsMedia__AccessKeyId: ${AWS_ACCESS_KEY_ID:-}
      AwsMedia__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-}
      AwsMedia__ForcePathStyle: ${AWS_S3_FORCE_PATH_STYLE:-false}
      Preparation__MasterKey: ${MEDIA_PREPARATION_MASTER_KEY:?set in Coolify}
      Preparation__MasterKeyId: ${MEDIA_PREPARATION_MASTER_KEY_ID:?set in Coolify}
      Preparation__Threads: ${MEDIA_PREPARATION_THREADS:-2}
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      RabbitMq__AuditMessageTtlMilliseconds: ${MEDIA_AUDIT_TTL_MS:-604800000}
      RabbitMq__AuditMaxLength: ${MEDIA_AUDIT_MAX_LENGTH:-100000}
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
    volumes:
      - media-worker-work:/var/lib/media-work
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  commerce:
    build:
      context: .
      dockerfile: src/commerce/Dockerfile
    expose:
      - "8080"
    environment:
      RabbitMq__RoutingExchanges__notificacao.envio-solicitado.v1: notification.events.${NOTIFICATION_NAMESPACE:-default}
      RabbitMq__RoutingExchanges__auditoria.ato-praticado.v1: audit.events
      BillingClient__BaseUrl: http://billing:8080/
      BillingClient__Issuer: commerce
      BillingClient__Audience: billing
      BillingClient__SigningKeyId: local-commerce-billing-1
      BillingClient__SigningKeyBase64: ${COMMERCE_BILLING_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      StudentApp__PublicBaseUrl: ${STUDENT_APP_PUBLIC_BASE_URL:-http://localhost:8082}
      RabbitMq__BillingExchange: billing.events
      RabbitMq__SalesPaymentsQueue: commerce.sales-payments
      RabbitMq__EntitlementPurchasesQueue: commerce.entitlement-purchases
      RabbitMq__SalesAccessGrantedQueue: commerce.sales-access-granted
      ServiceAssertions__Issuers__learning__PublicKeys__local-learning-commerce-1: ${LEARNING_COMMERCE_PUBLIC_KEY_B64:?run scripts/generate-local-env.sh}
      ServiceAssertions__Issuers__media__PublicKeys__local-media-commerce-1: ${MEDIA_COMMERCE_PUBLIC_KEY_B64:?run scripts/generate-local-env.sh}
      ServiceAssertions__Issuers__media__AllowedScopes__0: access-decision:read
      ServiceAssertions__Issuers__media__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      ServiceAssertions__Issuers__learning__AllowedScopes__0: access-decision:read
      ServiceAssertions__Issuers__learning__AllowedScopes__1: course-access:read
      ServiceAssertions__Issuers__learning__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_commerce;Username=code_for_coders_commerce;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      FinanceAreaTokens__Issuer: identity
      FinanceAreaTokens__Audience: commerce
      StudentAccountIdentity__BaseAddress: http://identity:8080/
      StudentAccountIdentity__Issuer: commerce
      StudentAccountIdentity__Audience: identity-internal
      StudentAccountIdentity__SigningKeyId: local-commerce-identity-1
      StudentAccountIdentity__SigningKeyBase64: ${COMMERCE_IDENTITY_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      StudentAccountIdentity__SchoolTimeZone: ${SCHOOL_TIME_ZONE:-America/Sao_Paulo}
      RabbitMq__EntitlementFactRetentionQueue: commerce.entitlement-fact-retention
      RabbitMq__EntitlementFactRetentionMaxLength: ${ENTITLEMENT_FACT_RETENTION_MAX_LENGTH:-10000}
      RabbitMq__EntitlementFactRetentionTtlMilliseconds: ${ENTITLEMENT_FACT_RETENTION_TTL_MS:-86400000}
      FinanceAreaTokens__JwksUrl: http://identity:8080/internal/v1/jwks
      ServiceAssertions__Audience: commerce
      ServiceAssertions__Issuers__bff-student__PublicKeys__local-commerce-1: ${BFF_COMMERCE_PUBLIC_KEY_B64:?set in Coolify}
      ServiceAssertions__Issuers__bff-student__AllowedScopes__0: showcase:read
      ServiceAssertions__Issuers__bff-student__AllowedScopes__1: purchase-intent:write
      ServiceAssertions__Issuers__bff-student__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      RabbitMq__AuditExchange: audit.events
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
    depends_on:
      identity:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  notification:
    build:
      context: .
      dockerfile: src/notification/Dockerfile
    expose:
      - "8080"
    environment:
      StudentContactIdentity__BaseUrl: http://identity:8080/
      StudentContactIdentity__Issuer: notification
      StudentContactIdentity__Audience: identity-internal
      StudentContactIdentity__SigningKeyId: local-notification-identity-1
      StudentContactIdentity__SigningKeyBase64: ${NOTIFICATION_IDENTITY_PRIVATE_KEY_B64:?run scripts/generate-local-env.sh}
      Email__SchoolTimeZone: ${SCHOOL_TIME_ZONE:-America/Sao_Paulo}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_notification;Username=code_for_coders_notification;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
      Email__Transport: smtp
      Email__FromAddress: no-reply@codeforcoders.local
      Email__SendingDomain: codeforcoders.local
      Email__SmtpHost: ${REMOTE_INFRA_HOST:-192.168.0.5}
      Email__SmtpPort: 25
      Email__SmtpEnableSsl: "false"
      Email__ValidityHoursByPurpose__confirmacao-de-conta: ${ACCOUNT_CONFIRMATION_VALIDITY_HOURS:-24}
      Email__ValidityHoursByPurpose__recuperacao-de-senha: ${PASSWORD_RESET_VALIDITY_HOURS:-1}
      Email__ValidityHoursByPurpose__convite-interno: ${STAFF_INVITATION_VALIDITY_HOURS:-168}
      Notification__Namespace: ${NOTIFICATION_NAMESPACE:-default}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  billing:
    build:
      context: .
      dockerfile: src/billing/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_billing;Username=code_for_coders_billing;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      Billing__Namespace: ${BILLING_NAMESPACE:-default}
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      RabbitMq__Exchange: billing.events
      RabbitMq__DeadLetterExchange: billing.events.dlx
      RabbitMq__HeartbeatQueue: billing.platform-heartbeat
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
      ServiceAssertions__Audience: billing
      ServiceAssertions__Issuers__commerce__PublicKeys__local-commerce-billing-1: ${COMMERCE_BILLING_PUBLIC_KEY_B64:?run scripts/generate-local-env.sh}
      ServiceAssertions__Issuers__commerce__AllowedScopes__0: payment:request
      ServiceAssertions__Issuers__commerce__AllowedTenantIds__0: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?set in Coolify}
      Stripe__WebhookSigningSecret: ${STRIPE_WEBHOOK_SECRET:?set in Coolify}
      PaymentReturn__AllowedHosts__0: ${BILLING_RETURN_HOST:-c4c-student.lab.tasso.dev.br}
      # Domínio público do webhook (https://<domínio de billing>/webhooks/v1/stripe/events) a definir;
      # o Coolify deve expor somente /webhooks/v1 deste serviço.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  audit:
    build:
      context: .
      dockerfile: src/audit/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_audit;Username=code_for_coders_audit_runtime;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      AuditTokens__MetadataAddress: http://identity:8080/.well-known/openid-configuration
      AuditTokens__Issuer: identity
      AuditTokens__Audience: audit
      AuditTokens__Scope: audit-records:read
      RabbitMq__AuditComplementQueue: audit.complements
      RabbitMq__AuditComplementEventRoutingKey: auditoria.registro.complemento-confirmado.v1
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      AuditSnapshots__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${AUDIT_VALKEY_DATABASE:-5},abortConnect=false
      AuditSnapshots__KeyPrefix: "code4coders:audit:snapshot:v1:"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  bff-admin:
    build:
      context: .
      dockerfile: src/bff-admin/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_bff_admin;Username=code_for_coders_bff_admin;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      StaffIdentity__BaseAddress: http://identity:8080/
      StaffIdentity__Issuer: bff-admin
      StaffIdentity__Audience: identity-internal
      StaffIdentity__SigningKeyId: local-dev-1
      StaffIdentity__SigningKeyBase64: ${BFF_ADMIN_IDENTITY_PRIVATE_KEY_B64:?set in Coolify}
      StaffIdentity__TenantId: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      BffSecurity__AllowedOrigins__0: ${ADMIN_SPA_URL:-https://c4c-admin.lab.tasso.dev.br}
      OutboxProtection__KeyBase64: ${BFF_ADMIN_OUTBOX_KEY_B64:?set in Coolify}
      OutboxProtection__KeyVersion: ${BFF_ADMIN_OUTBOX_KEY_VERSION:-v1}
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders_bff_admin
      RabbitMq__Password: ${BFF_ADMIN_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
      ReverseProxy__Clusters__admin-backend__Destinations__destination__Address: http://learning:8080/
      Media__BaseAddress: http://media:8080/
      Learning__BaseAddress: http://learning:8080/
      CourseAuthoring__Enabled: ${COURSE_AUTHORING_ENABLED:-false}
      Audit__BaseAddress: http://audit:8080/
      Commerce__BaseAddress: http://commerce:8080/
    depends_on:
      learning:
        condition: service_healthy
      audit:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  bff-student:
    build:
      context: .
      dockerfile: src/bff-student/Dockerfile
    expose:
      - "8080"
    environment:
      Media__BaseAddress: http://media:8080/
      Media__TimeoutSeconds: "5"
      Learning__BaseAddress: http://learning:8080/
      Learning__TimeoutSeconds: "5"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=${REMOTE_INFRA_HOST:-192.168.0.5};Port=5432;Database=code_for_coders_bff_student;Username=code_for_coders_bff_student;Password=${REMOTE_DB_PASSWORD:?set in Coolify};Maximum Pool Size=${REMOTE_DB_MAX_POOL_SIZE:-10};Connection Idle Lifetime=60
      RabbitMq__Host: ${REMOTE_INFRA_HOST:-192.168.0.5}
      RabbitMq__Username: code_for_coders
      RabbitMq__Password: ${REMOTE_RABBITMQ_PASSWORD:?set in Coolify}
      RabbitMq__VirtualHost: code-for-coders
      Valkey__ConnectionString: ${REMOTE_INFRA_HOST:-192.168.0.5}:6379,password=${REMOTE_VALKEY_PASSWORD:?set in Coolify},defaultDatabase=${REMOTE_VALKEY_DATABASE:-1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${REMOTE_INFRA_HOST:-192.168.0.5}:4317
      ReverseProxy__Clusters__student-backend__Destinations__destination__Address: http://identity:8080/
      StudentIdentity__BaseAddress: http://identity:8080/
      StudentIdentity__Issuer: bff-student
      StudentIdentity__Audience: identity-internal
      StudentIdentity__Scope: student-accounts:create student-accounts:confirm student-accounts:request-confirmation student-sessions:create student-sessions:validate student-sessions:revoke student-password-resets:request student-password-resets:execute student-password-changes:execute
      StudentIdentity__SigningKeyId: local-dev-1
      StudentIdentity__SigningKeyBase64: ${BFF_IDENTITY_PRIVATE_KEY_B64:?set in Coolify}
      StudentIdentity__TenantId: ${STUDENT_TENANT_ID:-00000000-0000-7000-8000-000000000001}
      Commerce__BaseAddress: http://commerce:8080/
      Commerce__Issuer: bff-student
      Commerce__Audience: commerce
      Commerce__Scope: showcase:read purchase-intent:write
      Commerce__SigningKeyId: local-commerce-1
      Commerce__SigningKeyBase64: ${BFF_COMMERCE_PRIVATE_KEY_B64:?set in Coolify}
      Cors__AllowedOrigins__0: ${STUDENT_SPA_URL:-https://c4c-student.lab.tasso.dev.br}
    depends_on:
      identity:
        condition: service_healthy
      commerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  admin-spa:
    build:
      context: ./src/admin-spa
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      API_URL: ${ADMIN_SPA_URL:-https://c4c-admin.lab.tasso.dev.br}
    depends_on:
      bff-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  student-spa:
    build:
      context: ./src/student-spa
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      SCHOOL_TIME_ZONE: ${SCHOOL_TIME_ZONE:-America/Sao_Paulo}
      API_URL: ${STUDENT_SPA_URL:-https://c4c-student.lab.tasso.dev.br}
    depends_on:
      bff-student:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  media-worker-work:
