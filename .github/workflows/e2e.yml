name: e2e

# Suíte e2e Playwright dos fluxos críticos (TASK-42.3): login do aluno, compra avulsa, aula com player, login e
# convite no backoffice. Sobe a stack efêmera completa (scripts/e2e-stack.sh) e a derruba ao final.
#
# Não roda em pull_request e não é check obrigatório: roda a cada merge na main que toca SPAs, BFFs ou APIs
# envolvidas e, se falhar, abre (ou comenta em) uma issue com o label `e2e-failure`. Para rodar numa branch de
# PR, use workflow_dispatch (repeat=10 mede estabilidade).
on:
  push:
    branches: [main]
    paths:
      - 'src/student-spa/**'
      - 'src/admin-spa/**'
      - 'src/bff-student/**'
      - 'src/bff-admin/**'
      - 'src/identity/**'
      - 'src/learning/**'
      - 'src/media/**'
      - 'src/media-edge/**'
      - 'src/commerce/**'
      - 'src/billing/**'
      - 'src/notification/**'
      - 'src/audit/**'
      - 'e2e/**'
      - 'docker-compose*.yml'
      - 'scripts/apps.sh'
      - 'scripts/e2e-stack.sh'
      - 'scripts/generate-local-env.sh'
      - 'scripts/init-local-databases.sql'
      - 'Directory.*'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Repetições de cada teste (--repeat-each); use 10 para medir estabilidade.'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOCKER_BUILDKIT: '1'

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar o SDK .NET (migrations)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Instalar o Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar as dependências da suíte
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          # O vídeo da aula é H.264: a suíte usa o Google Chrome (já presente no runner), não o Chromium do Playwright.
          google-chrome --version

      - name: Subir a stack efêmera
        run: scripts/e2e-stack.sh up

      - name: Rodar a suíte
        working-directory: e2e
        env:
          CI: 'true'
          REPEAT: ${{ github.event.inputs.repeat || '1' }}
        run: npm test -- --repeat-each="$REPEAT"

      - name: Logs da stack (falha)
        if: failure()
        run: scripts/e2e-stack.sh logs

      - name: Publicar relatório e traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar a stack
        if: always()
        run: scripts/e2e-stack.sh down

      - name: Abrir ou atualizar a issue de falha (merge na main)
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create e2e-failure --color B60205 --description "A suíte e2e falhou na main" 2>/dev/null || true
          body="A suíte e2e falhou após o merge.

          - Run: ${RUN_URL}
          - Commit: ${COMMIT_URL} (\`${SHA:0:7}\`)

          O relatório e os traces estão no artifact \`playwright-report\` do run."
          existing="$(gh issue list --label e2e-failure --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label e2e-failure --title "e2e falhou na main (${SHA:0:7})" --body "$body"
          fi
