name: ci-gate

# Check estável e obrigatório para a main (ver .github/rulesets/main.json).
# Os workflows de serviço têm filtro de paths, então exigir cada um por nome
# travaria PRs que não tocam aquele serviço. Este workflow roda em TODO PR,
# espera os workflows de PR que foram disparados para o mesmo commit e só passa
# se todos terminaram com sucesso (ou skipped). Workflows que não dispararam
# por causa do filtro de paths simplesmente não existem para o commit e não
# entram na conta. Qualquer workflow novo (ex.: e2e) que rode em pull_request
# passa a ser coberto sem alterar este arquivo.

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Aguardar workflows de PR do commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SETTLE_SECONDS: '30'
          POLL_SECONDS: '20'
        run: |
          set -euo pipefail
          # Dá tempo para o GitHub criar os runs de todos os workflows do evento.
          sleep "$SETTLE_SECONDS"

          while true; do
            runs=$(gh api --paginate \
              "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.name != "ci-gate") | [.name, .status, (.conclusion // "")] | @tsv')

            total=0; pending=0; failed=0
            while IFS=$'\t' read -r name status conclusion; do
              [ -z "$name" ] && continue
              total=$((total + 1))
              if [ "$status" != "completed" ]; then
                pending=$((pending + 1)); continue
              fi
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) failed=$((failed + 1)); echo "::error::workflow '$name' terminou com '$conclusion'" ;;
              esac
            done <<< "$runs"

            if [ "$failed" -gt 0 ]; then
              echo "ci-gate: $failed workflow(s) falharam"; exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "ci-gate: $total workflow(s) aplicáveis, todos verdes"; exit 0
            fi
            echo "ci-gate: aguardando $pending de $total workflow(s)"
            sleep "$POLL_SECONDS"
          done
